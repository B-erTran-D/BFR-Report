        p.line(x, y + 15.5, x + colW, y + 15.5, { color: C.bordFort, width: 0.8 });
        const c = k === 0 ? (i.signatureClient || {}) : { nom: nomTechnicien(i, s), fonction: s.technicien && s.technicien.fonction, contact: contactTech(s.technicien), date: i.date, heure: heureFr(i.chrono && i.chrono.fin) };
        p.text(valeur(c.nom) || '—', x + 6, y + 29, { size: 9.4, font: 'F2', color: C.texte });
        /* Une seule ligne « fonction — téléphone · e-mail » pour ne pas empiéter sur
           la place réservée à la signature (la boîte fait 118 pt de haut). */
        const mention2 = [valeur(c.fonction), valeur(c.contact)].filter(Boolean).join(' — ');
        if (mention2) p.text(mention2, x + 6, y + 40, { size: 7.6, color: C.gris });
        p.text('Date : ' + frDate(c.date || i.date) + (c.heure ? ' à ' + c.heure : ''), x + 6, y + 51, { size: 7.6, color: C.gris });
        const sig = k === 0 ? sigClient : sigTech;
        if (sig) {
          const maxW = colW - 20, maxH = hBloc - 62;
          let w = maxW, h = w * (sig.h / sig.w);
          if (h > maxH) { h = maxH; w = h * (sig.w / sig.h); }
          p.image(Pdf.dataUrlToBytes(sig.dataUrl), x + (colW - w) / 2, y + 58, w, h);
        } else {
          p.text('Signature non recueillie', x + colW / 2, y + 74, { size: 8, color: C.gris, align: 'center' });
        }
      }, this);
      p.y = y + hBloc + 10;
    }

    /* --- génération --- */
    async generer() {
      const p = this.pdf, i = this.i, s = this.s;
      const now = new Date();
      this.dateEdition = 'Édité le ' + now.toLocaleDateString('fr-FR') + ' à ' +
        now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

      /* Logo de la société (celui du modèle par défaut) et logo du client. */
      if (s.societe && s.societe.logo) {
        const jp = await toJpeg(s.societe.logo, 460, 0.92);
        if (jp) this.logo = { bytes: Pdf.dataUrlToBytes(jp.dataUrl), w: jp.w, h: jp.h };
      }
      if (i.client && i.client.logo) {
        const jc = await toJpeg(i.client.logo, 460, 0.92);
        if (jc) this.logoClient = { bytes: Pdf.dataUrlToBytes(jc.dataUrl), w: jc.w, h: jc.h };
      }

      /* ---- Page 1 du modèle : logo, bloc client, titre, « Votre contact » ---- */
      this.entetePrincipale();

      /* ---- Page 2 du modèle : destinataire, date, « À l'attention de » ---- */
      p.newPage();
      this.pageLettre();

      /* ---- Corps du compte rendu (sections du canevas) ---- */
      this.titre('Intervention', valeur(i.numero) ? 'N° ' + valeur(i.numero) : null, 60);
      this.kv([
        ['Machine / équipement', valeur(i.machine && i.machine.designation) || '—', true],
        ['Modèle', [valeur(i.machine && i.machine.marque), valeur(i.machine && i.machine.modele)].filter(Boolean).join(' ') || '—'],
        ['N° de série', valeur(i.machine && i.machine.serie) || '—'],
        /* Compteur et n° de parc ne sont plus demandés : affichés seulement
           s'ils ont été saisis (rapports importés ou anciens brouillons). */
        [valeur(i.machine && i.machine.compteur) ? 'Compteur' : '', [valeur(i.machine && i.machine.compteur), valeur(i.machine && i.machine.parc)].filter(Boolean).join(' — ')],
        ['Objet / demande', valeur(i.objet) || '—', true],
        ['Lieu', valeur(i.client && i.client.lieu) || '—'],
        ['Contact sur site', [valeur(i.client && i.client.contact), valeur(i.client && i.client.fonction)].filter(Boolean).join(' — ') || '—'],
        ['Téléphone / e-mail client', [valeur(i.client && i.client.tel), valeur(i.client && i.client.email)].filter(Boolean).join(' / ') || '—'],
        ['Date d\'intervention', frDate(i.date)],
        ['Horaires sur site', [heureFr(i.chrono && i.chrono.debut) || '—', heureFr(i.chrono && i.chrono.fin) || 'en cours'].join(' - ')],
        ['Durée sur site', formatDuree(this.etat.duree) ? formatDuree(this.etat.duree) + ' (' + dureeDecimale(this.etat.duree) + ' h)' : '—'],
        ['Technicien', nomTechnicien(i, s) || '—']
      ]);

      // Sections du canevas
      for (const section of this.canevas) {
        if (section.type === 'synthese') {
          this.titre(section.titre || 'Synthèse');
          await this.blocSynthese();
        } else if (section.type === 'evenements') {
          const evs = evenementsDe(i, section);
          if (!evs.length) continue;
          this.titre(section.titre || 'Évènements', evs.length + ' évènement(s)', 150);
          let idx = 0;
          for (const ev of evs) { await this.blocEvenement(ev, ++idx); }
        } else if (section.type === 'texte') {
          const contenu = valeur(i[section.champ]);
          if (!contenu) continue;
          this.titre(section.titre || 'Texte');
          this.blocTexte(null, contenu);
        } else if (section.type === 'photos') {
          const libres = (i.photosLibres || []).filter(ph => ph.dataUrl);
          if (!libres.length) continue;
          this.titre(section.titre || 'Photos', libres.length + ' photo(s)', 220);
          await this.photos(libres.map(ph => ({ dataUrl: ph.dataUrl, legende: valeur(ph.legende) })), true);
        } else if (section.type === 'signature') {
          this.titre(section.titre || 'Validation', null, 170);
          await this.blocSignatures();
        }
      }

      // pied de page du modèle : société + adresses des deux sites + n° de page
      const self = this, doc = this.pdf;
      const sieges = [(s.societe && s.societe.nom) || 'BFR SYSTEMS']
        .concat(SIEGES_BFR.map(function (l) {
          if (s.societe && s.societe.siege1 && l.indexOf('n°1') > 0) return 'Siège social et site de production n°1 – ' + s.societe.siege1;
          if (s.societe && s.societe.siege2 && l.indexOf('n°2') > 0) return 'Site de production n°2 – ' + s.societe.siege2;
          return l;
        }));
      doc.addFooters(function (d, num, total) {
        const y = d.H - 20;
        d.line(d.margin, y - 26, d.W - d.margin, y - 26, { color: COULEURS_PDF.bord, width: 0.6 });
        const largeur = d.W - 2 * d.margin - 70;
        sieges.forEach(function (ligne, k) {
          d.text(Pdf.trunc(ligne, largeur, k === 0 ? 7.4 : 6.6, k === 0), d.margin, y - 16 + k * 8.6,
            { size: k === 0 ? 7.4 : 6.6, font: k === 0 ? 'F2' : 'F1', color: COULEURS_PDF.gris });
        });
        d.text('Page ' + num + ' / ' + total, d.W - d.margin, y - 8, { size: 7, font: 'F2', color: COULEURS_PDF.gris, align: 'right' });
      });

      if (this.opts.apercu) return { apercu: doc, filename: nomFichier(this.i, 'pdf', this.opts.suffixe ? this.langue : null) };
      return { blob: doc.blob(), filename: nomFichier(this.i, 'pdf', this.opts.suffixe ? this.langue : null) };
    }
  }

  /* Nom du fichier : « Rapport_20260921_260921-01_CLIENT.pdf ». Quand le
     rapport existe en deux langues, chacune porte son code (_FR / _NL…) pour
     que le client et le SAV s'y retrouvent dans la pièce jointe. */
  function nomFichier(i, ext, langue) {
    const d = (i.date || new Date().toISOString().slice(0, 10)).replace(/-/g, '');
    const morceaux = ['Rapport', d, i.numero ? slug(i.numero) : '', slug(i.client && i.client.nom),
      slug(i.machine && i.machine.designation)];
    if (langue) morceaux.push(String(langue).toUpperCase());
    return morceaux.filter(Boolean).join('_') + '.' + ext;
  }

  /* ======================================================================
     WORD (.docx)
     ====================================================================== */
  class RapportWord {
    constructor(intervention, reglages, opts) {
      this.i = intervention;
      this.s = reglages || {};
      this.opts = opts || {};
      this.langue = this.opts.langue || (intervention.langue && intervention.langue.code) || 'fr';
      this.canevas = (this.s.canevas && this.s.canevas.sections) ? this.s.canevas.sections : canevasDefaut().sections;
      this.etat = etat(intervention, reglages);
      this.doc = new Docx.Doc({
        langue: this.langue,
        auteur: (this.s.societe && this.s.societe.nom) || 'Application SAV',
        /* Pied de page du modèle : nom + adresses des deux sites, et numérotation. */
        pied: [(this.s.societe && this.s.societe.nom) || 'BFR SYSTEMS']
          .concat([valeur(this.s.societe && this.s.societe.siege1) || SIEGES_BFR[0],
                   valeur(this.s.societe && this.s.societe.siege2) || SIEGES_BFR[1]])
      });
      this.doc.titreDoc = (global.I18N ? global.I18N.traduire("Compte rendu d'intervention", this.langue) : "Compte rendu d'intervention") +
        (this.langue === 'fr' ? ' N° ' : ' No. ') + valeur(intervention.numero);
      this.numeroPhoto = 0;
    }

    /* Traduction d'un libellé du catalogue (domaines, catégories). */
    L(txt) {
      return (global.I18N ? global.I18N.traduire(txt, this.langue) : txt);
    }

    async generer() {
      const d = this.doc, i = this.i, s = this.s;

      /* Logo de la société en en-tête, répété sur chaque page (comme le modèle). */
      const logo = valeur(s.societe && s.societe.logo) || valeur(global.LOGO_BFR);
      if (logo) {
        const jp = await toJpeg(logo, 1200, 0.92);
        if (jp) d.logoEntete(jp.dataUrl);
      }

      /* Bloc client du modèle : {Client_Name} {Mail_Client} {numero_client} | {Logo_Client} */
      const cli = i.client || {};
      const logoCli = cli.logo ? await toJpeg(cli.logo, 460, 0.92) : null;
      const runsBlocClient = [
        { t: valeur(cli.nom), gras: true, taille: 12 },
        { t: valeur(cli.email), taille: 10, saut: true },
        { t: valeur(cli.tel) ? 'Tél. ' + cli.tel : '', taille: 12, saut: true }
      ].filter(function (r) { return r.t; });
      if (logoCli) {
        d.image(logoCli.dataUrl, 4.5, { hauteurMaxCm: 2.2 });
      }
      d.tableau([[{ texte: runsBlocClient }, { texte: '' },
                  { texte: '' }]], { largeurs: [70, 15, 15], sansBordures: true });

      /* Titre du modèle : cyan BFR, centré */
      d.grandTitre("Compte rendu d'intervention", 30);
      d.grandTitre(frDate(i.date), 22);
      d.para('', { taille: 6, apres: 200 });

      /* « Votre contact : » + bloc technicien */
      d.para('Votre contact :', { taille: 10, couleur: '58595B', apres: 40 });
      d.para([{ t: Report.nomComplet(s.technicien) || '—', gras: true, taille: 11.5 }], { apres: 20 });
      [(s.technicien || {}).fonction, (s.technicien || {}).email, (s.technicien || {}).tel ? 'Tél. ' + s.technicien.tel : '']
        .filter(Boolean).forEach(function (l) { d.para(l, { taille: 10, couleur: '58595B', apres: 0 }); });

      /* Page 2 du modèle : destinataire, lieu et date, « À l'attention de » */
      d.sautDePage();
      d.para([{ t: valeur(cli.nom), gras: true, taille: 11.5 }], { apres: 20 });
      String(valeur(cli.adresse) || valeur(cli.lieu)).split('\n').forEach(function (l) {
        d.para(l, { taille: 10, couleur: '58595B', apres: 0 });
      });
      d.para('', { taille: 6, apres: 140 });
      d.para('À ' + (valeur(s.societe && s.societe.lieuLettre) || 'Blyes') + ', le ' + frDate(i.date) + ',',
        { taille: 10, couleur: '58595B', apres: 60 });
      d.para("À l'attention de " + valeur(cli.contact) + ',', { taille: 10, couleur: '58595B', apres: 200 });

      d.bandeau('Intervention');
      d.tableau([
        [{ texte: 'Client', gras: true }, { texte: valeur(i.client && i.client.nom) || '—' },
         { texte: 'Machine', gras: true }, { texte: valeur(i.machine && i.machine.designation) || '—' }],
        [{ texte: 'Lieu', gras: true }, { texte: valeur(i.client && i.client.lieu) || '—' },
         { texte: 'Modèle', gras: true }, { texte: [valeur(i.machine && i.machine.marque), valeur(i.machine && i.machine.modele)].filter(Boolean).join(' ') || '—' }],
        [{ texte: 'Adresse client', gras: true }, { texte: valeur(i.client && i.client.adresse) || '—' },
         { texte: 'N° de série', gras: true }, { texte: valeur(i.machine && i.machine.serie) || '—' }],
        [{ texte: 'Contact sur site', gras: true },
         { texte: [valeur(i.client && i.client.contact), valeur(i.client && i.client.fonction)].filter(Boolean).join(' — ') || '—' },
         { texte: 'Technicien', gras: true }, { texte: nomTechnicien(i, s) || '—' }],
        [{ texte: 'Téléphone / e-mail', gras: true },
         { texte: [valeur(i.client && i.client.tel), valeur(i.client && i.client.email)].filter(Boolean).join(' / ') || '—' },
         { texte: 'Horaires sur site', gras: true },
         { texte: (heureFr(i.chrono && i.chrono.debut) || '—') + ' - ' + (heureFr(i.chrono && i.chrono.fin) || 'en cours') }]
      ].concat(
        /* Compteur / n° de parc : plus demandés, imprimés seulement s'ils existent. */
        valeur(i.machine && (i.machine.compteur || i.machine.parc))
          ? [[{ texte: 'Compteur / N° de parc', gras: true },
              { texte: [valeur(i.machine.compteur), valeur(i.machine.parc)].filter(Boolean).join(' — ') },
              { texte: 'Durée sur site', gras: true },
              { texte: formatDuree(this.etat.duree) || '—' }]]
          : [[{ texte: 'Durée sur site', gras: true },
              { texte: formatDuree(this.etat.duree) || '—' }, { texte: '' }, { texte: '' }]]
      ), { largeurs: [18, 32, 18, 32], enteteFond: 'F1F5F9' });

      for (const section of this.canevas) {
        if (section.type === 'synthese') {
          d.bandeau(section.titre || 'Synthèse');
          const lignes = (this.s.categories || []).filter(c => this.etat.parCategorie[c.id])
            .map(c => [{ texte: this.L(c.libelle) }, { texte: String(this.etat.parCategorie[c.id]), align: 'center', gras: true }]);
          if (lignes.length) d.tableau([[{ texte: 'Catégorie', gras: true }, { texte: 'Nombre', gras: true, align: 'center' }]].concat(lignes),
            { largeurs: [70, 30], enteteFond: 'E8EFFA' });
          const dom = (this.s.domaines || []).filter(x => this.etat.parDomaine[x.id])
            .map(x => this.L(x.libelle) + ' : ' + this.etat.parDomaine[x.id]);
          if (dom.length) d.para(dom.join('   •   '), { taille: 10, couleur: '334155', apres: 60 });
          d.para('Heures passées sur site : ' + (formatDuree(this.etat.duree) || '—') +
            (this.etat.duree ? ' (' + dureeDecimale(this.etat.duree) + ' h)' : '') + '   •   Photos : ' + this.etat.nbPhotos,
            { taille: 10, apres: 120 });
          if (valeur(i.resumeTechnicien)) d.para('Synthèse du technicien', { gras: true, taille: 11, apres: 40 }),
            d.para(i.resumeTechnicien, { taille: 10, apres: 120 });
          if (valeur(i.objet)) d.para('Objet / demande du client', { gras: true, taille: 11, apres: 40 }),
            d.para(i.objet, { taille: 10, apres: 120 });
        } else if (section.type === 'evenements') {
          const evs = evenementsDe(i, section);
          if (!evs.length) continue;
          d.bandeau(section.titre || 'Évènements');
          for (const ev of evs) {
            const cat = this.etat.categories[ev.categorie || 'INFO'] || { libelle: 'Informatif', couleur: '#475569' };
            const dom = this.etat.domaines[ev.domaine] || { libelle: '—' };
            d.para([
              { t: (dom.icone ? dom.icone + ' ' : '') + this.L(dom.libelle), gras: true, taille: 11, couleur: '0B3D91' },
              { t: '   [' + this.L(cat.libelle).toUpperCase() + ']', gras: true, taille: 10, couleur: hexDocx(cat.couleur) },
              { t: heureFr(ev.heure) ? '   ' + heureFr(ev.heure) : '', taille: 9, couleur: '94A3B8' }
            ], { avant: 160, apres: 40 });
            d.para(valeur(ev.texte) || '(aucune annotation)', { taille: 10, apres: 60, encadre: true });
            for (const ph of (ev.photos || []).filter(x => x.dataUrl)) {
              this.numeroPhoto++;
              d.image(ph.dataUrl, 13, { legende: 'Photo ' + this.numeroPhoto });
            }
          }
        } else if (section.type === 'texte') {
          const contenu = valeur(i[section.champ]);
          if (!contenu) continue;
          d.bandeau(section.titre || 'Texte');
          d.para(contenu, { taille: 10, apres: 120 });
        } else if (section.type === 'photos') {
          const libres = (i.photosLibres || []).filter(ph => ph.dataUrl);
          if (!libres.length) continue;
          d.bandeau(section.titre || 'Photos');
          libres.forEach(function (ph, k) { d.image(ph.dataUrl, 13, { legende: valeur(ph.legende) || ('Photo ' + (k + 1)) }); });
        } else if (section.type === 'signature') {
          d.bandeau(section.titre || 'Validation');
          d.para(valeur(this.s.impression && this.s.impression.mentionClient) ||
            "Le client reconnaît avoir pris connaissance du présent rapport et accepte les constats et travaux décrits.",
            { taille: 9.5, apres: 160, encadre: true });
          const cli = i.signatureClient || {};
          d.tableau([
            [{ texte: 'Le client (bon pour accord)', gras: true, fond: 'E8EFFA' }, { texte: 'Le technicien', gras: true, fond: 'E8EFFA' }],
            [{ texte: valeur(cli.nom) || '—' }, { texte: valeur(i.technicien) || valeur(s.technicien && s.technicien.nom) || '—' }],
            [{ texte: valeur(cli.fonction) || '' }, { texte: [valeur(s.technicien && s.technicien.fonction), contactTech(s.technicien)].filter(Boolean).join(' — ') }],
            [{ texte: 'Date : ' + frDate(cli.date || i.date) + (cli.heure ? ' à ' + cli.heure : '') },
             { texte: 'Date : ' + frDate(i.date) + (heureFr(i.chrono && i.chrono.fin) ? ' à ' + heureFr(i.chrono && i.chrono.fin) : '') }]
          ], { largeurs: [50, 50] });
          if (cli.dataUrl) d.image(cli.dataUrl, 6, { hauteurMaxCm: 3 });
        }
      }
      return { blob: this.doc.blob(), filename: nomFichier(this.i, 'docx', this.opts.suffixe ? this.langue : null) };
    }
  }

  /* ===================== E-mails ====================================== */
  function variables(intervention, reglages) {
    const e = etat(intervention, reglages);
    const i = intervention;
    const lignes = e.evenements
      .filter(x => x.categorie === 'SECURITE' || x.categorie === 'URGENT' || x.categorie === 'HAUTE')
      .map(function (x) {
        const cat = e.categories[x.categorie] || {};
        const dom = e.domaines[x.domaine] || {};
        return '[' + (cat.libelle || x.categorie) + '] ' + (dom.libelle || '') + ' : ' + valeur(x.texte).split('\n')[0].slice(0, 180);
      });
    /* Noms des variables du modèle « Compte rendu d'intervention » BFR
       (Google Doc de référence) : {Client_Name} {Mail_Client} {numero_client}
       {Logo_Client} {Date} {Name_Technicien} {Poste_Tech} {Mail_Tech} {Num_Tech}
       {Client_Adress} {Client_Contact}. */
    const c = i.client || {}, t = reglages.technicien || {};
    const modele = {
      Client_Name: valeur(c.nom), Mail_Client: valeur(c.email),
      numero_client: valeur(c.tel),                       // téléphone du client (saisi si absent de la liste)
      Logo_Client: valeur(c.logo),                        // vide = place laissée vide dans le compte rendu
      Date: frDate(i.date),
      Name_Technicien: nomTechnicien(i, reglages), Poste_Tech: valeur(t.fonction),
      Mail_Tech: valeur(t.email), Num_Tech: valeur(t.tel),
      Client_Adress: valeur(c.adresse || c.lieu), Client_Contact: valeur(c.contact)
    };
    return Object.assign(modele, {
      numero: valeur(i.numero), affaire: valeur(i.numero),
      client: valeur(i.client && i.client.nom), contact: valeur(i.client && i.client.contact),
      lieu: valeur(i.client && (i.client.lieu || i.client.adresse)),
      date: frDate(i.date),
      machine: valeur(i.machine && i.machine.designation),
      serie: valeur(i.machine && i.machine.serie),
      technicien: nomTechnicien(i, reglages),
      societe: valeur(reglages.societe && reglages.societe.nom),
      debut: heureFr(i.chrono && i.chrono.debut), fin: heureFr(i.chrono && i.chrono.fin),
      duree: formatDuree(e.duree) || '—',
      nbEvenements: String(e.evenements.length),
      nbSecurite: String(e.parCategorie.SECURITE || 0),
      nbUrgent: String(e.parCategorie.URGENT || 0),
      nbHaute: String(e.parCategorie.HAUTE || 0),
      nbBasse: String(e.parCategorie.BASSE || 0),
      nbInfo: String(e.parCategorie.INFO || 0),
      nbPhotos: String(e.nbPhotos),
      pointsCles: lignes.length ? lignes.join('\n') : 'Aucun point de sécurité ou d\'urgence relevé.',
      resume: valeur(i.resumeTechnicien), actions: valeur(i.actions), aPrevoir: valeur(i.aPrevoir)
    });
  }

  function appliquer(tpl, vars) {
    return String(tpl || '').replace(/\{\{(\w+)\}\}/g, function (m, k) { return vars[k] !== undefined ? vars[k] : m; });
  }
  function objetMail(i, s) {
    return appliquer((s.mail && s.mail.objet) || 'Rapport d\'intervention N° {{numero}} — {{client}} — {{date}}', variables(i, s));
  }
  function corpsMail(i, s, langue) {
    const corps = appliquer((s.mail && s.mail.corps) || defaultCorpsMail(), variables(i, s));
    /* Rapport envoyé en deux langues : on le dit au client, dans sa langue,
       à la fin du message (le corps du mail reste en français pour le SAV). */
    const phrase = (langue && langue !== 'fr' && global.I18N) ? global.I18N.phraseTraduction(langue) : null;
    return phrase ? corps + '\n\n' + phrase : corps;
  }
  function defaultCorpsMail() {
    return [
      'Bonjour,',
      '',
      'Veuillez trouver ci-joint le rapport d\'intervention N° {{numero}} du {{date}}, concernant {{client}} ({{lieu}}) — {{machine}}.',
      '',
      'Temps passé sur site : {{duree}} (de {{debut}} à {{fin}}).',
      '{{nbEvenements}} point(s) ont été relevés : {{nbSecurite}} sécurité, {{nbUrgent}} urgent(s), {{nbHaute}} priorité haute, {{nbBasse}} priorité basse, {{nbInfo}} informatif(s).',
      '',
      'Points clés :',
      '{{pointsCles}}',
      '',
      'Synthèse :',
      '{{resume}}',
      '',
      'Travaux réalisés :',
      '{{actions}}',
      '',
      'Restant à votre disposition pour tout complément d\'information.',
      '',
      'Cordialement,',
      '{{technicien}}',
      '{{societe}}'
    ].join('\n');
  }

  global.Report = {
    /* opts : { langue: 'en', suffixe: true } pour la version traduite. */
    genererPDF: function (i, s, opts) { return new RapportPDF(i, s, opts).generer(); },
    /* Aperçu dans l'application : renvoie un canvas par page. */
    apercu: async function (i, s, opts) {
      opts = opts || {};
      const r = await new RapportPDF(i, s, Object.assign({}, opts, { apercu: true })).generer();
      const pages = await Pdf.rendrePages(r.apercu, opts);
      return { pages: pages, doc: r.apercu, filename: r.filename };
    },
    genererDOCX: function (i, s, opts) { return new RapportWord(i, s, opts).generer(); },
    canevasDefaut: canevasDefaut,
    etat: etat, evenementsDe: evenementsDe, dureeMs: dureeMs, formatDuree: formatDuree,
    dureeDecimale: dureeDecimale, frDate: frDate, heureFr: heureFr, valeur: valeur, slug: slug,
    objetMail: objetMail, corpsMail: corpsMail, defaultCorpsMail: defaultCorpsMail, variables: variables,
    nomComplet: nomComplet, contactTech: contactTech, nomTechnicien: nomTechnicien
  };
})(window);
</script>
<script>/* =========================================================================
   annotate.js — Annotation d'une photo au doigt (flèche, cercle, texte, tracé)
   Les annotations sont mémorisées en coordonnées relatives (0 → 1) :
   elles se redessinent à n'importe quelle résolution à l'export.
   ========================================================================= */
(function (global) {
  'use strict';

  const COULEURS = ['#e11d48', '#f59e0b', '#22c55e', '#ffffff', '#111827'];
  const NOMS = { crayon: '✏️ Crayon', fleche: '➡️ Flèche', cercle: '⭕ Cercle', texte: '🅰️ Texte' };

  /** Convertit une image (dataURL) en objet Image chargé. */
  function chargerImage(dataUrl) {
    return new Promise(function (resolve, reject) {
      const img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = reject;
      img.src = dataUrl;
    });
  }

  /** Dessine une annotation sur un contexte, dans un rectangle cible. */
  function dessinerAnnotation(ctx, a, rect) {
    const X = (v) => rect.x + v * rect.w;
    const Y = (v) => rect.y + v * rect.h;
    const ep = Math.max(2, rect.w * 0.006);        // épaisseur proportionnelle
    ctx.save();
    ctx.strokeStyle = a.couleur;
    ctx.fillStyle = a.couleur;
    ctx.lineWidth = ep;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (a.type === 'crayon') {
      ctx.beginPath();
      a.points.forEach(function (p, i) {
        if (i === 0) ctx.moveTo(X(p[0]), Y(p[1])); else ctx.lineTo(X(p[0]), Y(p[1]));
      });
      ctx.stroke();
    } else if (a.type === 'fleche') {
      const x1 = X(a.points[0][0]), y1 = Y(a.points[0][1]);
      const x2 = X(a.points[1][0]), y2 = Y(a.points[1][1]);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      const ang = Math.atan2(y2 - y1, x2 - x1);
      const t = ep * 4.2;
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - t * Math.cos(ang - 0.4), y2 - t * Math.sin(ang - 0.4));
      ctx.lineTo(x2 - t * Math.cos(ang + 0.4), y2 - t * Math.sin(ang + 0.4));
      ctx.closePath(); ctx.fill();
    } else if (a.type === 'cercle') {
      const cx = X(a.points[0][0]), cy = Y(a.points[0][1]);
      const rx = Math.abs(X(a.points[1][0]) - cx), ry = Math.abs(Y(a.points[1][1]) - cy);
      ctx.beginPath();
      ctx.ellipse(cx, cy, Math.max(2, rx), Math.max(2, ry), 0, 0, Math.PI * 2);
      ctx.stroke();
    } else if (a.type === 'texte') {
      const taille = Math.max(12, rect.w * (a.taille || 0.045));
      ctx.font = '600 ' + taille + 'px system-ui, sans-serif';
      ctx.textBaseline = 'top';
      ctx.lineWidth = Math.max(2, taille * 0.18);
      ctx.strokeStyle = 'rgba(0,0,0,.75)';
      ctx.strokeText(a.texte, X(a.points[0][0]), Y(a.points[0][1]));
      ctx.fillStyle = a.couleur;
      ctx.fillText(a.texte, X(a.points[0][0]), Y(a.points[0][1]));
    }
    ctx.restore();
  }

  /** Calcule le rectangle « contain » de l'image dans un canvas. */
  function rectContain(iw, ih, cw, ch) {
    const ratio = Math.min(cw / iw, ch / ih);
    const w = iw * ratio, h = ih * ratio;
    return { x: (cw - w) / 2, y: (ch - h) / 2, w: w, h: h };
  }

  /* ===================================================================== */
  class Editeur {
    constructor(photo, callbacks) {
      /* photo : { dataUrl, annotations } */
      this.photo = photo;
      this.cb = callbacks || {};
      this.annotations = (photo.annotations || []).map(a => JSON.parse(JSON.stringify(a)));
      this.outil = null;
      this.couleur = '#e11d48';
      this.enCours = null;
      this.ouvrir();
    }

    ouvrir() {
      const overlay = document.createElement('div');
      overlay.className = 'annot-editeur';
      overlay.innerHTML = `
        <div class="annot-bar">
          <button type="button" class="iconbtn" data-a="annuler">✕</button>
          <div class="annot-titre">Annoter la photo</div>
          <button type="button" class="btn sm" data-a="valider">Valider</button>
        </div>
        <div class="annot-zone"><canvas id="annotCanvas"></canvas>
          <p class="annot-vide">Choisissez un outil ci-dessous, puis annotez la photo au doigt.</p>
        </div>
        <div class="annot-outils">
          <div class="annot-ligne">
            ${Object.keys(NOMS).map(o => `<button type="button" class="outil" data-outil="${o}"><span>${NOMS[o].split(' ')[0]}</span>${NOMS[o].split(' ').slice(1).join(' ')}</button>`).join('')}
          </div>
          <div class="annot-ligne">
            ${COULEURS.map(c => `<button type="button" class="pastille" data-couleur="${c}" style="background:${c}"></button>`).join('')}
            <button type="button" class="btn sm grey" data-a="undo">↩︎ Annuler</button>
            <button type="button" class="btn sm grey" data-a="vider">🗑️ Tout</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      this.overlay = overlay;
      this.canvas = overlay.querySelector('#annotCanvas');

      overlay.addEventListener('click', (e) => {
        const o = e.target.closest('[data-outil]');
        if (o) {
          this.outil = o.dataset.outil;
          overlay.querySelectorAll('.outil').forEach(b => b.classList.toggle('on', b === o));
          overlay.querySelector('.annot-vide').style.display = 'none';
          return;
        }
        const p = e.target.closest('[data-couleur]');
        if (p) {
          this.couleur = p.dataset.couleur;
          overlay.querySelectorAll('.pastille').forEach(b => b.classList.toggle('on', b === p));
          return;
        }
        const a = e.target.closest('[data-a]');
        if (!a) return;
        if (a.dataset.a === 'annuler') this.fermer(false);
        else if (a.dataset.a === 'valider') this.valider();
        else if (a.dataset.a === 'undo') { this.annotations.pop(); this.redessiner(); }
        else if (a.dataset.a === 'vider') { this.annotations = []; this.redessiner(); }
      });

      this.canvas.addEventListener('pointerdown', (e) => this.pointerDown(e));
      this.canvas.addEventListener('pointermove', (e) => this.pointerMove(e));
      this.canvas.addEventListener('pointerup', (e) => this.pointerUp(e));
      this.canvas.addEventListener('pointercancel', (e) => this.pointerUp(e));
      window.addEventListener('resize', () => this.redimensionner());

      this.pret = chargerImage(this.photo.dataUrl).then((img) => {
        this.img = img;
        this.redimensionner();
      }).catch(() => { this.fermer(false); });
    }

    redimensionner() {
      if (!this.img) return;
      const zone = this.overlay.querySelector('.annot-zone');
      const rect = zone.getBoundingClientRect();
      const dpr = Math.min(2.5, window.devicePixelRatio || 1);
      this.canvas.width = Math.max(280, Math.round(rect.width * dpr));
      this.canvas.height = Math.max(220, Math.round(rect.height * dpr));
      this.rectImage = rectContain(this.img.width, this.img.height, this.canvas.width, this.canvas.height);
      this.redessiner();
    }

    redessiner() {
      if (!this.img) return;
      const ctx = this.canvas.getContext('2d');
      ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
      ctx.fillStyle = '#0b1220';
      ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
      ctx.drawImage(this.img, this.rectImage.x, this.rectImage.y, this.rectImage.w, this.rectImage.h);
      this.annotations.forEach(a => dessinerAnnotation(ctx, a, this.rectImage));
      if (this.enCours) dessinerAnnotation(ctx, this.enCours, this.rectImage);
    }

    /** Position relative (0→1) dans l'image. */
    relatif(e) {
      const r = this.canvas.getBoundingClientRect();
      const cx = (e.clientX - r.left) * (this.canvas.width / (r.width || 1));
      const cy = (e.clientY - r.top) * (this.canvas.height / (r.height || 1));
      const im = this.rectImage;
      return [
        Math.min(1, Math.max(0, (cx - im.x) / im.w)),
        Math.min(1, Math.max(0, (cy - im.y) / im.h))
      ];
    }

    pointerDown(e) {
      if (!this.outil) { this.erreur('Choisissez d\'abord un outil (flèche, cercle, crayon ou texte)'); return; }
      if (!this.img) { this.erreur('Photo en cours de chargement'); return; }
      e.preventDefault();
      if (this.outil === 'texte') {
        const p = this.relatif(e);
        const texte = prompt('Texte à afficher sur la photo :');
        if (texte && texte.trim()) {
          this.annotations.push({ type: 'texte', couleur: this.couleur, points: [p], texte: texte.trim(), taille: 0.045 });
          this.redessiner();
        }
        return;
      }
      const p = this.relatif(e);
      this.enCours = { type: this.outil, couleur: this.couleur, points: [p] };
      if (this.outil === 'crayon') this.enCours.points = [p];
      try { this.canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }

    pointerMove(e) {
      if (!this.enCours) return;
      e.preventDefault();
      const p = this.relatif(e);
      if (this.enCours.type === 'crayon') this.enCours.points.push(p);
      else this.enCours.points[1] = p;
      this.redessiner();
    }

    pointerUp(e) {
      if (!this.enCours) return;
      const a = this.enCours;
      this.enCours = null;
      const assez = a.type === 'crayon'
        ? a.points.length > 2
        : (a.points[1] && (Math.abs(a.points[1][0] - a.points[0][0]) > 0.008 || Math.abs(a.points[1][1] - a.points[0][1]) > 0.008));
      if (assez) this.annotations.push(a);
      this.redessiner();
    }

    /** Exporte l'image annotée (JPEG) à une résolution raisonnable. */
    async exporter(largeurMax) {
      largeurMax = largeurMax || 1600;
      const ratio = Math.min(1, largeurMax / this.img.width);
      const w = Math.round(this.img.width * ratio);
      const h = Math.round(this.img.height * ratio);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(this.img, 0, 0, w, h);
      const rect = { x: 0, y: 0, w: w, h: h };
      this.annotations.forEach(a => dessinerAnnotation(ctx, a, rect));
      return c.toDataURL('image/jpeg', 0.85);
    }

    async valider() {
      if (!this.img) { this.erreur('Photo en cours de chargement — réessayez dans un instant'); return; }
      const dataUrl = await this.exporter();
      this.photo.dataUrl = dataUrl;
      this.photo.annotations = JSON.parse(JSON.stringify(this.annotations));
      this.fermer(true);
    }

    /** Message discret en bas de l'écran d'annotation. */
    erreur(message) {
      let el = this.overlay.querySelector('.annot-erreur');
      if (!el) {
        el = document.createElement('div');
        el.className = 'annot-erreur';
        this.overlay.appendChild(el);
      }
      el.textContent = message;
      clearTimeout(this._errTimer);
      this._errTimer = setTimeout(() => { if (el.parentNode) el.remove(); }, 2600);
    }

    fermer(valide) {
      this.overlay.remove();
      if (this.cb && this.cb.fin) this.cb.fin(!!valide, this.photo);
    }
  }

  global.Annotation = { ouvrir: function (photo, cb) { return new Editeur(photo, cb); }, dessinerAnnotation: dessinerAnnotation, chargerImage: chargerImage };
})(window);
</script>
<script>/* =========================================================================
   wizard.js — Assistant « Ajouter un évènement » en 4 étapes
     1. Domaine   : Mécanique / Électrique / Automatisme
     2. Annotation: texte écrit ou dicté (+ relecture vocale)
     3. Photo     : prise de vue puis annotation au doigt
     4. Catégorie : Sécurité / Urgent / Priorité haute / basse / Informatif
   L'évènement est enregistré dès la première étape et reste modifiable :
   on peut rouvrir l'assistant à tout moment, rien n'est perdu.
   ========================================================================= */
(function (global) {
  'use strict';

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  class Assistant {
    constructor(evenement, ctx) {
      this.ev = evenement;
      this.ctx = ctx || {};
      this.S = this.ctx.reglages || {};
      /* Réouverture : on revient directement sur l'annotation si le domaine est déjà
         choisi (c'est ce qu'on corrige le plus souvent) ; « ← Retour » ramène au domaine. */
      this.etape = evenement.domaine ? 2 : 1;
      this.reconnaissance = null;
      this.ecoute = false;
      this.ouvrir();
    }

    domaines() { return this.S.domaines || []; }
    categories() { return this.S.categories || []; }

    ouvrir() {
      const overlay = document.createElement('div');
      overlay.className = 'assistant';
      overlay.innerHTML = `
        <div class="assistant-bar">
          <button type="button" class="iconbtn" data-a="fermer">✕</button>
          <div class="assistant-titre">Évènement</div>
          <button type="button" class="btn sm" data-a="enregistrer">Enregistrer</button>
        </div>
        <div class="assistant-progres" id="assistantProgres"></div>
        <div class="assistant-corps" id="assistantCorps"></div>
        <div class="assistant-nav" id="assistantNav"></div>`;
      document.body.appendChild(overlay);
      this.overlay = overlay;
      this.corps = overlay.querySelector('#assistantCorps');

      overlay.addEventListener('click', (e) => {
        const b = e.target.closest('[data-a]');
        if (b) {
          const a = b.dataset.a;
          if (a === 'fermer') this.fermer();
          else if (a === 'enregistrer') this.enregistrer();
          else if (a === 'suivant') this.aller(this.etape + 1);
          else if (a === 'retour') this.aller(this.etape - 1);
          else if (a === 'supprimer') this.supprimer();
          else if (a === 'photo') this.prendrePhoto();
          else if (a === 'photo-lib') this.photoBibliotheque();
          else if (a === 'dictee') this.basculerDictee();
          else if (a === 'relire') this.relire();
          return;
        }
        const d = e.target.closest('[data-domaine]');
        if (d) {
          this.ev.domaine = d.dataset.domaine;
          if (!this.ev.heure) this.ev.heure = new Date().toISOString();
          this.maj(); this.aller(2);
          return;
        }
        const c = e.target.closest('[data-categorie]');
        if (c) {
          this.ev.categorie = c.dataset.categorie;
          this.ev.heure = this.ev.heure || new Date().toISOString();
          this.maj();
          this.toast('Évènement enregistré');
          this.fermer();
          return;
        }
        const p = e.target.closest('[data-annot]');
        if (p) {
          const photo = this.ev.photos[+p.dataset.annot];
          const self = this;
          Annotation.ouvrir(photo, {
            fin: function (valide) {
              if (valide) { self.maj(); }
              self.rendre();
            }
          });
          return;
        }
        const rm = e.target.closest('[data-retirer-photo]');
        if (rm) { this.ev.photos.splice(+rm.dataset.retirerPhoto, 1); this.maj(); this.rendre(); return; }
      });

      // saisie de texte : sauvegarde à chaque frappe (rien n'est perdu)
      overlay.addEventListener('input', (e) => {
        if (e.target.id === 'evTexte') {
          this.ev.texte = e.target.value;
          this.maj();
        }
      });

      this.rendre();
    }

    toast(msg) { if (this.ctx.toast) this.ctx.toast(msg); }

    maj() { if (this.ctx.onMaj) this.ctx.onMaj(this.ev); }

    enregistrer() {
      if (!this.ev.domaine) { this.aller(1); this.toast('Choisissez d\'abord le domaine'); return; }
      if (!this.ev.categorie) this.ev.categorie = 'INFO';
      this.ev.heure = this.ev.heure || new Date().toISOString();
      this.maj();
      this.toast('Évènement enregistré');
      this.fermer();
    }

    supprimer() {
      if (!confirm('Supprimer cet évènement ?')) return;
      if (this.ctx.onSupprimer) this.ctx.onSupprimer(this.ev);
      this.fermer();
    }

    fermer() {
      this.arreterDictee();
      this.overlay.remove();
      if (this.ctx.onFermer) this.ctx.onFermer(this.ev);
    }

    aller(n) {
      if (n < 1 || n > 4) return;
      if (n === 3 && !this.ev.domaine) { this.toast('Choisissez d\'abord le domaine'); return; }
      this.etape = n;
      this.rendre();
    }

    /* ---------- rendu ---------- */
    rendre() {
      this.overlay.querySelector('#assistantProgres').innerHTML = [1, 2, 3, 4].map(function (i) {
        const cls = ['pas'];
        if (i < this.etape) cls.push('fait');
        if (i === this.etape) cls.push('actif');
        return `<span class="${cls.join(' ')}"></span>`;
      }, this).join('') + `<span class="pas-libelle">Étape ${this.etape}/4 — ${
        ['Domaine', 'Annotation', 'Photo', 'Catégorie'][this.etape - 1]}</span>`;

      const rendus = { 1: () => this.etapeDomaine(), 2: () => this.etapeAnnotation(), 3: () => this.etapePhoto(), 4: () => this.etapeCategorie() };
      this.corps.innerHTML = rendus[this.etape]();

      const nav = [];
      if (this.etape > 1) nav.push('<button class="btn grey" data-a="retour">← Retour</button>');
      if (this.etape < 4) nav.push('<button class="btn" data-a="suivant">Suivant →</button>');
      else nav.push('<button class="btn or" data-a="enregistrer">✔ Terminer</button>');
      if (this.ev.domaine) nav.push('<button class="btn danger" data-a="supprimer">Supprimer</button>');
      this.overlay.querySelector('#assistantNav').innerHTML = nav.join('');
      this.corps.scrollTop = 0;
    }

    etapeDomaine() {
      const d = this.domaineCourant();
      return `<p class="assistant-question">Sur quel domaine porte cet évènement ?</p>
        <div class="domaines">
          ${this.domaines().map(function (x) {
            return `<button type="button" class="domaine${(d && d.id === x.id) ? ' on' : ''}" data-domaine="${esc(x.id)}">
              <span class="ico">${esc(x.icone || '🔧')}</span><span class="lib">${esc(x.libelle)}</span></button>`;
          }).join('')}
        </div>
        ${d ? `<p class="assistant-note">Domaine choisi : <strong>${esc(d.libelle)}</strong></p>` : ''}`;
    }

    etapeAnnotation() {
      const ev = this.ev;
      const dispo = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
      return `<p class="assistant-question">Que constatez-vous ?</p>
        <p class="assistant-note">Écrivez, ou dictez à voix haute : le texte est ajouté automatiquement.</p>
        <textarea id="evTexte" class="ev-texte" rows="7" placeholder="Ex. Courroie d'entraînement détendue : flèche mesurée 12 mm pour 8 mm maximum. Traces de patinage et gomme sur la poulie. Bruit caractéristique au démarrage.">${esc(ev.texte || '')}</textarea>
        <div class="btnrow" style="margin-top:10px">
          <button class="btn ${this.ecoute ? 'or' : 'ghost'}" data-a="dictee">${this.ecoute ? '⏹️ Arrêter la dictée' : '🎤 Dicter'}</button>
          <button class="btn ghost" data-a="relire" ${ev.texte ? '' : 'disabled'}>🔊 Relire</button>
        </div>
        ${dispo ? '' : '<p class="assistant-note">Dictée indisponible sur ce navigateur : utilisez le micro du clavier (bouton 🎤 de votre clavier Android).</p>'}`;
    }

    etapePhoto() {
      const ev = this.ev;
      return `<p class="assistant-question">Ajouter une photo</p>
        <p class="assistant-note">Prenez la photo puis annotez-la au doigt (flèche, cercle, texte) pour montrer précisément la zone concernée.</p>
        <div class="btnrow">
          <button class="btn" data-a="photo">📷 Prendre une photo</button>
          <button class="btn ghost" data-a="photo-lib">🖼️ Galerie</button>
        </div>
        <input type="file" id="evPhotoInput" accept="image/*" capture="environment" hidden>
        <input type="file" id="evPhotoLib" accept="image/*" multiple hidden>
        <div class="ev-photos">
          ${(ev.photos || []).map(function (p, i) {
            return `<div class="ev-photo">
              <img src="${p.dataUrl}" alt="photo ${i + 1}">
              <button type="button" class="ev-photo-annot" data-annot="${i}">✏️ Annoter</button>
              <button type="button" class="ev-photo-rm" data-retirer-photo="${i}">✕</button>
              ${(p.annotations && p.annotations.length) ? '<span class="ev-photo-badge">annotée</span>' : ''}
            </div>`;
          }).join('') || '<p class="assistant-note">Aucune photo pour l\'instant — vous pouvez continuer sans photo.</p>'}
        </div>`;
    }

    etapeCategorie() {
      const cats = this.categories(), choisi = this.ev.categorie;
      return `<p class="assistant-question">Comment qualifier cet évènement ?</p>
        <p class="assistant-note">Cette catégorie détermine la place de l'évènement dans le rapport : les problèmes de sécurité et les urgences apparaissent en premier.</p>
        <div class="categories">
          ${cats.map(function (c) {
            return `<button type="button" class="categorie${choisi === c.id ? ' on' : ''}" data-categorie="${esc(c.id)}"
              style="--c:${c.couleur};--f:${c.fond}">
              <span class="ico">${esc(c.icone || '•')}</span>
              <span class="lib">${esc(c.libelle)}</span>
              <span class="fleche">${choisi === c.id ? '✔' : '›'}</span></button>`;
          }).join('')}
        </div>
        <div class="ev-recap">
          <div class="ev-recap-ligne"><span>Domaine</span><strong>${esc(this.libelleDomaine())}</strong></div>
          <div class="ev-recap-ligne"><span>Annotation</span><strong>${this.ev.texte ? this.ev.texte.length + ' caractère(s)' : 'vide'}</strong></div>
          <div class="ev-recap-ligne"><span>Photos</span><strong>${(this.ev.photos || []).length}</strong></div>
        </div>`;
    }

    domaineCourant() { return this.domaines().find(x => x.id === this.ev.domaine); }
    libelleDomaine() { const d = this.domaineCourant(); return d ? d.libelle : '—'; }

    /* ---------- photo ---------- */
    prendrePhoto() { this.choisirFichier('#evPhotoInput', false); }
    photoBibliotheque() { this.choisirFichier('#evPhotoLib', true); }

    choisirFichier(selecteur, multiple) {
      const input = this.overlay.querySelector(selecteur);
      input.multiple = multiple;
      input.value = '';
      const self = this;
      input.onchange = async function () {
        const fichiers = Array.prototype.slice.call(input.files || []);
        if (!fichiers.length) return;
        for (const f of fichiers) {
          if ((self.ev.photos || []).length >= 4) { self.toast('4 photos maximum par évènement'); break; }
          try {
            const dataUrl = await self.compresser(f, 1600, 0.82);
            const photo = { id: 'p' + Date.now() + Math.random().toString(36).slice(2, 6), dataUrl: dataUrl, annotations: [] };
            self.ev.photos = self.ev.photos || [];
            self.ev.photos.push(photo);
            self.maj();
            // on enchaîne directement sur l'annotation de la photo qui vient d'être prise
            await new Promise(function (resolve) {
              Annotation.ouvrir(photo, { fin: function (valide) { if (valide) self.maj(); resolve(); } });
            });
          } catch (e) { self.toast('Photo ignorée (format non pris en charge)'); }
        }
        self.rendre();
      };
      input.click();
    }

    compresser(file, maxDim, q) {
      return new Promise(function (resolve, reject) {
        const reader = new FileReader();
        reader.onload = function () {
          const img = new Image();
          img.onload = function () {
            const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
            const c = document.createElement('canvas');
            c.width = Math.round(img.width * scale);
            c.height = Math.round(img.height * scale);
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, c.width, c.height);
            ctx.drawImage(img, 0, 0, c.width, c.height);
            resolve(c.toDataURL('image/jpeg', q));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    /* ---------- dictée / relecture ---------- */
    basculerDictee() {
      if (this.ecoute) { this.arreterDictee(); this.rendre(); return; }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { this.toast('Dictée non disponible : utilisez le micro du clavier'); return; }
      const rec = new SR();
      rec.lang = 'fr-FR';
      rec.continuous = true;
      rec.interimResults = true;
      const self = this;
      const champ = this.corps.querySelector('#evTexte');
      let base = (self.ev.texte || '') ? self.ev.texte.replace(/\s+$/, '') + ' ' : '';
      rec.onresult = function (e) {
        let final = '', provisoire = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const t = e.results[i][0].transcript;
          if (e.results[i].isFinal) final += t; else provisoire += t;
        }
        if (final) base += final;
        self.ev.texte = base + provisoire;
        if (champ) { champ.value = self.ev.texte; champ.scrollTop = champ.scrollHeight; }
        self.maj();
      };
      rec.onerror = function () { self.arreterDictee(); self.rendre(); };
      rec.onend = function () { if (self.ecoute) { self.ecoute = false; self.rendre(); } };
      try { rec.start(); } catch (e) { self.toast('Micro indisponible'); return; }
      this.reconnaissance = rec;
      this.ecoute = true;
      this.toast('Dictée en cours… parlez');
      this.rendre();
      const champApres = this.corps.querySelector('#evTexte');
      if (champApres) champApres.focus();
    }

    arreterDictee() {
      if (this.reconnaissance) { try { this.reconnaissance.stop(); } catch (e) {} }
      this.reconnaissance = null;
      this.ecoute = false;
    }

    relire() {
      if (!this.ev.texte) { this.toast('Rien à relire'); return; }
      if (!('speechSynthesis' in window)) { this.toast('Relecture vocale indisponible'); return; }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(this.ev.texte);
      u.lang = 'fr-FR';
      u.rate = 1;
      window.speechSynthesis.speak(u);
      this.toast('Relecture vocale…');
    }
  }

  global.Assistant = {
    ouvrir: function (evenement, ctx) { return new Assistant(evenement, ctx); },
    nouvelEvenement: function () {
      return { id: 'e' + Date.now() + Math.random().toString(36).slice(2, 6), domaine: '', texte: '', photos: [], categorie: '', heure: new Date().toISOString() };
    }
  };
})(window);
</script>

<script>/* =========================================================================
   clients.js — Liste clients BFR et recherche pendant la saisie
   -------------------------------------------------------------------------
   - La liste de référence est embarquée dans l'application (clients-data.js,
     généré depuis le classeur « COORDONNÉES CLIENTS » par outils/extraire_clients.py).
     Elle est donc disponible HORS CONNEXION.
   - Le technicien tape 3 ou 4 lettres : l'application propose les
     correspondances (nom + ville + contact).
   - Tout ce qui est saisi et qui manque au classeur (téléphone du client,
     e-mail, logo, contact, corrections) est mémorisé dans le téléphone et
     reproposé aux interventions suivantes.
   ========================================================================= */
(function (global) {
  'use strict';

  const CLE_MEMO = 'sav3.clients';

  function norm(txt) {
    return String(txt == null ? '' : txt)
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')   // accents
      .toUpperCase()
      .replace(/[^A-Z0-9]+/g, '');                        // espaces, _, ., -, etc.
  }
  function joli(txt) {
    return String(txt == null ? '' : txt).replace(/_/g, ' ').replace(/\s+/g, ' ').trim();
  }

  const CLIENTS_EMBARQUES = Array.isArray(global.CLIENTS_BFR) ? global.CLIENTS_BFR.slice() : [];

  const Clients = {
    /* ---------- Lecture ---------------------------------------------------- */
    base: function () {
      return Array.isArray(global.CLIENTS_BFR) ? global.CLIENTS_BFR : [];
    },
    embarques: function () { return CLIENTS_EMBARQUES; },
    utiliseListeImportee: function () { return this.base() !== CLIENTS_EMBARQUES; },
    memo: function () {
      try { return JSON.parse(global.localStorage.getItem(CLE_MEMO) || '{}') || {}; } catch (e) { return {}; }
    },
    /* Liste de référence + tout ce que les techniciens ont saisi en plus.
       Les données locales complètent la liste (et non l'inverse). */
    liste: function () {
      const memo = this.memo();
      const vus = {};
      const out = [];
      this.base().forEach(c => {
        const cle = norm(c.nom);
        const dejaVu = vus[cle] || 0;
        vus[cle] = dejaVu + 1;
        out.push(Object.assign({}, c, memo[cle] || {}));
      });
      /* Clients saisis sur le terrain et absents du classeur : on les garde. */
      Object.keys(memo).forEach(k => {
        const m = memo[k];
        if (!m || !m.nom || vus[k]) return;
        if (Clients.base().some(c => norm(c.nom) === k)) return;
        vus[k] = 1;
        out.push(Object.assign({ contact: '', fonction: '', tel: '', adresse: '', ville: '', logo: '' }, m));
      });
      return out;
    },
    /* ---------- Recherche « 3 ou 4 lettres » ------------------------------- */
    /* Classement : d'abord les noms qui COMMENCENT par la saisie, puis ceux
       qui la contiennent ; à égalité, le nom le plus court est proposé avant.
       Si la saisie contient un espace (« Cremo Si »), on cherche aussi sur les
       mots suivants. */
    chercher: function (saisie, limite) {
      const q = norm(saisie);
      limite = limite || 8;
      if (q.length < 3) return [];                  // les propositions commencent à 3 lettres
      const large = q.length >= 4;                  // avant 4 lettres : seulement le début du nom
      const trouves = [];
      this.liste().forEach(c => {
        const n = norm(c.nom);
        const motsNom = String(c.nom || '').toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean).map(norm);
        let score = -1;
        if (n.indexOf(q) === 0) score = 0;                                  // commence par
        else if (motsNom.some(m => m.indexOf(q) === 0)) score = 1;          // un mot commence par
        else if (large && n.indexOf(q) > 0) score = 2;                      // contient le nom
        else if (large && norm(c.ville).indexOf(q) === 0) score = 3;        // ville
        else if (large && norm(c.contact).indexOf(q) === 0) score = 4;      // contact
        if (score >= 0) trouves.push({ score: score, c: c });
      });
      trouves.sort((a, b) => a.score - b.score || norm(a.c.nom).length - norm(b.c.nom).length ||
                             String(a.c.nom).localeCompare(String(b.c.nom), 'fr'));
      return trouves.slice(0, limite).map(x => x.c);
    },
    /* Recherche exacte par nom (pour retrouver les données mémorisées). */
    parNom: function (nom) {
      const n = norm(nom);
      if (!n) return null;
      const candidats = this.liste().filter(c => norm(c.nom) === n || norm(c.reference) === n);
      if (!candidats.length) return this.memo()[n] || null;
      return candidats[0];
    },
    /* ---------- Mémorisation ---------------------------------------------- */
    /* Ce que le technicien a saisi et qui n'est pas au classeur (tél., e-mail,
       logo, contact…) est conservé dans le téléphone pour la prochaine fois. */
    retenir: function (client) {
      if (!client || !client.nom) return;
      const memo = this.memo();
      const cle = norm(client.nom);
      const avant = memo[cle] || {};
      const apres = {
        nom: joli(client.nom), ville: client.lieu || client.ville || avant.ville || '',
        adresse: client.adresse || avant.adresse || '', contact: client.contact || avant.contact || '',
        fonction: client.fonction || avant.fonction || '', tel: client.tel || avant.tel || '',
        email: client.email || avant.email || '', logo: client.logo || avant.logo || '',
        numeroClient: client.numeroClient || avant.numeroClient || '',
        /* Langue retenue pour ce client : le rapport bilingue est reproposé
           à l'intervention suivante (le technicien garde la main). */
        langue: client.langue || avant.langue || '',
        maj: new Date().toISOString()
      };
      memo[cle] = apres;
      try {
        global.localStorage.setItem(CLE_MEMO, JSON.stringify(memo));
        return true;
      } catch (e) { return false; }
    },
    oublier: function (nom) {
      const memo = this.memo();
      delete memo[norm(nom)];
      try { global.localStorage.setItem(CLE_MEMO, JSON.stringify(memo)); } catch (e) {}
    },
    /* ---------- Remplacement complet de la liste (import CSV/JSON) --------- */
    /* Le technicien peut charger la dernière version du classeur sans
       reconstruire l'application : le contenu est conservé dans le téléphone. */
    importer: function (texte, surMesure, aUnProbleme) {
      const lignes = this.analyser(texte);
      if (!lignes.length) { if (aUnProbleme) aUnProbleme(); return 0; }
      try {
        global.localStorage.setItem('sav3.clientsListe', JSON.stringify(lignes));
        global.CLIENTS_BFR = lignes;              // prise en compte immédiate
      } catch (e) { return 0; }
      if (surMesure) surMesure(lignes.length);
      return lignes.length;
    },
    listeImportee: function () {
      try { return JSON.parse(global.localStorage.getItem('sav3.clientsListe') || 'null'); } catch (e) { return null; }
    },
    /* Analyse d'un CSV (export du classeur) ou d'un tableau JSON. */
    analyser: function (texte) {
      texte = String(texte || '').trim();
      if (!texte) return [];
      if (texte[0] === '[' || texte[0] === '{') {
        try {
          const d = JSON.parse(texte);
          const arr = Array.isArray(d) ? d : (d.clients || []);
          return arr.map(c => ({
            nom: joli(c.nom || c.Client || ''), reference: c.reference || '',
            adresse: String(c.adresse || '').trim(), ville: c.ville || '',
            contact: c.contact || '', fonction: c.fonction || '', tel: c.tel || '',
            email: c.email || '', logo: c.logo || '', autresContacts: c.autresContacts || '',
            /* Téléphone du client ({numero_client}) : il est saisi sur le terrain,
               il doit donc survivre à un export puis import sur un autre téléphone. */
            numeroClient: c.numeroClient || ''
          })).filter(c => c.nom);
        } catch (e) { return []; }
      }
      const lignes = this.decouperCSV(texte);
      const out = [];
      lignes.forEach(cols => {
        const nom = joli((cols[0] || '').trim());
        const adresse = (cols[1] || '').replace(/\r/g, '').trim();
        const contactBrut = (cols[2] || '').trim();
        const logo = (cols[3] || '').trim();
        if (!nom || /^client$/i.test(nom) || /^coordonn/i.test(nom) || /^technicien/i.test(nom)) return;
        if (!adresse && !contactBrut && !logo) return;
        const pc = this.decouperContact(contactBrut);
        out.push({
          nom: nom, reference: (cols[0] || '').trim(), adresse: adresse,
          ville: this.ville(adresse), contact: pc.contact, fonction: pc.fonction,
          tel: pc.tel, autresContacts: pc.autres, logo: logo
        });
      });
      return out;
    },
    decouperCSV: function (texte) {
      const lignes = [];
      let champ = '', ligne = [], dansGuillemets = false, i = 0;
      while (i < texte.length) {
        const c = texte[i];
        if (dansGuillemets) {
          if (c === '"' && texte[i + 1] === '"') { champ += '"'; i += 2; continue; }
          if (c === '"') { dansGuillemets = false; i++; continue; }
          champ += c; i++; continue;
        }
        if (c === '"') { dansGuillemets = true; i++; continue; }
        if (c === ',' || c === ';' || c === '\t') { ligne.push(champ); champ = ''; i++; continue; }
        if (c === '\n') { ligne.push(champ); lignes.push(ligne); ligne = []; champ = ''; i++; continue; }
        champ += c; i++;
      }
      if (champ || ligne.length) { ligne.push(champ); lignes.push(ligne); }
      return lignes;
    },
    ville: function (adresse) {
      const l = String(adresse || '').split('\n').map(x => x.trim()).filter(Boolean);
      if (!l.length) return '';
      const d = l[l.length - 1].replace(/^(?:\d{4,6}|[A-Z]\d[A-Z]\s?\d[A-Z]\d)\s*/i, '').trim();
      return d || l[l.length - 1];
    },
    /* Découpage du champ « Contact » du classeur : nom seul d'un côté,
       fonction et téléphone de l'autre (mêmes règles que le script Python). */
    decouperContact: function (brut) {
      brut = String(brut || '').replace(/\r/g, '');
      if (!brut.trim()) return { contact: '', fonction: '', tel: '', autres: '' };
      const t = brut.match(/(?:\+\d{1,3}[\s.\-/]*)?(?:\(?\d[\d\s.\-/]{7,}\d\)?)/g) || [];
      const tels = t.map(x => x.trim().replace(/\s+/g, ' ')).filter(x => (x.match(/\d/g) || []).length >= 9);
      const reste = brut.replace(/(?:\+\d{1,3}[\s.\-/]*)?(?:\(?\d[\d\s.\-/]{7,}\d\)?)/g, ' ')
        .replace(/[ \t]{2,}/g, ' ').replace(/\n/g, ' | ').replace(/([A-Za-zÀ-ÿ])-\s+/g, '$1 - ');
      const morceaux = reste.split(/\s+[-–—]\s+|\s*\|\s*|\s*:\s*|\s+\/\s+/).map(x => x.replace(/^[\s\-–:;,]+|[\s\-–:;,]+$/g, '')).filter(Boolean);
      let contact = morceaux[0] || '';
      let queue = morceaux.slice(1).join(' ');
      let autres = '';
      const m = queue.match(/\s+(?:ou|et)\s+(?=(?:M\.|Mr|Mme|Mlle)\b)/i);
      if (m) { autres = queue.slice(m.index + m[0].length).trim(); queue = queue.slice(0, m.index).trim(); }
      let fonction = queue.replace(/[\s.]+$/, '').replace(/(?:\s*\d[\d,.\-/\s]*)+$/, '').trim();
      const MOTS = ['respons', 'mainten', 'technic', 'chef', 'directeur', 'dirigeant', 'gérant', 'service',
        'magasin', 'approvision', 'adjoint', 'condition', 'production', 'qualit', 'achat', 'secteur',
        'atelier', 'usine', 'exploit', 'travaux', 'groupe', 'bureau', 'conducteur'];
      const estNom = /^(M\.|Mr|Mme|Mlle)\b/i.test(fonction) ||
        (fonction && !MOTS.some(x => fonction.toLowerCase().indexOf(x) >= 0) &&
         fonction.split(/\s+/).length <= 4 && fonction.split(/\s+/).filter(w => /^[A-ZÀ-Ý]/.test(w)).length >= 2);
      if (estNom) { autres = (fonction + (autres ? ' / ' + autres : '')).trim(); fonction = ''; }
      const mobile = tels.find(x => /^(06|07|\+?33\s?[67])/.test(x.replace(/\D/g, '').replace(/^33/, '0')));
      const tel = mobile || tels[0] || '';
      const restants = tels.filter(x => x !== tel);
      autres = [autres, restants.join(' / ')].filter(Boolean).join(' / ');
      return { contact: contact, fonction: fonction, tel: tel, autres: autres };
    }
  };

  /* Liste importée par le technicien : elle remplace la liste embarquée. */
  const listeImportee = Clients.listeImportee && (function () {
    try { return JSON.parse(global.localStorage.getItem('sav3.clientsListe') || 'null'); } catch (e) { return null; }
  })();
  if (Array.isArray(listeImportee) && listeImportee.length) {
    global.CLIENTS_BFR = listeImportee;
  }

  Clients.revenirListeOrigine = function () {
    try { global.localStorage.removeItem('sav3.clientsListe'); } catch (e) {}
    global.CLIENTS_BFR = CLIENTS_EMBARQUES;
  };
  const listeSauvee = (function () {
    try { return JSON.parse(global.localStorage.getItem('sav3.clientsListe') || 'null'); } catch (e) { return null; }
  })();
  if (Array.isArray(listeSauvee) && listeSauvee.length) global.CLIENTS_BFR = listeSauvee;

  global.Clients = Clients;
})(window);
</script>
<script>/* =========================================================================
   app.js — Application terrain « Rapport d'intervention »
   Écran unique, pensé pour aller vite :
     • un chrono à démarrer / mettre en pause / terminer (heures sur site)
     • un gros bouton « Ajouter un évènement » (l'assistant gère tout)
     • la signature du client après le point de fin d'intervention
     • « Soumettre le rapport » : PDF + Word envoyés au client et au SAV
   ========================================================================= */
(function () {
  'use strict';

  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = (p) => (p || 'i') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const todayISO = () => new Date().toISOString().slice(0, 10);

  function getPath(o, p) { return p.split('.').reduce((a, k) => (a == null ? undefined : a[k]), o); }
  function setPath(o, p, v) {
    const parts = p.split('.'); let c = o;
    for (let i = 0; i < parts.length - 1; i++) { if (c[parts[i]] == null) c[parts[i]] = {}; c = c[parts[i]]; }
    c[parts[parts.length - 1]] = v;
  }

  const Store = (function () {
    let ok = true;
    try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { ok = false; }
    const mem = {};
    return {
      ok: ok,
      get(k, def) { try { const v = ok ? localStorage.getItem(k) : mem[k]; return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
      set(k, v) { try { const s = JSON.stringify(v); if (ok) localStorage.setItem(k, s); else mem[k] = s; return true; } catch (e) { return false; } }
    };
  })();

  let toastTimer;
  function toast(msg, ms) {
    const t = $('#toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms || 2600);
  }
  function vibrate(ms) { if (navigator.vibrate) try { navigator.vibrate(ms || 12); } catch (e) {} }
  const pad2 = (n) => ('0' + n).slice(-2);

  /* ===================== Réglages ===================================== */
  const K = { settings: 'sav3.settings', rapport: 'sav3.rapport', rapports: 'sav3.rapports' };

  const DOMAINES_DEFAUT = [
    { id: 'MECANIQUE', libelle: 'Mécanique', icone: '🔧' },
    { id: 'ELECTRIQUE', libelle: 'Électrique', icone: '⚡' },
    { id: 'AUTOMATISME', libelle: 'Automatisme', icone: '🤖' }
  ];
  const CATEGORIES_DEFAUT = [
    { id: 'SECURITE', libelle: 'Problème de sécurité', icone: '🛑', couleur: '#b91c1c', fond: '#fee2e2' },
    { id: 'URGENT', libelle: 'Urgent', icone: '⚠️', couleur: '#c2410c', fond: '#ffedd5' },
    { id: 'HAUTE', libelle: 'Priorité haute', icone: '🔺', couleur: '#b45309', fond: '#fef3c7' },
    { id: 'BASSE', libelle: 'Priorité basse', icone: '🔽', couleur: '#1d4ed8', fond: '#dbeafe' },
    { id: 'INFO', libelle: 'Informatif', icone: 'ℹ️', couleur: '#475569', fond: '#e2e8f0' }
  ];

  const settingsDefaut = {
    societe: {
      nom: 'BFR SYSTEMS', sigle: 'BFR', sigleSuffixe: 'SYSTEMS', adresse: '', cpVille: '01150 BLYES',
      tel: '', email: '', siteWeb: '', siret: '', tva: '',
      /* Logo du modèle « Compte rendu d'intervention » utilisé tant qu'aucun
         logo n'a été choisi dans les réglages. */
      logo: (typeof window !== 'undefined' && window.LOGO_BFR) || '',
      lieuLettre: 'Blyes',                 // « À Blyes, le … »
      siege1: '', siege2: ''               // adresses du pied de page (celles du modèle par défaut)
    },
    technicien: { prenom: '', nom: '', fonction: 'Technicien SAV', tel: '', email: '', signature: '' },
    mail: {
      destinataireSAV: '', destinatairesCopie: '',
      objet: 'Rapport d\'intervention N° {{numero}} — {{client}} — {{date}}',
      corps: '', envoyerClient: true, envoyerSAV: true,
      messagePartage: 'Bonjour, veuillez trouver ci-joint le rapport d\'intervention N° {{numero}} du {{date}}. Cordialement.'
    },
    impression: {
      mentionClient: "Le client reconnaît avoir pris connaissance du présent rapport, avoir reçu les explications du technicien et accepte les constats et travaux décrits."
    },
    domaines: DOMAINES_DEFAUT,
    categories: CATEGORIES_DEFAUT,
    canevas: null,                 // null = canevas par défaut (Report.canevasDefaut())
    numeroPrefixe: ''
  };

  function fusion(base, modif) {
    const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
    if (!modif || typeof modif !== 'object') return out;
    Object.keys(modif).forEach(k => {
      if (modif[k] && typeof modif[k] === 'object' && !Array.isArray(modif[k]) && base && typeof base[k] === 'object' && !Array.isArray(base[k])) out[k] = fusion(base[k], modif[k]);
      else if (modif[k] !== undefined) out[k] = modif[k];
    });
    return out;
  }

  let S = fusion(settingsDefaut, Store.get(K.settings, {}));
  if (!S.canevas) S.canevas = Report.canevasDefaut();

  /* ===================== Intervention ================================= */
  function numeroSuggere() {
    const d = new Date();
    const base = d.getFullYear().toString().slice(2) + pad2(d.getMonth() + 1) + pad2(d.getDate());
    let seq = 1;
    const jour = todayISO();
    Store.get(K.rapports, []).forEach(r => { if (r.cree && r.cree.slice(0, 10) === jour) seq++; });
    return (S.numeroPrefixe ? S.numeroPrefixe.replace(/[-\s]+$/, '') + '-' : '') + base + '-' + pad2(seq);
  }

  function nouvelleIntervention() {
    return {
      id: uid('r'), cree: new Date().toISOString(), maj: new Date().toISOString(), statut: 'brouillon',
      numero: numeroSuggere(), date: todayISO(),
      client: { nom: '', reference: '', numeroClient: '', contact: '', fonction: '', tel: '', email: '',
                lieu: '', adresse: '', logo: '', noteContacts: '', langue: '' },
      /* Rapport bilingue : désactivé = un seul rapport en français ;
         activé = deux rapports (français + langue choisie). */
      langue: { active: false, code: '' },
      machine: { designation: '', marque: '', modele: '', serie: '', compteur: '', parc: '' },
      objet: '', technicien: Report.nomComplet(S.technicien),
      chrono: { debut: null, fin: null, pauses: [], enPause: false, debutPause: null },
      evenements: [], photosLibres: [],
      actions: '', aPrevoir: '', resumeTechnicien: '', noteInterne: '',
      travauxTermines: '', faitLe: todayISO(),
      signatureClient: { nom: '', fonction: '', dataUrl: '', date: '', heure: '' }
    };
  }

  let R = fusion(nouvelleIntervention(), Store.get(K.rapport, null) || {});
  if (!R.evenements) R.evenements = [];
  /* Rapports enregistrés avant l'option de traduction : valeurs par défaut. */
  if (!R.langue || typeof R.langue !== 'object') R.langue = { active: false, code: '' };
  if (R.client && R.client.langue == null) R.client.langue = '';

  let dirty = false, saveTimer;
  function sauver(silencieux) {
    R.maj = new Date().toISOString();
    const ok = Store.set(K.rapport, R);
    const liste = Store.get(K.rapports, []);
    const i = liste.findIndex(x => x.id === R.id);
    const leger = JSON.parse(JSON.stringify(R));
    leger.photosLibres = (leger.photosLibres || []).map(p => ({ legende: p.legende, dataUrl: '' }));
    leger.evenements = (leger.evenements || []).map(e => Object.assign({}, e, { photos: (e.photos || []).map(p => ({ dataUrl: '' })) }));
    if (i >= 0) liste[i] = leger; else liste.unshift(leger);
    if (liste.length > 40) liste.length = 40;
    const ok2 = Store.set(K.rapports, liste);
    if (!ok || !ok2) { if (!silencieux) toast('⚠️ Mémoire pleine : exportez la sauvegarde (☰)', 5000); return false; }
    dirty = false;
    if (!silencieux) toast('Enregistré');
    return true;
  }
  function planifier() { dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(() => sauver(true), 800); }

  /* ===================== Chronomètre ================================== */
  let tic = null;
  function duree() { return Report.dureeMs(R.chrono); }
  function dureeTexte() {
    const ms = duree();
    const s = Math.floor(ms / 1000);
    return Math.floor(s / 3600) + ':' + pad2(Math.floor((s % 3600) / 60)) + ':' + pad2(s % 60);
  }
  function demarrerChrono() {
    R.chrono.debut = new Date().toISOString();
    R.chrono.fin = null; R.chrono.pauses = []; R.chrono.enPause = false; R.chrono.debutPause = null;
    R.statut = 'en cours';
    if (!R.date) R.date = todayISO();
    planifier(); rendreChrono(); sauver(true);
    toast('Intervention démarrée à ' + Report.heureFr(R.chrono.debut));
  }
  function basculerPause() {
    if (!R.chrono.enPause) {
      R.chrono.enPause = true; R.chrono.debutPause = new Date().toISOString();
      toast('Pause (interruption, repas…) — le temps est déduit');
    } else {
      R.chrono.pauses.push({ d: R.chrono.debutPause, f: new Date().toISOString() });
      R.chrono.enPause = false; R.chrono.debutPause = null;
      toast('Reprise de l\'intervention');
    }
    planifier(); rendreChrono();
  }
  function terminerChrono() {
    if (R.chrono.enPause) basculerPause();
    R.chrono.fin = new Date().toISOString();
    R.statut = R.signatureClient.dataUrl ? 'signé' : 'terminé';
    R.travauxTermines = R.travauxTermines || 'Oui';
    planifier(); rendreChrono();
    toast('Intervention terminée — ' + Report.formatDuree(duree()) + ' sur site');
  }
  function rendreChrono() {
    const barre = $('#chronoBarre');
    if (!barre) return;
    const c = R.chrono;
    if (!c.debut) {
      barre.innerHTML = `<button class="btn chrono-demarrer" data-a="chrono-demarrer" style="width:100%">
        ▶️ Démarrer l'intervention</button>
        <p class="chrono-note">L'heure de début est enregistrée automatiquement.</p>`;
    } else if (!c.fin) {
      barre.innerHTML = `<div class="chrono-encours">
        <div class="chrono-temps"><span class="chrono-label">${c.enPause ? 'En pause depuis' : 'Sur site depuis'}</span>
          <strong id="chronoTemps">${dureeTexte()}</strong></div>
        <div class="chrono-actions">
          <button class="btn sm grey" data-a="chrono-pause">${c.enPause ? '▶️ Reprendre' : '⏸️ Pause'}</button>
          <button class="btn sm or" data-a="chrono-terminer">⏹️ Terminer</button>
        </div></div>
        <p class="chrono-note">Début ${Report.heureFr(c.debut)}${(c.pauses || []).length ? ' — ' + c.pauses.length + ' pause(s) déduite(s)' : ''}</p>`;
    } else {
      barre.innerHTML = `<div class="chrono-encours">
        <div class="chrono-temps"><span class="chrono-label">Temps sur site</span><strong>${Report.formatDuree(duree()) || '0 min'}</strong></div>
        <div class="chrono-actions"><button class="btn sm grey" data-a="chrono-ajuster">✏️ Ajuster</button></div></div>
        <p class="chrono-note">De ${Report.heureFr(c.debut)} à ${Report.heureFr(c.fin)}${(c.pauses || []).length ? ' — ' + c.pauses.length + ' pause(s)' : ''} • ${Report.dureeDecimale(duree())} h</p>`;
    }
    clearInterval(tic);
    if (c.debut && !c.fin && !c.enPause) {
      tic = setInterval(() => { const el = $('#chronoTemps'); if (el) el.textContent = dureeTexte(); else clearInterval(tic); }, 1000);
    }
  }

  /* ===================== Rendu ======================================= */
  function catDe(id) { return (S.categories || []).find(c => c.id === id) || S.categories[S.categories.length - 1] || { id: 'INFO', libelle: 'Informatif', couleur: '#475569', fond: '#e2e8f0', icone: 'ℹ️' }; }
  function domDe(id) { return (S.domaines || []).find(d => d.id === id) || { id: '', libelle: '—', icone: '' }; }

  function rendreTout() {
    const bm = $('#brandMark'), bn = $('#brandName');
    if (bn) bn.textContent = S.societe.nom || 'Rapport d\'intervention';
    if (bm) {
      if (S.societe.logo) { bm.innerHTML = '<img src="' + S.societe.logo + '" alt="logo">'; }
      else bm.textContent = S.societe.sigle || 'SAV';
    }
    const e = Report.etat(R, S);
    $('#hdrNum').textContent = (R.signatureClient.dataUrl ? '✔ Signé • ' : '') + 'N° ' + (R.numero || '—') +
      (R.client.nom ? ' • ' + R.client.nom : '');
    rendreChrono();
    rendreEntete();
    rendreEvenements(e);
    rendreCloture(e);
    $$('.compteur-ev').forEach(el => { el.textContent = String(e.evenements.length); });
  }

  function rendreEntete() {
    const zone = $('#zoneEntete');
    if (!zone) return;
    const c = R.client, m = R.machine;
    const renseigne = c.nom || m.designation;
    zone.innerHTML = `
      <div class="card">
        <h2>Intervention <button class="btn sm grey" data-a="editer-client">✏️ ${renseigne ? 'Modifier' : 'Renseigner'}</button></h2>
        ${renseigne
          ? `<div class="recap">
              <div><span>Client</span><strong>${esc(c.nom || '—')}</strong></div>
              <div><span>Lieu</span><strong>${esc(c.lieu || c.adresse || '—')}</strong></div>
              <div><span>Machine</span><strong>${esc([m.designation, m.modele].filter(Boolean).join(' — ') || '—')}</strong></div>
              <div><span>N° série</span><strong>${esc(m.serie || '—')}</strong></div>
              <div><span>Contact</span><strong>${esc(c.contact || '—')}</strong></div>
              <div><span>Objet</span><strong>${esc(R.objet || '—')}</strong></div>
              <div><span>Langue du rapport</span><strong>${R.langue.active && R.langue.code
                ? 'français + ' + esc(I18N.natif(R.langue.code))
                : 'français'}</strong></div>
            </div>`
          : `<p class="hint">Renseignez le client et la machine : ces informations se retrouvent dans le rapport.</p>
             <button class="btn wide" data-a="editer-client">Client & machine</button>`}
      </div>`;
  }

  function carteEvenement(ev, i) {
    const cat = catDe(ev.categorie), dom = domDe(ev.domaine);
    const texte = Report.valeur(ev.texte);
    return `<div class="ev-carte" data-ev="${ev.id}" style="--c:${cat.couleur};--f:${cat.fond}">
      <div class="ev-tete">
        <span class="ev-dom">${esc(dom.icone)} ${esc(dom.libelle)}</span>
        <span class="ev-cat">${esc(cat.icone)} ${esc(cat.libelle)}</span>
        <span class="ev-heure">${esc(Report.heureFr(ev.heure))}</span>
      </div>
      <div class="ev-corps">
        ${(ev.photos || []).length ? `<div class="ev-vignettes">${ev.photos.slice(0, 3).map(p => `<img src="${p.dataUrl}" alt="">`).join('')}</div>` : ''}
        <p class="ev-texte">${texte ? esc(texte.length > 180 ? texte.slice(0, 180) + '…' : texte) : '<em>Annotation à compléter…</em>'}</p>
      </div>
      <div class="ev-pied">
        ${(ev.photos || []).length ? `<span class="pill">${ev.photos.length} photo(s)</span>` : '<span class="pill">sans photo</span>'}
        ${!ev.texte ? '<span class="pill surv">texte manquant</span>' : ''}
        <span class="ev-modifier">Modifier ›</span>
      </div>
    </div>`;
  }

  function rendreEvenements(e) {
    const zone = $('#zoneEvenements');
    if (!zone) return;
    const evs = R.evenements.slice().sort((a, b) => new Date(a.heure || 0) - new Date(b.heure || 0));
    zone.innerHTML = `
      <div class="card">
        <h2>Évènements <span class="pill compteur-ev">0</span></h2>

  /* ===================== Évènements =================================== */
  function ajouterEvenement() {
    const ev = Assistant.nouvelEvenement();
    R.evenements.push(ev);
    planifier();
    Assistant.ouvrir(ev, {
      reglages: S,
      toast: toast,
      onMaj: () => { planifier(); rendreTout(); },
      onSupprimer: (x) => {
        R.evenements = R.evenements.filter(e => e.id !== x.id);
        planifier(); rendreTout();
      },
      onFermer: () => {
        // un évènement vide (créé puis abandonné) est supprimé automatiquement
        const vide = !ev.domaine && !Report.valeur(ev.texte) && !(ev.photos || []).length;
        if (vide) R.evenements = R.evenements.filter(e => e.id !== ev.id);
        planifier(); rendreTout();
      }
    });
  }

  function editerEvenement(id) {
    const ev = R.evenements.find(e => e.id === id);
    if (!ev) return;
    Assistant.ouvrir(ev, {
      reglages: S, toast: toast,
      onMaj: () => { planifier(); rendreTout(); },
      onSupprimer: (x) => { R.evenements = R.evenements.filter(e => e.id !== x.id); planifier(); rendreTout(); },

      return `<div class="field"><label>${esc(label)}</label><input type="${opt.type || 'text'}" data-fk="${k}" value="${esc(val)}" placeholder="${esc(opt.ph || '')}"${opt.list ? ' list="' + opt.list + '"' : ''}></div>`;
