<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Rapport d'intervention — BFR Systems</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rapport SAV">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Saisie, photos annotées, signature client et envoi du rapport d'intervention. Fonctionne hors connexion.">
<!-- Site destiné à l'équipe : hors des moteurs de recherche. -->
<meta name="robots" content="noindex, nofollow">
<style>:root {
  --bleu: #0b3d91;
  --bleu-fonce: #072a66;
  --bleu-clair: #e8effa;
  --gris: #64748b;
  --gris-clair: #f1f5f9;
  --bord: #d7dfe9;
  --texte: #101a2b;
  --ok: #15803d;
  --ok-bg: #dcfce7;
  --surv: #b45309;
  --surv-bg: #fef3c7;
  --def: #b91c1c;
  --def-bg: #fee2e2;
  --radius: 14px;
  --tap: 48px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; background: #eef2f7; color: var(--texte);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px; line-height: 1.35; overscroll-behavior-y: contain;
}
body { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }

/* ---------- Barre supérieure ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  background: linear-gradient(180deg, var(--bleu) 0%, var(--bleu-fonce) 100%); color: #fff;
  box-shadow: 0 2px 10px rgba(7, 42, 102, .35);
}
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand .mark {
  width: 40px; height: 40px; border-radius: 11px; flex: 0 0 auto; background: rgba(255,255,255,.15);
  display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: .5px;
  border: 1px solid rgba(255,255,255,.3); overflow: hidden;
}
.brand .mark img { width: 100%; height: 100%; object-fit: contain; }
.brand h1 { font-size: 15.5px; margin: 0; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { display: block; font-size: 11.5px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn {
  width: 44px; height: 44px; border-radius: 11px; border: 1px solid rgba(255,255,255,.28);
  background: rgba(255,255,255,.12); color: #fff; font-size: 19px; line-height: 1; display: grid; place-items: center; cursor: pointer;
}
.iconbtn:active { background: rgba(255,255,255,.28); }

/* ---------- Chronomètre ---------- */
.chrono { position: sticky; top: 60px; z-index: 35; background: #fff; border-bottom: 1px solid var(--bord); padding: 10px 12px 8px; }
.chrono-demarrer { font-size: 16px; min-height: 54px; }
.chrono-encours { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.chrono-temps { display: flex; flex-direction: column; line-height: 1.1; }
.chrono-label { font-size: 11.5px; color: var(--gris); text-transform: uppercase; letter-spacing: .4px; }
.chrono-temps strong { font-size: 24px; font-variant-numeric: tabular-nums; color: var(--bleu-fonce); }
.chrono-actions { display: flex; gap: 6px; }
.chrono-note { margin: 6px 0 0; font-size: 12px; color: var(--gris); }

/* ---------- Contenu ---------- */
main { max-width: 760px; margin: 0 auto; padding: 12px 12px 24px; }
.card {
  background: #fff; border: 1px solid var(--bord); border-radius: var(--radius);
  padding: 12px; margin: 0 0 12px; box-shadow: 0 1px 2px rgba(16, 26, 43, .05);
}
.card > h2 {
  font-size: 14px; margin: 0 0 10px; color: var(--bleu); text-transform: uppercase; letter-spacing: .4px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.card > h2::after { content: ""; flex: 1; height: 1px; background: var(--bord); order: 3; }
.card > h2 .pill { order: 2; text-transform: none; letter-spacing: 0; margin-left: auto; }
.card > h2 .btn { order: 2; margin-left: auto; }
.hint { font-size: 12.5px; color: var(--gris); margin: 0 0 10px; }
.small { font-size: 12.5px; color: var(--gris); }
.sep { height: 1px; background: var(--bord); margin: 12px 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } }

.field { margin-bottom: 10px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; color: #334155; margin-bottom: 4px; }
input[type=text], input[type=tel], input[type=email], input[type=date], input[type=time],
input[type=datetime-local], input[type=number], select, textarea {
  width: 100%; min-height: var(--tap); padding: 10px 12px; border: 1px solid var(--bord);
  border-radius: 11px; background: #fff; color: var(--texte); font-size: 16px; font-family: inherit;
}
textarea { min-height: 84px; resize: vertical; line-height: 1.4; }
input:focus, select:focus, textarea:focus { outline: 2px solid #93c5fd; border-color: var(--bleu); }

.btn {
  min-height: var(--tap); padding: 10px 14px; border-radius: 11px; border: 1px solid var(--bleu);
  background: var(--bleu); color: #fff; font-size: 15px; font-weight: 650; font-family: inherit;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .5; }
.btn.ghost { background: #fff; color: var(--bleu); }
.btn.grey { background: #fff; color: #334155; border-color: var(--bord); }
.btn.or { background: #ea580c; border-color: #ea580c; }
.btn.danger { background: #fff; border-color: #fca5a5; color: var(--def); }
.btn.wide { width: 100%; }
.btn.sm { min-height: 38px; padding: 6px 11px; font-size: 13.5px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow .btn { flex: 1 1 auto; }

.pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
  padding: 4px 9px; border-radius: 999px; background: var(--gris-clair); color: #334155;
}
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.surv { background: var(--surv-bg); color: var(--surv); }
.pill.def { background: var(--def-bg); color: var(--def); }

/* ---------- Récapitulatif client / machine ---------- */
.recap { display: grid; gap: 6px; }
.recap > div { display: flex; gap: 8px; align-items: baseline; font-size: 14px; }
.recap span { flex: 0 0 92px; color: var(--gris); font-size: 12.5px; }
.recap strong { flex: 1; font-weight: 600; }

/* ---------- Cartes d'évènement ---------- */
.ev-liste { display: flex; flex-direction: column; gap: 10px; }
.ev-carte {
  border: 1px solid var(--bord); border-left: 5px solid var(--c, var(--bleu)); border-radius: 12px;
  overflow: hidden; background: #fff; cursor: pointer;
}
.ev-carte:active { background: #f8fafc; }
.ev-tete { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--f, #f1f5f9); }
.ev-dom { font-size: 13px; font-weight: 700; color: #1e293b; }
.ev-cat { font-size: 12px; font-weight: 700; color: var(--c); margin-left: auto; text-align: right; }
.ev-heure { font-size: 11.5px; color: var(--gris); }
.ev-corps { display: flex; gap: 10px; padding: 10px; }
.ev-vignettes { display: flex; gap: 4px; flex: 0 0 auto; }
.ev-vignettes img { width: 54px; height: 54px; object-fit: cover; border-radius: 8px; border: 1px solid var(--bord); }
.ev-texte { margin: 0; font-size: 14.5px; }
.ev-pied { display: flex; align-items: center; gap: 6px; padding: 0 10px 10px; }
.ev-modifier { margin-left: auto; color: var(--bleu); font-weight: 650; font-size: 13.5px; }
.ev-vide { text-align: center; padding: 18px 10px; color: var(--gris); }
.ev-vide-ico { font-size: 34px; display: block; margin-bottom: 6px; }
.ev-vide p { margin: 2px 0; }
.alerte-securite {
  background: var(--def-bg); border: 1px solid #fca5a5; color: var(--def); border-radius: 10px;
  padding: 9px 11px; font-size: 13.5px; font-weight: 600; margin-bottom: 10px;
}
.signe-ok {
  background: var(--ok-bg); border: 1px solid #86efac; border-radius: 10px; padding: 10px; font-size: 14px;
}
.signe-ok img { display: block; max-height: 70px; margin-top: 6px; background: #fff; border-radius: 6px; }

/* ---------- Barre d'action basse ---------- */
.actionbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; gap: 8px;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  background: rgba(255,255,255,.97); border-top: 1px solid var(--bord);
  box-shadow: 0 -2px 12px rgba(16,26,43,.09); backdrop-filter: blur(6px);
}
.actionbar .btn { flex: 1; }
.actionbar .btn.principal { flex: 1.6; font-size: 15.5px; }

/* ---------- Assistant (évènement, signature) ---------- */
.assistant {
  position: fixed; inset: 0; z-index: 80; background: #eef2f7; display: flex; flex-direction: column;
  animation: monte .18s ease-out;
}
@keyframes monte { from { transform: translateY(18px); opacity: .6; } to { transform: none; opacity: 1; } }
.assistant-bar {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  background: linear-gradient(180deg, var(--bleu) 0%, var(--bleu-fonce) 100%); color: #fff;
}
.assistant-bar .iconbtn { border-color: rgba(255,255,255,.3); }
.assistant-titre { flex: 1; text-align: center; font-weight: 650; }
.assistant-progres { display: flex; align-items: center; gap: 6px; padding: 9px 12px; background: #fff; border-bottom: 1px solid var(--bord); }
.pas { width: 26px; height: 5px; border-radius: 3px; background: var(--bord); }
.pas.actif { background: var(--bleu); }
.pas.fait { background: #22c55e; }
.pas-libelle { margin-left: auto; font-size: 12px; color: var(--gris); font-weight: 600; }
.assistant-corps { flex: 1; overflow-y: auto; padding: 14px 12px 20px; max-width: 760px; width: 100%; margin: 0 auto; }
.assistant-question { font-size: 18px; font-weight: 700; margin: 0 0 6px; }
.assistant-note { font-size: 13px; color: var(--gris); margin: 0 0 12px; }
.assistant-nav {
  display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  background: #fff; border-top: 1px solid var(--bord);
}
.assistant-nav .btn { flex: 1; }
.assistant-nav .btn.danger { flex: 0 0 auto; }

.domaines { display: flex; flex-direction: column; gap: 10px; }
.domaine {
  display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 12px 18px; border-radius: 14px;
  border: 2px solid var(--bord); background: #fff; font-size: 19px; font-weight: 650; font-family: inherit;
  color: var(--texte); cursor: pointer;
}
.domaine .ico { font-size: 30px; }
.domaine.on { border-color: var(--bleu); background: var(--bleu-clair); }
.categories { display: flex; flex-direction: column; gap: 9px; }
.categorie {
  display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 10px 14px; border-radius: 13px;
  border: 2px solid var(--bord); border-left: 8px solid var(--c); background: #fff; font-family: inherit;
  font-size: 16.5px; font-weight: 650; color: var(--texte); cursor: pointer; text-align: left;
}
.categorie .ico { font-size: 22px; }
.categorie .fleche { margin-left: auto; color: var(--c); font-size: 20px; }
.categorie.on { background: var(--f); border-color: var(--c); }
.ev-texte { width: 100%; min-height: 160px; }
.ev-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 12px; }
.ev-photo { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--bord); background: #000; }
.ev-photo img { display: block; width: 100%; height: 130px; object-fit: cover; }
.ev-photo-annot {
  width: 100%; border: 0; border-radius: 0; background: #0b3d91; color: #fff; min-height: 40px;
  font-size: 14px; font-weight: 650; font-family: inherit; cursor: pointer;
}
.ev-photo-rm {
  position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border-radius: 50%; border: 0;
  background: rgba(0,0,0,.6); color: #fff; font-size: 16px; cursor: pointer;
}
.ev-photo-badge {
  position: absolute; top: 6px; left: 6px; background: #22c55e; color: #fff; font-size: 11px;
  font-weight: 700; padding: 3px 8px; border-radius: 999px;
}
.ev-recap { margin-top: 14px; border: 1px solid var(--bord); border-radius: 12px; background: #fff; padding: 10px 12px; }
.ev-recap-ligne { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
.ev-recap-ligne span { color: var(--gris); }

/* ---------- Éditeur d'annotation photo ---------- */
.annot-editeur { position: fixed; inset: 0; z-index: 110; background: #0b1220; display: flex; flex-direction: column; }
.annot-bar {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; color: #fff;
  background: rgba(2, 6, 23, .9);
}
.annot-titre { flex: 1; text-align: center; font-weight: 650; }
.annot-zone { flex: 1; position: relative; overflow: hidden; touch-action: none; }
.annot-zone canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.annot-vide {
  position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; color: #cbd5e1;
  font-size: 13px; padding: 0 20px; pointer-events: none;
}
.annot-outils { background: rgba(2, 6, 23, .95); padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); }
.annot-ligne { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.annot-ligne + .annot-ligne { margin-top: 8px; }
.outil {
  display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 70px; padding: 6px 10px;
  border-radius: 10px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08);
  color: #e2e8f0; font-size: 11.5px; font-family: inherit; cursor: pointer;
}
.outil span { font-size: 18px; }
.outil.on { background: #2563eb; border-color: #2563eb; color: #fff; }
.pastille { width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(255,255,255,.5); cursor: pointer; }
.pastille.on { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.35); }

.annot-erreur {
  position: absolute; left: 50%; bottom: 108px; transform: translateX(-50%);
  background: rgba(185, 28, 28, .95); color: #fff; font-size: 13px; padding: 9px 14px;
  border-radius: 999px; max-width: 92%; text-align: center; z-index: 5;
}

/* ---------- Signature ---------- */
.sig-client-corps { flex: 1; overflow-y: auto; padding: 14px 12px 20px; max-width: 760px; width: 100%; margin: 0 auto; }
.sigwrap { border: 1.5px dashed var(--bord); border-radius: 12px; background: #fff; position: relative; overflow: hidden; touch-action: none; }
.sigwrap canvas { display: block; width: 100%; height: 210px; touch-action: none; }
.sigwrap .ph { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; color: #a8b3c2; font-size: 14px; }
.sigwrap.signed { border-style: solid; border-color: var(--ok); }
.agreement {
  display: flex; gap: 10px; align-items: flex-start; background: var(--gris-clair); border: 1px solid var(--bord);
  border-radius: 11px; padding: 10px; margin-bottom: 10px; font-size: 13.5px;
}
.agreement input { width: 22px; height: 22px; min-height: 0; flex: 0 0 auto; margin-top: 1px; }

/* ---------- Photos ---------- */
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.photo { position: relative; border-radius: 11px; overflow: hidden; border: 1px solid var(--bord); background: #000; }
.photo img { display: block; width: 100%; height: 118px; object-fit: cover; }
.photo .cap { width: 100%; border: 0; border-radius: 0; min-height: 36px; font-size: 12.5px; padding: 6px 8px; }
.photo .rm {
  position: absolute; top: 5px; right: 5px; width: 32px; height: 32px; border-radius: 50%; border: 0;
  background: rgba(0,0,0,.6); color: #fff; font-size: 16px; cursor: pointer;
}
.filebtn { display: block; position: relative; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.filebtn label {
  display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 11px;
  border: 1.5px dashed var(--bleu); color: var(--bleu); font-weight: 650; font-size: 14.5px; cursor: pointer; background: #fff;
}

/* ---------- Panneaux / feuilles ---------- */
.sheet { position: fixed; inset: 0; z-index: 90; display: none; background: rgba(9, 17, 33, .5); }
.sheet.open { display: block; }
.sheet .panel {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow-y: auto; background: #eef2f7;
  border-radius: 20px 20px 0 0; padding: 8px 12px calc(20px + env(safe-area-inset-bottom));
  animation: up .2s ease-out;
}
@keyframes up { from { transform: translateY(30px); opacity: .5; } to { transform: none; opacity: 1; } }
.sheet .grab { width: 44px; height: 4px; border-radius: 3px; background: #cbd5e1; margin: 8px auto 12px; }
.sheet h3 { margin: 0 0 4px; font-size: 18px; }
.sheet .sub { font-size: 12.5px; color: var(--gris); margin: 0 0 14px; }
.menu-item {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; min-height: 54px; padding: 10px 12px;
  border: 1px solid var(--bord); border-radius: 11px; background: #fff; font-size: 15px; font-family: inherit;
  color: var(--texte); margin-bottom: 8px; cursor: pointer;
}
.menu-item .ico { font-size: 19px; width: 24px; text-align: center; }
.menu-item small { display: block; color: var(--gris); font-size: 12px; font-weight: 400; }
.sticky-note { background: #fffbeb; border: 1px solid #fde68a; border-radius: 11px; padding: 10px; font-size: 13px; }
ul.liste { margin: 0; padding-left: 18px; }
ul.liste li { margin-bottom: 6px; }
.kpi { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- Divers ---------- */
#toast {
  position: fixed; left: 50%; bottom: calc(104px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(20px); background: #0f172a; color: #fff; padding: 11px 16px;
  border-radius: 999px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: .2s; z-index: 130;
  max-width: 92vw; text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%); }

@media print { .topbar, .chrono, .actionbar, .sheet, .assistant, #toast { display: none !important; } }

/* ---------- Autocomplétion de la liste clients ---------- */
.suggestions {
  margin-top: 6px;
  border: 1px solid var(--bord);
  border-radius: 10px;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 6px 18px rgba(15, 23, 42, .08);
}
.suggestion {
  display: block;
  width: 100%;
  text-align: left;
  padding: 10px 12px;
  border: 0;
  border-bottom: 1px solid var(--bord);
  background: #fff;
  font: inherit;
  cursor: pointer;
}
.suggestion:last-child { border-bottom: 0; }
.suggestion:active, .suggestion:hover { background: #eef4ff; }
.sug-nom { display: block; font-weight: 600; font-size: 14px; color: var(--texte); }
.sug-detail { display: block; font-size: 12px; color: var(--gris); margin-top: 2px; }

/* ---------- Aperçu du rapport (rendu interne, sans visionneuse PDF) ---------- */
.apercu-zone {
  max-height: 62vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: #e6ebf2;
  border-radius: 10px;
  padding: 10px;
  border: 1px solid var(--bord);
}
.apercu-feuille { margin: 0 auto 12px; text-align: center; }
.apercu-page {
  width: 100%;
  max-width: 620px;
  height: auto;
  display: block;
  margin: 0 auto;
  background: #fff;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  box-shadow: 0 2px 8px rgba(15, 23, 42, .12);
}
.apercu-num { font-size: 11.5px; color: var(--gris); margin: 4px 0 8px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="mark" id="brandMark">SAV</div>
    <div style="min-width:0">
      <h1 id="brandName">Rapport d'intervention</h1>
      <small id="hdrNum">N° —</small>
    </div>
  </div>
  <button class="iconbtn" id="btnMenu" aria-label="Menu">☰</button>
</header>

<div class="chrono" id="chronoBarre"></div>

<main>
  <div id="zoneEntete"></div>
  <div id="zoneEvenements"></div>
  <div id="zoneCloture"></div>
</main>

<div class="actionbar">
  <button class="btn principal" id="btnAjouter">＋ Ajouter un évènement</button>
  <button class="btn grey" id="btnSigner">✍️</button>
  <button class="btn or" id="btnSoumettre">📤</button>
</div>

<div id="toast"></div>

<script>/* =========================================================================
   langues.js — Traduction du rapport dans la langue du client
   -------------------------------------------------------------------------
   Deux mécanismes complémentaires :

   1. PACKS DE LANGUE (ce fichier) : tous les libellés fixes du rapport
      (titres, tableaux, mentions, pied de page…) sont traduits par un
      dictionnaire embarqué. Cela fonctionne HORS CONNEXION, sans rien
      installer, et c'est identique dans le PDF, l'aperçu et le Word.

   2. TRADUCTION AUTOMATIQUE (traduction.js) : les textes SAISIS par le

      [/^Page (\d+) \/ (\d+)$/, 'Página $1 / $2'],
      [/^(\d+) év[èé]nement\(s\)$/, '$1 evento(s)'],
      [/^(\d+) photo\(s\)$/, '$1 foto(s)'],
      [/^Photo (\d+)$/, 'Foto $1'],
      [/^À l'attention de (.*),$/, 'À atenção de $1,'],
      [/^À (.+), le (.+),$/, 'Em $1, a $2,'],
      [/^Heures passées sur site : (.*)$/, 'Horas no local: $1'],
      [/^Photos : (.*)$/, 'Fotos: $1'],
      [/^Compte rendu d'intervention N° (.*)$/, 'Relatório de intervenção n.º $1']

  /* --- Phrase bilingue ajoutée au mail quand la traduction est active --- */
  const PHRASES = {
    en: 'Please find attached the service report in French and its English version.',
    de: 'Im Anhang finden Sie den Servicebericht auf Französisch und die deutsche Fassung.',
    nl: 'In bijlage vindt u het serviceverslag in het Frans en de Nederlandse versie.',
    es: 'Adjunto encontrará el informe de intervención en francés y su versión en español.',
    it: 'In allegato il rapporto di intervento in francese e la versione in italiano.',

    /* Langue par son code, ou null. */

      return LANGUES.filter(function (l) { return l.code === code; })[0] || null;
    },
    nom: function (code) {

    },
    natif: function (code) {

    phraseTraduction: function (code) {

<script>/* =========================================================================
   traduction.js — Traduction du rapport dans la langue du client
   -------------------------------------------------------------------------
   • Les libellés du rapport (titres, tableaux, mentions, pied de page) sont
     traduits par les packs de langue embarqués (langues.js) : toujours
     disponibles, hors connexion.

   • Les textes SAISIS par le technicien (objet, actions, observations,
     synthèse) sont traduits par le traducteur intégré du téléphone :
       - API « Translator » de Chrome (Android, Chrome 138+) : gratuite,
         aucune clé, et HORS CONNEXION une fois la langue téléchargée ;
       - repli sur l'API précédente « self.translation ».
     Si le traducteur n'est pas disponible (navigateur plus ancien, modèle
     non téléchargeable sans réseau), l'application le dit clairement et
     laisse le choix : envoyer seulement le français, ou la version traduite
     avec les libellés traduits et les commentaires en français.
   ========================================================================= */
(function (global) {
  'use strict';

  const SRC = 'fr';

  function api() {
    if (typeof global.Translator !== 'undefined' && global.Translator && global.Translator.create) {
      return { type: 'moderne', obj: global.Translator };
    }
    if (global.ai && global.ai.translator && global.ai.translator.create) {
      return { type: 'moderne', obj: global.ai.translator };
    }
    if (global.translation && global.translation.createTranslator) {
      return { type: 'ancienne', obj: global.translation };
    }
    return null;
  }

  const Traduction = {
    /* ---------- Disponibilité ------------------------------------------- */
    /* Le téléphone sait-il traduire ? (sans rien télécharger) */
    utilisable: function () { return !!api(); },
    explication: function () {
      const a = api();
      if (!a) return "Ce téléphone ne propose pas la traduction automatique : les libellés du rapport seront traduits, les commentaires resteront en français.";
      return '';
    },

    /* État du modèle de langue : 'available', 'downloadable', 'downloading',
       'unavailable' ou 'inconnu' (API indisponible). */
    etatModele: function (code) {
      const a = api();
      if (!a) return Promise.resolve('inconnu');
      const p = a.type === 'moderne'
        ? a.obj.availability({ sourceLanguage: SRC, targetLanguage: code })
        : a.obj.canTranslate({ sourceLanguage: SRC, targetLanguage: code });
      return Promise.resolve(p).then(function (r) {
        return r === 'readily' ? 'available' : (r === 'after-download' ? 'downloadable' : (r === 'no' ? 'unavailable' : r));
      }).catch(function () { return 'unavailable'; });
    },

    /* ---------- Préparation du traducteur ------------------------------- */
    /* Crée le traducteur fr -> code ; télécharge le modèle si nécessaire
       (une seule fois par langue sur le téléphone). */
    pret: async function (code, surEtat) {
      const a = api();
      if (!a) return { ok: false, motif: 'indisponible' };
      if (this._code === code && this._moteur) return { ok: true };
      this.fermer();

      const suivi = function (m) {
        if (!m || !m.addEventListener || !surEtat) return;
        m.addEventListener('downloadprogress', function (e) {
          const pct = e.total ? Math.round(e.loaded / e.total * 100) : Math.round((e.loaded || 0) * 100);
          surEtat({ etape: 'telechargement', pct: Math.max(0, Math.min(100, pct)) });
        });
      };
      try {
        const moteur = a.type === 'moderne'
          ? await a.obj.create({ sourceLanguage: SRC, targetLanguage: code, monitor: suivi })
          : await a.obj.createTranslator({ sourceLanguage: SRC, targetLanguage: code, monitor: suivi });
        this._moteur = moteur;
        this._code = code;
        this._cache = this._cache || {};
        return { ok: true };
      } catch (e) {
        const msg = (e && e.message) ? e.message : String(e);
        /* Cas courant : pas de réseau au premier usage d'une langue. */
        return { ok: false, motif: /download|fetch|network|réseau/i.test(msg) ? 'modele' : 'refus', detail: msg };
      }
    },

    fermer: function () {
      if (this._moteur && this._moteur.destroy) { try { this._moteur.destroy(); } catch (e) {} }
      this._moteur = null;
      this._code = null;
    },

    /* ---------- Traduction d'un texte ----------------------------------- */
    /* Découpe par paragraphes (les sauts de ligne du rapport sont conservés). */
    texte: async function (txt, code, surEtat) {
      const brut = String(txt == null ? '' : txt);
      if (!brut.trim()) return brut;
      const res = await this.pret(code, surEtat);
      if (!res.ok) throw new Error(res.motif);
      this._cache = this._cache || {};
      const cleTexte = code + '\u0000' + brut;
      if (this._cache[cleTexte]) return this._cache[cleTexte];

      const lignes = brut.split('\n');
      const sorties = [];
      for (let i = 0; i < lignes.length; i++) {
        const l = lignes[i];
        if (!l.trim()) { sorties.push(l); continue; }
        const cleLigne = code + '\u0000' + l;
        if (this._cache[cleLigne]) { sorties.push(this._cache[cleLigne]); continue; }
        let t;
        try {
          t = await this._moteur.translate(l);
        } catch (e) {
          t = l;                       // une ligne en échec ne bloque pas le rapport
        }
        this._cache[cleLigne] = t;
        sorties.push(t);
      }
      const resultat = sorties.join('\n');
      this._cache[cleTexte] = resultat;
      return resultat;
    },

    /* ---------- Champs du rapport à traduire ---------------------------- */
    /* Objet, travaux, synthèse, annotations des évènements et légendes.
       Ne sont JAMAIS traduits : nom du client, adresses, contacts, machine,
       n° de série, dates, heures et données de signature (données du terrain). */
    champs: function (i) {
      const taches = [];
      const ajouter = function (obj, champ, etiquette) {
        if (obj && typeof obj[champ] === 'string' && obj[champ].trim()) {
          taches.push({ obj: obj, champ: champ, etiquette: etiquette, texte: obj[champ] });
        }
      };
      ajouter(i, 'objet', "Objet / demande");
      ajouter(i, 'actions', 'Travaux réalisés');
      ajouter(i, 'aPrevoir', 'Travaux à prévoir');
      ajouter(i, 'resumeTechnicien', 'Synthèse');
      ajouter(i, 'travauxTermines', 'Travaux terminés');
      (i.evenements || []).forEach(function (ev, k) {
        ajouter(ev, 'texte', 'Évènement ' + (k + 1));
        (ev.photos || []).forEach(function (ph) { ajouter(ph, 'legende', 'Légende de photo'); });
      });
      (i.photosLibres || []).forEach(function (ph) { ajouter(ph, 'legende', 'Légende de photo'); });
      return taches;
    },

    /* ---------- Traduction complète d'un rapport ------------------------ */
    /* Renvoie une COPIE du rapport : le rapport français n'est jamais modifié.
       { ok, rapport, nb, erreurs } ou { ok:false, motif }. */
    rapport: async function (i, code, surEtat) {
      const taches = this.champs(i);
      if (!this.utilisable()) {
        return { ok: false, motif: 'indisponible', taches: taches.length };
      }
      const copie = Object.assign({}, i, {
        evenements: (i.evenements || []).map(function (ev) {
          return Object.assign({}, ev, { photos: (ev.photos || []).map(function (ph) { return Object.assign({}, ph); }) });
        }),
        photosLibres: (i.photosLibres || []).map(function (ph) { return Object.assign({}, ph); })
      });
      /* on retraduit les mêmes champs sur la copie */
      const copieTaches = this.champs(copie);
      const total = copieTaches.length;
      let fait = 0, erreurs = 0;
      if (surEtat) surEtat({ etape: 'traduction', fait: 0, total: total, pct: 0 });
      for (let k = 0; k < copieTaches.length; k++) {
        const t = copieTaches[k];
        if (surEtat) surEtat({ etape: 'traduction', etiquette: t.etiquette, fait: fait, total: total, pct: total ? Math.round(fait / total * 100) : 0 });
        try {
          t.obj[t.champ] = await this.texte(t.texte, code, surEtat);
        } catch (e) {
          erreurs++;                                   // texte laissé en français
        }
        fait++;
      }
      if (surEtat) surEtat({ etape: 'traduction', fait: total, total: total, pct: 100 });
      return { ok: true, rapport: copie, nb: total - erreurs, total: total, erreurs: erreurs };
    }
  };

  global.Traduction = Traduction;
})(window);
</script>

      this.page.ops.push(`q ${f(opt.width || 0.7)} w ${c.join(' ')} RG ${f(x1)} ${f(this._ty(y1))} m ${f(x2)} ${f(this._ty(y2))} l S Q`);

    text(str, x, y, opt) {

      const size = opt.size || 9;
      const font = opt.font || 'F1';
      const color = opt.color || [0.1, 0.1, 0.12];
      let px = x;
      if (opt.align === 'right') px = x - measure(str, size, opt.bold);

      this.page.images.push({ name: name, bytes: jpegBytes, w: w, h: h });

    /** Sérialise le document. */
    build() {

        { num: ++n, base: 'Helvetica-Bold' },
        { num: ++n, base: 'Helvetica-Oblique' },

        const info = { page: ++n, content: ++n, images: [] };
        p.images.forEach(im => { im.num = ++n; info.images.push(im); });

      const put = (num, body) => { objs.push({ num: num, body: body }); };

      put(catalogNum, `<< /Type /Catalog /Pages ${pagesNum} 0 R >>`);
      put(pagesNum, `<< /Type /Pages /Kids [${pageInfos.map(p => p.page + ' 0 R').join(' ')}] /Count ${pageInfos.length} >>`);
      fonts.forEach(fo => put(fo.num, `<< /Type /Font /Subtype /Type1 /BaseFont /${fo.base} /Encoding /WinAnsiEncoding >>`));

      pageInfos.forEach((info, idx) => {

          `<< /Type /Page /Parent ${pagesNum} 0 R /MediaBox [0 0 ${f(this.W)} ${f(this.H)}] ` +

        } else if (o.body.dict) {

          push(o.body.stream);

      let p = 0;
      chunks.forEach(c => { out.set(c, p); p += c.length; });

            if (o.fill) { ctx.fillStyle = COULEUR_CSS(o.fill); ctx.fillRect(o.x * E, o.y * E, o.w * E, o.h * E); }

              ctx.strokeStyle = COULEUR_CSS(o.stroke);
              ctx.lineWidth = Math.max(0.5, o.lw * E);
              ctx.strokeRect(o.x * E, o.y * E, o.w * E, o.h * E);
            }
          } else if (o.t === 'line') {
            ctx.strokeStyle = COULEUR_CSS(o.color);
            ctx.lineWidth = Math.max(0.5, o.lw * E);
            ctx.beginPath();
            ctx.moveTo(o.x1 * E, o.y1 * E);
            ctx.lineTo(o.x2 * E, o.y2 * E);
            ctx.stroke();
          } else if (o.t === 'text') {
            ctx.fillStyle = COULEUR_CSS(o.color);
            ctx.font = POLICE_CSS(o.font, o.size, E);
            /* La police de l'écran n'a pas forcément les mêmes largeurs que
               l'Helvetica du PDF : on comprime légèrement un texte trop long
               pour qu'il ne soit jamais coupé à l'affichage. */
            const dispo = (doc.W - (doc.margin || 34)) * E - o.x * E - 3;
            const largeur = ctx.measureText ? ctx.measureText(o.s).width : 0;
            let facteur = 1;
            if (largeur > 0 && o.w) {

                 l'Helvetica du PDF : on cale chaque texte sur la largeur prévue,
                 bornée pour rester dans la marge. Ainsi, l'écran montre
                 exactement la même mise en page que le fichier PDF. */
              facteur = Math.min(o.w * E / largeur, dispo / largeur);
              facteur = Math.max(0.55, Math.min(facteur, 1.15));

              ctx.save();
              ctx.translate(o.x * E, o.y * E);
              ctx.scale(facteur, facteur);
              ctx.fillText(o.s, 0, 0);
              ctx.restore();

            ctx.drawImage(o.img, o.x * E, o.y * E, o.w * E, o.h * E);

        return c;
      });

    trunc: trunc,
    wrap: wrap,
    dataUrlToBytes: dataUrlToBytes,
    jpegDims: jpegDims

<script>/* =========================================================================
   docx.js — Générateur de documents Word (.docx) sans dépendance

  function utf8(texte) {
    texte = String(texte);

      let c = texte.charCodeAt(i);
      if (c >= 0xD800 && c <= 0xDBFF && i + 1 < texte.length) {          // paire de substitution
        const d = texte.charCodeAt(i + 1);
        if (d >= 0xDC00 && d <= 0xDFFF) { c = 0x10000 + ((c - 0xD800) << 10) + (d - 0xDC00); i++; }
      }
      if (c < 0x80) octets.push(c);
      else if (c < 0x800) octets.push(0xC0 | (c >> 6), 0x80 | (c & 63));
      else if (c < 0x10000) octets.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
      else octets.push(0xF0 | (c >> 18), 0x80 | ((c >> 12) & 63), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));

    for (let n = 0; n < 256; n++) {

      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;

    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = TABLE_CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);

      const morceaux = Array.isArray(texte) ? texte : [{ t: texte }];
      morceaux.forEach(function (m) {
        if (typeof m === 'string') m = { t: m };
        const rpr = [];
        if (m.gras || opt.gras) rpr.push('<w:b/>');
        if (m.italique || opt.italique) rpr.push('<w:i/>');
        if (m.mono) rpr.push('<w:rFonts w:ascii="Consolas" w:hAnsi="Consolas"/>');
        const taille = m.taille || opt.taille;
        if (taille) rpr.push(`<w:sz w:val="${Math.round(taille * 2)}"/>`);
        const couleur = m.couleur || opt.couleur;
        if (couleur) rpr.push(`<w:color w:val="${couleur}"/>`);
        runs.push(`<w:r>${rpr.length ? '<w:rPr>' + rpr.join('') + '</w:rPr>' : ''}` +
          (m.saut ? '<w:br/>' : '') +
          `<w:t xml:space="preserve">${x(traduire(m.t || '', langue))}</w:t></w:r>`);
      });
      this.corps.push(`<w:p><w:pPr>${props.join('')}</w:pPr>${runs.join('')}</w:p>`);
      return this;
    }

    titre(texte, niveau) {
      const tailles = { 1: 20, 2: 14, 3: 11.5 };
      const couleurs = { 1: '0B3D91', 2: '0B3D91', 3: '334155' };
      niveau = niveau || 1;
      return this.para(texte, {
        gras: true, taille: tailles[niveau] || 12, couleur: couleurs[niveau] || '334155',
        avant: niveau === 1 ? 0 : 240, apres: 120
      });
    }

    /** Bandeau de section du modèle : fond cyan BFR, texte blanc en petites
        capitales (style « Titre 1 » du Google Doc de référence). */
    bandeau(texte, couleurFond, droit) {
      texte = traduire(texte, this.langue);
      droit = droit ? traduire(droit, this.langue) : droit;
      const fond = couleurFond || '06BAF2';
      this.corps.push('<w:p><w:pPr><w:keepNext/><w:spacing w:before="240" w:after="120"/>' +
        '<w:pBdr><w:top w:val="single" w:sz="4" w:color="' + fond + '"/>' +
        '<w:left w:val="single" w:sz="4" w:color="' + fond + '"/>' +
        '<w:bottom w:val="single" w:sz="4" w:color="' + fond + '"/>' +
        '<w:right w:val="single" w:sz="4" w:color="' + fond + '"/></w:pBdr>' +
        `<w:shd w:val="clear" w:fill="${fond}"/><w:jc w:val="left"/></w:pPr>` +
        `<w:r><w:rPr><w:b/><w:smallCaps/><w:color w:val="FFFFFF"/><w:sz w:val="26"/></w:rPr>` +
        `<w:t xml:space="preserve">${x(texte)}</w:t></w:r>` +
        (droit ? `<w:r><w:rPr><w:color w:val="FFFFFF"/><w:sz w:val="17"/></w:rPr>` +
          `<w:t xml:space="preserve">  ${x(droit)}</w:t></w:r>` : '') + '</w:p>');
      return this;
    }

    /** Titre du document, comme dans le modèle : cyan BFR, gras, centré. */
    grandTitre(texte, taille) {
      return this.para(texte, { gras: true, taille: taille || 30, couleur: '06BAF2', align: 'center', apres: 60 });
    }

    tableau(lignes, opt) {
      opt = opt || {};
      const langue = this.langue;
      const largeurs = opt.largeurs || null;      // en pourcentage (somme = 100)
      const bordures = opt.sansBordures
        ? '<w:tblBorders>' + ['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map(function (c) {
            return `<w:${c} w:val="none" w:sz="0" w:color="auto"/>`;
          }).join('') + '</w:tblBorders>'
        : '<w:tblBorders>' + ['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map(function (c) {
            return `<w:${c} w:val="single" w:sz="4" w:color="C9D4E2"/>`;
          }).join('') + '</w:tblBorders>';
      let xml = '<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/>' + bordures +
        '<w:tblLayout w:type="fixed"/></w:tblPr>';
      if (largeurs) {
        xml += '<w:tblGrid>' + largeurs.map(function (p) {
          return `<w:gridCol w:w="${Math.round(p * 90)}"/>`;
        }).join('') + '</w:tblGrid>';
      }
      lignes.forEach(function (ligne, iL) {
        xml += '<w:tr>';
        (Array.isArray(ligne) ? ligne : [ligne]).forEach(function (cellule, iC) {
          const c = (cellule && cellule.texte !== undefined) ? cellule : { texte: cellule };
          const rpr = [];
          if (c.gras || (iL === 0 && opt.enteteGras)) rpr.push('<w:b/>');
          if (c.couleur) rpr.push(`<w:color w:val="${c.couleur}"/>`);
          if (c.taille) rpr.push(`<w:sz w:val="${Math.round(c.taille * 2)}"/>`);
          /* Une cellule contient soit du texte (multi-lignes), soit des « runs »
             (tableau d'objets { t, gras, taille, couleur }) comme un paragraphe. */
          const paragraphes = Array.isArray(c.texte) ? [c.texte] : String(c.texte == null ? '' : c.texte).split('\n');
          const contenu = paragraphes.map(function (p) {
            const morceaux = Array.isArray(p) ? p : [{ t: p }];
            const runsCellule = morceaux.map(function (m) {
              if (typeof m === 'string') m = { t: m };
              const r2 = rpr.slice();
              if (m.gras) r2.push('<w:b/>');
              if (m.italique) r2.push('<w:i/>');
              if (m.taille) r2.push(`<w:sz w:val="${Math.round(m.taille * 2)}"/>`);
              if (m.couleur) r2.push(`<w:color w:val="${m.couleur}"/>`);
              return `<w:r>${r2.length ? '<w:rPr>' + r2.join('') + '</w:rPr>' : ''}` +
                (m.saut ? '<w:br/>' : '') + `<w:t xml:space="preserve">${x(traduire(m.t || '', langue))}</w:t></w:r>`;
            }).join('');
            return `<w:p><w:pPr><w:spacing w:before="20" w:after="20"/>${c.align && c.align !== 'left' ? `<w:jc w:val="${c.align}"/>` : ''}</w:pPr>${runsCellule}</w:p>`;
          }).join('');
          const fond = (c.fond || (iL === 0 && opt.enteteFond)) ? `<w:shd w:val="clear" w:fill="${c.fond || opt.enteteFond}"/>` : '';
          xml += `<w:tc><w:tcPr>${largeurs ? `<w:tcW w:w="${Math.round(largeurs[iC] * 90)}" w:type="dxa"/>` : ''}<w:vAlign w:val="center"/>${fond}</w:tcPr>${contenu}</w:tc>`;
        });
        xml += '</w:tr>';
      });
      xml += '</w:tbl>';
      this.corps.push(xml);
      // petit espace après le tableau
      this.para('', { taille: 4, apres: 0 });
      return this;
    }

    /** XML du dessin (image en ligne) — réutilisé par le corps et l'en-tête. */
    dessin(im, cx, cy, nom, idDessin, rid) {
      return '<w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">' +
        `<wp:extent cx="${cx}" cy="${cy}"/>` +
        `<wp:docPr id="${idDessin}" name="Image ${idDessin}"/>` +
        '<a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">' +
        '<pic:pic><pic:nvPicPr>' +
        `<pic:cNvPr id="${idDessin}" name="${nom}"/><pic:cNvPicPr/></pic:nvPicPr>` +
        `<pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>` +
        `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm>` +
        '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>' +
        '</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing>';
    }

    /** Enregistre une image (JPEG ou PNG) et renvoie sa fiche, sans la placer. */
    ajouterImage(dataUrl) {
      const estPng = /^data:image\/png/i.test(dataUrl);
      const ext = estPng ? 'png' : 'jpg';
      const donnees = dataUrlToBytes(dataUrl);
      const dims = estPng ? dimsPng(donnees) : dimsJpeg(donnees);
      const rid = 'rId' + (this.ridSuivant++);
      const nom = 'image' + this.images.length + '.' + ext;
      const im = { rid: rid, nom: nom, donnees: donnees, ext: ext, cible: 'media/' + nom,
                   w: dims.w, h: dims.h, ratio: dims.h / dims.w, idDessin: this.idDessin++, place: false };
      this.images.push(im);
      return im;
    }

    /** Ajoute une image (JPEG ou PNG en dataURL) centrée, largeur max en cm. */
    image(dataUrl, largeurCm, opt) {
      opt = opt || {};
      const im = this.ajouterImage(dataUrl);
      im.place = true;

      const maxCm = largeurCm || 15;
      let cm = maxCm;
      let cmH = cm * im.ratio;
      const maxH = opt.hauteurMaxCm || 11;
      if (cmH > maxH) { cmH = maxH; cm = cmH / im.ratio; }

      this.corps.push(`<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:before="40" w:after="${opt.legende ? 0 : 120}"/></w:pPr>` +
        '<w:r>' + this.dessin(im, Math.round(cm * CM), Math.round(cmH * CM), im.nom, im.idDessin, im.rid) + '</w:r></w:p>');
      if (opt.legende) this.para(opt.legende, { taille: 8.5, couleur: '64748B', align: 'center', apres: 160, italique: true });
      return this;
    }

    /** Logo en haut de page, hors du flux (l'en-tête se répète à chaque page). */
    logoEntete(dataUrl) { this.entete = dataUrl; return this; }

    sautDePage() {
      this.corps.push('<w:p><w:r><w:br w:type="page"/></w:r></w:p>');
      return this;
    }

    /* --- styles du document (police du modèle) --- */
    stylesXml() {
      return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
        '<w:docDefaults><w:rPrDefault><w:rPr>' +
        '<w:rFonts w:ascii="Open Sans" w:hAnsi="Open Sans" w:cs="Open Sans" w:eastAsia="Open Sans"/>' +
        '<w:sz w:val="22"/><w:szCs w:val="22"/>' +
        '</w:rPr></w:rPrDefault><w:pPrDefault><w:pPr>' +
        '<w:spacing w:after="100" w:line="259" w:lineRule="auto"/>' +
        '</w:pPr></w:pPrDefault></w:docDefaults>' +
        '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/>' +
        '<w:qFormat/></w:style>' +
        '<w:style w:type="paragraph" w:styleId="Bandeau"><w:name w:val="Bandeau"/>' +
        '<w:basedOn w:val="Normal"/><w:pPr><w:keepNext/></w:pPr>' +
        '<w:rPr><w:b/><w:smallCaps/><w:color w:val="FFFFFF"/><w:sz w:val="26"/></w:rPr></w:style>' +
        '</w:styles>';
    }

    /* --- en-tête et pied de page (comme le modèle) --- */
    enteteXml() {
      if (!this.entete && !this.enteteImage) return null;
      const im = this.enteteImage;
      if (!im) return null;
      return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<w:hdr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" ' +
        'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ' +
        'xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" ' +
        'xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" ' +
        'xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">' +
        '<w:p><w:pPr><w:spacing w:after="0"/></w:pPr>' +
        '<w:r>' + this.dessin(im, Math.round(this.enteteLargeurCm * 360000), Math.round(this.enteteLargeurCm * im.ratio * 360000), im.nom, im.idDessin, im.rid) + '</w:r>' +
        '</w:p></w:hdr>';
    }

    piedXml() {
      const lignes = (this.pied || []).filter(Boolean);
      if (!lignes.length && this.numeroPage === false) return null;
      const paragraphes = lignes.map((l, i) => '<w:p><w:pPr><w:spacing w:before="0" w:after="' + (i === lignes.length - 1 ? 0 : 20) + '"/><w:jc w:val="center"/></w:pPr>' +
        `<w:r><w:rPr><w:color w:val="808080"/><w:sz w:val="16"/></w:rPr><w:t xml:space="preserve">${x(l)}</w:t></w:r></w:p>`).join('');
      const pageNum = this.numeroPage
        ? '<w:p><w:pPr><w:spacing w:before="40" w:after="0"/><w:jc w:val="center"/></w:pPr><w:r><w:rPr><w:color w:val="808080"/><w:sz w:val="16"/></w:rPr>' +
          '<w:t xml:space="preserve">Page </w:t></w:r>' +
          '<w:fldSimple w:instr=" PAGE "><w:r><w:rPr><w:color w:val="808080"/><w:sz w:val="16"/></w:rPr><w:t>1</w:t></w:r></w:fldSimple>' +
          '<w:r><w:rPr><w:color w:val="808080"/><w:sz w:val="16"/></w:rPr><w:t xml:space="preserve"> / </w:t></w:r>' +
          '<w:fldSimple w:instr=" NUMPAGES "><w:r><w:rPr><w:color w:val="808080"/><w:sz w:val="16"/></w:rPr><w:t>1</w:t></w:r></w:fldSimple>' +
          '</w:p>'
        : '';
      return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<w:ftr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
        paragraphes + pageNum + '</w:ftr>';
    }

    /* --- sérialisation --- */
    build() {
      const NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" ' +
        'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ' +
        'xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" ' +
        'xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" ' +
        'xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"';

      /* En-tête : le logo du modèle est enregistré comme une image à part. */
      if (this.entete && !this.enteteImage) {
        this.enteteImage = this.ajouterImage(this.entete);
        this.enteteImage.entete = true;
      }
      const hdr = this.enteteImage ? this.enteteXml() : null;
      const ftr = this.piedXml();

      const refs = [];
      if (hdr) refs.push('<w:headerReference w:type="default" r:id="rIdHdr"/>');
      if (ftr) refs.push('<w:footerReference w:type="default" r:id="rIdFtr"/>');

      const document = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        `<w:document ${NS}><w:body>${this.corps.join('')}` +
        '<w:sectPr>' + refs.join('') +
        '<w:pgSz w:w="11906" w:h="16838"/>' +
        '<w:pgMar w:top="1418" w:right="1077" w:bottom="1418" w:left="1077" w:header="709" w:footer="113" w:gutter="0"/>' +
        '</w:sectPr></w:body></w:document>';

      const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        (hdr ? '<Relationship Id="rIdHdr" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/header" Target="header1.xml"/>' : '') +
        (ftr ? '<Relationship Id="rIdFtr" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>' : '') +
        this.images.filter(function (im) { return im.place || im.entete; }).map(function (im) {
          return `<Relationship Id="${im.rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="${im.cible}"/>`;
        }).join('') + '</Relationships>';

      /* Relations de l'en-tête : l'image du logo y est rattachée. */
      const relsEntete = hdr ? '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        `<Relationship Id="${this.enteteImage.rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="${this.enteteImage.cible}"/>` +
        '</Relationships>' : null;

      const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Default Extension="jpg" ContentType="image/jpeg"/>' +
        '<Default Extension="png" ContentType="image/png"/>' +
        '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
        '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
        (hdr ? '<Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/>' : '') +
        (ftr ? '<Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/>' : '') +
        '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>' +
        '<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>' +
        '</Types>';

      const racines = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
        '<Relationship Id="rId4" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="word/styles.xml"/>' +
        '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>' +
        '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>' +
        '</Relationships>';

      const date = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
      const core = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" ' +
        'xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" ' +
        'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
        `<dc:title>${x(this.titreDoc || 'Rapport')}</dc:title>` +
        `<dc:creator>${x(this.demande.replace(/[()]/g, ''))}</dc:creator>` +
        `<cp:lastModifiedBy>${x(this.demande.replace(/[()]/g, ''))}</cp:lastModifiedBy>` +
        `<dcterms:created xsi:type="dcterms:W3CDTF">${date}</dcterms:created>` +
        `<dcterms:modified xsi:type="dcterms:W3CDTF">${date}</dcterms:modified>` +
        '</cp:coreProperties>';

      const app = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" ' +
        'xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes">' +
        '<Application>Application SAV</Application></Properties>';

        const fichiers = [
        { nom: '[Content_Types].xml', donnees: utf8(contentTypes) },
        { nom: '_rels/.rels', donnees: utf8(racines) },
        { nom: 'docProps/core.xml', donnees: utf8(core) },
        { nom: 'docProps/app.xml', donnees: utf8(app) },
        { nom: 'word/document.xml', donnees: utf8(document) },
        { nom: 'word/_rels/document.xml.rels', donnees: utf8(rels) },
        { nom: 'word/styles.xml', donnees: utf8(this.stylesXml()) }
      ];
      if (hdr) {
        fichiers.push({ nom: 'word/header1.xml', donnees: utf8(hdr) });
        fichiers.push({ nom: 'word/_rels/header1.xml.rels', donnees: utf8(relsEntete) });
      }
      if (ftr) fichiers.push({ nom: 'word/footer1.xml', donnees: utf8(ftr) });
      this.images.forEach(function (im) {
        fichiers.push({ nom: 'word/media/' + im.nom, donnees: im.donnees });
      });
      return zip(fichiers);
    }

    blob() {
      return new Blob([this.build()], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
    }
  }

  /* --- Lecture des dimensions ---------------------------------------- */
  function dimsJpeg(b) {
    let i = 2;
    while (i < b.length) {
      if (b[i] !== 0xFF) { i++; continue; }
      const m = b[i + 1];
      if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC) {
        return { h: (b[i + 5] << 8) | b[i + 6], w: (b[i + 7] << 8) | b[i + 8] };
      }
      i += 2 + ((b[i + 2] << 8) | b[i + 3]);
    }
    return { w: 1000, h: 750 };
  }
  function dimsPng(b) {
    return { w: (b[16] << 24) | (b[17] << 16) | (b[18] << 8) | b[19], h: (b[20] << 24) | (b[21] << 16) | (b[22] << 8) | b[23] };
  }

  global.Docx = { Doc: DocWord, dataUrlToBytes: dataUrlToBytes, crc32: crc32, dimsJpeg: dimsJpeg, dimsPng: dimsPng, utf8: utf8 };
})(window);
</script>
<script>/* =========================================================================
   report.js — Génération du rapport selon un canevas (PDF + Word)
   Le canevas décrit l'ordre et le contenu des sections. Par défaut :
     1. Synthèse          4. Priorité basse
     2. Sécurité & urgences 5. Informations
     3. Priorité haute    6. Travaux réalisés / à prévoir
                          7. Photos complémentaires  8. Validation client
   Dépend de : pdf.js (window.Pdf) et docx.js (window.Docx)
   ========================================================================= */
(function (global) {
  'use strict';

  const M = { margin: 34 };

  /* Couleurs du modèle « Compte rendu d'intervention » BFR :
     cyan #06BAF2 (titre et bandeaux), texte gris anthracite #58595B. */
  const CYAN = [6 / 255, 186 / 255, 242 / 255];
  const COULEURS_PDF = {
    cyan: CYAN, cyanClair: [0.906, 0.969, 0.988],
    bleu: CYAN, bleuClair: [0.906, 0.969, 0.988],
    bandeau: [0.96, 0.98, 1], bord: [0.84, 0.87, 0.91], bordFort: [0.55, 0.6, 0.66],
    texte: [0.345, 0.349, 0.365], gris: [0.5, 0.5, 0.5], blanc: [1, 1, 1]
  };

  /* Adresses du pied de page du modèle. */
  const SIEGES_BFR = [
    'Siège social et site de production n°1 – 1, rue du Jariel, ZAC Les Longs Sillons, 77120 Coulommiers, France',
    'Site de production n°2 – 50 allée des érables, 01150 Blyes, France'
  ];

  /* ===================== Outils ======================================= */
  function hexRgb(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ''));
    if (!m) return [0.2, 0.25, 0.33];
    const n = parseInt(m[1], 16);
    return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
  }
  function hexDocx(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || ''));
    return m ? m[1].toUpperCase() : '334155';
  }
  function hexClair(hex, melange) {
    const [r, g, b] = hexRgb(hex);
    const k = melange == null ? 0.86 : melange;
    return [r + (1 - r) * k, g + (1 - g) * k, b + (1 - b) * k];
  }
  function slug(s) {
    return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 34) || 'client';
  }
  function frDate(iso) {
    if (!iso) return '';
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso));
    return m ? m[3] + '/' + m[2] + '/' + m[1] : String(iso);
  }
  function heureFr(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function valeur(v) { return (v === undefined || v === null || String(v).trim() === '') ? '' : String(v); }

  /* Identité du technicien : « Prénom NOM » à partir des champs des réglages.
     Si le technicien n'a rempli qu'un seul champ (ancienne saisie « nom et prénom »),
     on l'affiche tel quel plutôt que de le déformer. */
  function nomComplet(t) {
    t = t || {};
    const prenom = valeur(t.prenom).trim(), nom = valeur(t.nom).trim();
    if (prenom && nom) return prenom + ' ' + nom.toUpperCase();
    return (prenom || nom).trim();
  }
  /* Coordonnées du technicien, prêtes à être imprimées : « 06 12 34 56 78 · j@ex.fr » */
  function contactTech(t) {
    t = t || {};
    return [valeur(t.tel).trim(), valeur(t.email).trim()].filter(Boolean).join(' · ');
  }
  /* Nom du technicien tel qu'il doit apparaître dans un rapport : le nom saisi dans
     l'intervention, sinon celui mémorisé dans les réglages (identité du collègue). */
  function nomTechnicien(i, s) {
    return valeur(i && i.technicien).trim() || nomComplet(s && s.technicien);
  }

  /** Durée cumulée du chrono (pauses déduites), en millisecondes. */
  function dureeMs(chrono, maintenant) {
    if (!chrono || !chrono.debut) return 0;
    const ref = maintenant || Date.now();
    const fin = chrono.fin ? new Date(chrono.fin).getTime() : ref;
    let total = Math.max(0, fin - new Date(chrono.debut).getTime());
    (chrono.pauses || []).forEach(function (p) {
      const debutP = new Date(p.d).getTime();
      const finP = p.f ? new Date(p.f).getTime() : ref;
      total -= Math.max(0, Math.min(finP, ref) - debutP);
    });
    return Math.max(0, total);
  }
  function formatDuree(ms) {
    const min = Math.round(ms / 60000);
    if (!min) return '';
    const h = Math.floor(min / 60), m = min % 60;
    return (h ? h + ' h ' + ('0' + m).slice(-2) : m + ' min');
  }
  function dureeDecimale(ms) { return (Math.round(ms / 36000) / 100).toFixed(2).replace('.', ','); }

  function toJpeg(dataUrl, maxW, q) {
    return new Promise(function (resolve) {
      if (!dataUrl) return resolve(null);
      const img = new Image();
      img.onload = function () {
        const scale = Math.min(1, (maxW || 1200) / img.width);
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * scale));
        c.height = Math.max(1, Math.round(img.height * scale));
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve({ dataUrl: c.toDataURL('image/jpeg', q || 0.85), w: c.width, h: c.height });
      };
      img.onerror = function () { resolve(null); };
      img.src = dataUrl;
    });
  }

  /* ===================== Canevas par défaut =========================== */
  function canevasDefaut() {
    return {
      nom: 'Canevas standard',
      sections: [
        { id: 'synthese', type: 'synthese', titre: '1. Synthèse de l\'intervention' },
        { id: 'secu', type: 'evenements', titre: '2. Sécurité et urgences', categories: ['SECURITE', 'URGENT'] },
        { id: 'haute', type: 'evenements', titre: '3. Points de priorité haute', categories: ['HAUTE'] },
        { id: 'basse', type: 'evenements', titre: '4. Points de priorité basse', categories: ['BASSE'] },
        { id: 'info', type: 'evenements', titre: '5. Informations complémentaires', categories: ['INFO'] },
        { id: 'actions', type: 'texte', titre: '6. Travaux réalisés', champ: 'actions' },
        { id: 'prevoir', type: 'texte', titre: '7. Travaux à prévoir', champ: 'aPrevoir' },
        { id: 'photos', type: 'photos', titre: '8. Photos complémentaires' },
        { id: 'signature', type: 'signature', titre: '9. Validation' }
      ]
    };
  }

  /* ===================== Données dérivées ============================= */
  function catalogue(reglages) {
    const S = reglages || {};
    const domaines = {};
    (S.domaines || []).forEach(d => { domaines[d.id] = d; });
    const categories = {};
    (S.categories || []).forEach(c => { categories[c.id] = c; });
    return { domaines: domaines, categories: categories };
  }

  function etat(intervention, reglages) {
    const { domaines, categories } = catalogue(reglages);
    const evs = (intervention.evenements || []).filter(e => e.domaine || valeur(e.texte));
    const parCategorie = {}, parDomaine = {};
    (reglages.categories || []).forEach(c => { parCategorie[c.id] = 0; });
    (reglages.domaines || []).forEach(d => { parDomaine[d.id] = 0; });
    evs.forEach(function (e) {
      parCategorie[e.categorie || 'INFO'] = (parCategorie[e.categorie || 'INFO'] || 0) + 1;
      parDomaine[e.domaine] = (parDomaine[e.domaine] || 0) + 1;
    });
    const duree = dureeMs(intervention.chrono);
    const nbPhotos = evs.reduce(function (a, e) { return a + (e.photos || []).length; }, 0) +
      (intervention.photosLibres || []).length;
    return {
      domaines: domaines, categories: categories, evenements: evs, parCategorie: parCategorie,
      parDomaine: parDomaine, duree: duree, nbPhotos: nbPhotos,
      securite: (parCategorie.SECURITE || 0) + (parCategorie.URGENT || 0)
    };
  }

  function evenementsDe(intervention, section) {
    const cats = section.categories || [];
    return (intervention.evenements || [])
      .filter(e => (e.domaine || valeur(e.texte)) && cats.indexOf(e.categorie || 'INFO') >= 0)
      .sort((a, b) => new Date(a.heure || 0) - new Date(b.heure || 0));
  }

  /* ======================================================================
     PDF
     ====================================================================== */
  class RapportPDF {
    constructor(intervention, reglages, opts) {
      this.i = intervention;
      this.s = reglages || {};
      this.opts = opts || {};
      /* Langue du rapport : 'fr' (défaut) ou le code de la langue du client.
         Les libellés du modèle sont traduits par langues.js, à l'écriture. */
      this.langue = this.opts.langue || (intervention.langue && intervention.langue.code) || 'fr';
      this.canevas = (this.s.canevas && this.s.canevas.sections) ? this.s.canevas.sections : canevasDefaut().sections;
      this.etat = etat(intervention, reglages);
      /* Aperçu à l'écran : même mise en page, dessinée sur des canvas
         (aucune visionneuse PDF n'est nécessaire dans le navigateur). */
      this.pdf = this.opts.apercu
        ? new Pdf.Apercu({ margin: M.margin, langue: this.langue })
        : new Pdf.Doc({ margin: M.margin, langue: this.langue });
      this.M = this.pdf.margin;
      this.W = this.pdf.W;
      this.H = this.pdf.H;
      this.CW = this.pdf.contentWidth;
      this.C = COULEURS_PDF;
      this.numeroPhoto = 0;
    }

    /* Traduction d'un libellé du catalogue (domaines, catégories) : ce sont
       des libellés, pas des données du terrain. */
    L(txt) {
      return (global.I18N ? global.I18N.traduire(txt, this.langue) : txt);
    }

    /* --- structure de page (modèle « Compte rendu d'intervention ») --- */

    /* Logo de la société, en haut de page, comme dans l'en-tête du modèle. */
    logoEnTete(largeurCm) {
      const p = this.pdf;
      if (!this.logo) return 0;
      const w = (largeurCm || 10.2) * 28.35;                 // cm -> points
      const h = w * (this.logo.h / this.logo.w);
      p.image(this.logo.bytes, this.M, p.y, w, h);
      p.y += h + 14;
      return h;
    }

    /* Première page : logo, bloc client, titre, bloc « Votre contact ». */
    entetePrincipale() {
      const p = this.pdf, i = this.i, s = this.s;

      if (this.logo) {
        const w = 10.2 * 28.35;
        const h = w * (this.logo.h / this.logo.w);
        p.image(this.logo.bytes, this.M, p.y, w, h);
        p.y += h + 22;
      }

      /* Bloc client : nom, e-mail, téléphone (colonne gauche) et logo (droite),
         exactement les variables {Client_Name} {Mail_Client} {numero_client} {Logo_Client}. */
      const cli = i.client || {};
      const logoCli = this.logoClient;
      const haut = p.y;
      const largLogo = logoCli ? Math.min(150, 90 * (logoCli.w / logoCli.h)) : 0;
      const largGauche = this.CW - (largLogo ? largLogo + 16 : 0);
      let y = haut;
      if (valeur(cli.nom)) { p.text(Pdf.trunc(cli.nom, largGauche, 12, true), this.M, y + 10, { size: 12, font: 'F2', color: this.C.texte }); y += 17; }
      if (valeur(cli.email)) { p.text(Pdf.trunc(cli.email, largGauche, 10), this.M, y + 9, { size: 10, color: this.C.texte }); y += 14; }
      if (valeur(cli.tel)) { p.text(Pdf.trunc('Tél. ' + cli.tel, largGauche, 12), this.M, y + 11, { size: 12, color: this.C.texte }); y += 16; }
      if (logoCli) {
        const h = largLogo * (logoCli.h / logoCli.w);
        p.image(logoCli.bytes, this.W - this.M - largLogo, haut, largLogo, Math.min(h, 62));
        y = Math.max(y, haut + Math.min(h, 62));
      }
      p.y = y + 26;

      /* Titre du modèle : « Compte rendu d'intervention » puis la date, centrés
         en cyan BFR, comme le style « Titre » du Google Doc (36 pt). */
      const titre = "Compte rendu d'intervention";
      let taille = 30;
      while (taille > 16 && Pdf.measure(titre, taille, true) > this.CW) taille -= 1;
      p.text(titre, this.W / 2, p.y + taille, { size: taille, font: 'F2', color: CYAN, align: 'center' });
      p.y += taille + 8;
      p.text(frDate(i.date), this.W / 2, p.y + taille * 0.72, { size: taille * 0.72, font: 'F2', color: CYAN, align: 'center' });
      p.y += taille * 0.72 + 40;

      /* « Votre contact : » puis le bloc technicien
         ({Name_Technicien} {Poste_Tech} {Mail_Tech} {Num_Tech}). */
      const t = s.technicien || {};
      p.text('Votre contact :', this.M, p.y + 10, { size: 10, color: this.C.texte });
      p.y += 20;
      const yBloc = p.y;
      p.text(nomComplet(t) || '—', this.M, yBloc + 11, { size: 11.5, font: 'F2', color: this.C.texte });
      let yt = yBloc + 25;
      const self = this;
      [t.fonction, t.email, t.tel ? 'Tél. ' + t.tel : ''].filter(Boolean).forEach(function (l) {
        p.text(Pdf.trunc(String(l), self.CW, 10), self.M, yt, { size: 10, color: self.C.texte });
        yt += 14;
      });
      p.y = yt + 20;
    }

    /* Pages suivantes : logo réduit et rappel du rapport. */
    enteteSuite() {
      const p = this.pdf, C = this.C;
      if (this.logo) {
        const w = 5.4 * 28.35;
        const h = w * (this.logo.h / this.logo.w);
        p.image(this.logo.bytes, this.M, p.y, w, h);
        p.text(Pdf.trunc('N° ' + valeur(this.i.numero) + ' — ' + valeur(this.i.client && this.i.client.nom), this.CW * 0.65, 9),
          this.W - this.M, p.y + h - 3, { size: 9, color: C.gris, align: 'right' });
        p.y += h + 8;
      } else {
        p.text(Pdf.trunc(valeur(this.s.societe.nom), this.CW / 3, 9.5, true), this.M, 26, { size: 9.5, font: 'F2', color: C.cyan });
        p.text(Pdf.trunc('N° ' + valeur(this.i.numero) + ' — ' + valeur(this.i.client && this.i.client.nom), this.CW * 0.62, 9),
          this.W - this.M, 26, { size: 9, color: C.gris, align: 'right' });
        p.y = 34;
      }
      p.line(this.M, p.y, this.W - this.M, p.y, { color: C.bord });
      p.y += 16;
    }

    /* Page 2 du modèle : destinataire, adresse, lieu et date, attention. */
    pageLettre() {
      const p = this.pdf, C = this.C, i = this.i, s = this.s, cli = i.client || {};
      const larg = this.CW * 0.62;
      p.text(Pdf.trunc(valeur(cli.nom), larg, 11.5, true), this.M, p.y + 11, { size: 11.5, font: 'F2', color: C.texte });
      p.y += 22;
      Pdf.wrap(valeur(cli.adresse) || valeur(cli.lieu), larg, 10).forEach(function (l) {
        p.text(l, this.M, p.y + 10, { size: 10, color: C.texte });
        p.y += 14;
      }, this);
      p.y += 18;
      p.text('À ' + valeur((s.societe && s.societe.lieuLettre) || 'Blyes') + ', le ' + frDate(i.date) + ',',
        this.M, p.y + 10, { size: 10, color: C.texte });
      p.y += 22;
      p.text("À l'attention de " + valeur(cli.contact) + ',', this.M, p.y + 10, { size: 10, color: C.texte });
      p.y += 26;
    }

    /* ---------- bandeaux, blocs et tableaux ---------- */

    saut(hauteur) {
      const p = this.pdf;
      if (p.y + (hauteur || 0) > p.H - this.M - 30) { p.newPage(); this.enteteSuite(); return true; }
      return false;
    }

    /* Bandeau de section du modèle : fond cyan, texte blanc (petites capitales). */
    titre(txt, sousTitre, reserver) {
      this.saut(40 + (reserver || 0));
      const p = this.pdf, y = p.y, C = this.C;
      let taille = 11.5;
      const large = this.CW - 14 - (sousTitre ? Pdf.measure(sousTitre, 8, false) + 12 : 0);
      while (taille > 7.5 && Pdf.measure(txt, taille, true) > large) taille -= 0.5;
      p.rect(this.M, y, this.CW, 18.5, { fill: CYAN });
      p.text(txt.toUpperCase(), this.M + 7, y + 12.5, { size: taille, font: 'F2', color: C.blanc });
      if (sousTitre) p.text(sousTitre, this.W - this.M - 7, y + 12.5, { size: 8, color: C.blanc, align: 'right' });
      p.y = y + 24;
    }

    kv(pairs) {
      /* Les lignes sans étiquette (compteur, n° de parc…) ne sont pas imprimées. */
      pairs = (pairs || []).filter(function (it) { return it[0] && valeur(it[1]); });
      const p = this.pdf, C = this.C, gap = 10, colW = (this.CW - gap) / 2;
      let k = 0;
      while (k < pairs.length) {
        const ligne = [];
        while (k < pairs.length && ligne.length < 2) {
          if (pairs[k][2] && ligne.length === 1) break;
          ligne.push(pairs[k]); k++;
        }
        const largeurs = ligne.length === 2 ? [colW, colW] : [ligne[0][2] ? this.CW : colW];
        let h = 0;
        ligne.forEach(function (it, idx) {
          h = Math.max(h, 11 + Pdf.wrap(valeur(it[1]) || '—', largeurs[idx] - 14, 8.6).length * 11);
        });
        this.saut(h + 2);
        const y = p.y;
        let x = this.M;
        for (let idx = 0; idx < ligne.length; idx++) {
          p.rect(x, y, largeurs[idx], h, { fill: C.bandeau, stroke: C.bord, lineWidth: 0.5 });
          p.text(ligne[idx][0], x + 7, y + 11, { size: 6.6, font: 'F2', color: C.gris });
          p.paragraph(valeur(ligne[idx][1]) || '—', x + 7, y + 12, largeurs[idx] - 14, { size: 8.6, color: C.texte });
          x += largeurs[idx] + gap;
        }
        p.y = y + h + 1;
      }
      p.y += 6;
    }

    blocTexte(titre, contenu) {
      const p = this.pdf, C = this.C;
      const texte = valeur(contenu);
      const lh = 11.4;
      const lignes = Pdf.wrap(texte || '—', this.CW - 14, 8.8);
      let idx = 0;
      while (idx < lignes.length) {
        const place = Math.floor((p.H - this.M - 16 - p.y - (idx === 0 && titre ? 16 : 4)) / lh);
        if (place < 3) { p.newPage(); this.enteteSuite(); continue; }
        const n = Math.min(place, lignes.length - idx);
        if (idx === 0 && titre) {
          p.text(titre, this.M + 6, p.y + 9, { size: 8.4, font: 'F2', color: C.gris });
          p.y += 13;
        }
        p.rect(this.M, p.y, this.CW, n * lh + 7, { stroke: C.bord, lineWidth: 0.6 });
        for (let j = 0; j < n; j++) p.text(lignes[idx + j], this.M + 7, p.y + 9 + j * lh, { size: 8.8, color: C.texte });
        p.y += n * lh + 9;
        idx += n;
      }
      p.y += 4;
    }

    /** Photos côte à côte, légende optionnelle. Numérotation continue dans le rapport. */
    async photos(liste, avecNumero) {
      const p = this.pdf, C = this.C;
      const gap = 8;
      const colW = (this.CW - gap) / 2;
      let i = 0;
      for (const item of liste) {
        if (i % 2 === 0) this.lotEnCours = [];
        this.lotEnCours.push(item);
        if (this.lotEnCours.length === 2 || i === liste.length - 1) {
          const lot = this.lotEnCours;
          const dims = lot.map(function (it) {
            const b = Pdf.dataUrlToBytes(it.dataUrl);
            return Pdf.jpegDims(b);
          });
          const hauteurs = dims.map(function (d) { return Math.min(colW * 1.2, colW * (d.h / d.w)); });
          const hMax = Math.max.apply(null, hauteurs.concat([60]));
          const legende = avecNumero || lot.some(it => valeur(it.legende));
          this.saut(hMax + (legende ? 12 : 0) + 10);
          const y = p.y;
          const self = this;
          lot.forEach(function (it, k) {
            const hauteur = hauteurs[k];
            const x = M.margin + k * (colW + gap);
            p.rect(x, y, colW, hauteur, { stroke: C.bord, lineWidth: 0.5 });
            p.image(Pdf.dataUrlToBytes(it.dataUrl), x + 1, y + 1, colW - 2, hauteur - 2);
            if (legende) {
              const texte = avecNumero ? 'Photo ' + (++self.numeroPhoto) + (it.legende ? ' — ' + it.legende : '') : (it.legende || '');
              p.text(Pdf.trunc(texte, colW, 7.2), x, y + hauteur + 9, { size: 7.2, color: C.gris });
            }
          });
          p.y = y + hMax + (legende ? 12 : 0) + 10;
        }
        i++;
      }
    }

    /** Un évènement : bandeau coloré (catégorie + domaine + heure), texte, photos. */
    async blocEvenement(ev, index) {
      const { domaines, categories } = this.etat;
      const cat = categories[ev.categorie || 'INFO'] || { libelle: 'Informatif', couleur: '#475569' };
      const dom = domaines[ev.domaine] || { libelle: '—', icone: '' };
      const p = this.pdf, C = this.C;
      const couleur = hexRgb(cat.couleur);
      const fond = hexClair(cat.couleur, 0.9);
      const texte = valeur(ev.texte) || '(aucune annotation)';
      const lh = 11.2;
      const lignes = Pdf.wrap(texte, this.CW - 16, 8.8);
      // on réserve la place du texte + de la première photo pour ne pas les séparer
      const photosEv = (ev.photos || []).filter(ph => ph.dataUrl);
      const placeTexte = Math.min(lignes.length, 6) * lh + 24;
      const placePhoto = photosEv.length ? (this.CW - 8) / 2 * 0.9 + 30 : 0;
      this.saut(placeTexte + Math.min(placePhoto, 240));
      let idx = 0;
      let premier = true;
      while (idx < lignes.length) {
        const place = Math.floor((p.H - this.M - 16 - p.y - 26) / lh);
        if (place < 2) { p.newPage(); this.enteteSuite(); continue; }
        const n = Math.min(place, lignes.length - idx);
        const y0 = p.y;
        if (premier) {
          this.saut(26 + 2 * lh);
          p.rect(this.M, p.y, this.CW, 15, { fill: fond, stroke: couleur, lineWidth: 0.5 });
          p.rect(this.M, p.y, 3, 15, { fill: couleur });
          const libDom = this.L(dom.libelle);
          p.text(dom.icone ? dom.icone + ' ' + libDom : libDom, this.M + 8, p.y + 10.4, { size: 8.4, font: 'F2', color: couleur });
          p.text(this.L(cat.libelle).toUpperCase(), this.M + this.CW - 8, p.y + 10.4, { size: 8, font: 'F2', color: couleur, align: 'right' });
          p.text(heureFr(ev.heure), this.M + this.CW / 2, p.y + 10.4, { size: 7.6, color: C.gris, align: 'center' });
          p.y += 15;
        }
        p.rect(this.M, p.y, this.CW, n * lh + 6, { stroke: C.bord, lineWidth: 0.5 });
        for (let j = 0; j < n; j++) p.text(lignes[idx + j], this.M + 8, p.y + 9 + j * lh, { size: 8.8, color: C.texte });
        p.y += n * lh + 8;
        idx += n;
        premier = false;
        if (y0 === p.y) break;
      }
      if (photosEv.length) {
        await this.photos(photosEv.map(ph => ({ dataUrl: ph.dataUrl, legende: ph.legende || '' })), true);
      }
      p.y += 2;
    }

    async blocSynthese() {
      const p = this.pdf, C = this.C, i = this.i, e = this.etat;
      // bandeau de compteurs par catégorie
      const cats = (this.s.categories || []).filter(c => e.parCategorie[c.id]);
      if (cats.length) {
        const nb = cats.length;
        const caseW = (this.CW - (nb - 1) * 5) / nb;
        this.saut(30);
        const y = p.y;
        cats.forEach(function (c, k) {
          const x = this.M + k * (caseW + 5);
          p.rect(x, y, caseW, 30, { fill: hexClair(c.couleur, 0.88), stroke: hexRgb(c.couleur), lineWidth: 0.5 });
          p.text(String(e.parCategorie[c.id]), x + caseW / 2, y + 15, { size: 15, font: 'F2', color: hexRgb(c.couleur), align: 'center' });
          p.text(Pdf.trunc(this.L(c.libelle), caseW - 6, 6.6), x + caseW / 2, y + 25, { size: 6.6, color: C.gris, align: 'center' });
        }, this);
        p.y = y + 38;
      }
      // répartition par domaine + chrono
      const domaines = (this.s.domaines || []).filter(d => e.parDomaine[d.id]);
      const lignes = [];
      domaines.forEach(function (d) {
        lignes.push([d.libelle, String(e.parDomaine[d.id]) + ' évènement(s)']);
      });
      lignes.push(['Heures passées sur site', formatDuree(e.duree) ? formatDuree(e.duree) + ' (' + dureeDecimale(e.duree) + ' h)' : '—']);
      lignes.push(['Photos jointes', String(e.nbPhotos)]);
      lignes.push(['Points de sécurité / urgence', String(e.securite)]);
      this.kv(lignes.map(function (l) { return [l[0], l[1], true]; }));

      if (valeur(i.resumeTechnicien)) this.blocTexte('Synthèse du technicien', i.resumeTechnicien);
      if (valeur(i.objet)) this.blocTexte('Objet / demande du client', i.objet);
    }

    async blocSignatures(titre) {
      const p = this.pdf, C = this.C, i = this.i, s = this.s;
      const sigClient = await toJpeg((i.signatureClient || {}).dataUrl, 900, 0.9);
      const sigTech = await toJpeg(s.technicien && s.technicien.signature, 900, 0.9);
      const mention = valeur((s.impression && s.impression.mentionClient)) ||
        "Le client reconnaît avoir pris connaissance du présent rapport, avoir reçu les explications du technicien et accepte les constats et travaux décrits.";
      const hT = Pdf.wrap(mention, this.CW - 14, 8).length * 10.6 + 9;
      const hBloc = 118;
      this.saut(hT + hBloc + 26);
      const y0 = p.y;
      p.rect(this.M, y0, this.CW, hT, { fill: [1, 0.976, 0.929], stroke: [0.99, 0.9, 0.6], lineWidth: 0.5 });
      p.paragraph(mention, this.M + 7, y0 + 2, this.CW - 14, { size: 8, color: [0.42, 0.29, 0.05] });
      const y = y0 + hT + 10;
      const colW = (this.CW - 10) / 2;
      [0, 1].forEach(function (k) {
        const x = this.M + k * (colW + 10);
        p.rect(x, y, colW, hBloc, { stroke: C.bordFort, lineWidth: 0.8 });
        p.rect(x + 0.5, y + 0.5, colW - 1, 15, { fill: C.bleuClair });
        p.text(k === 0 ? 'Le client (bon pour accord)' : 'Le technicien', x + 6, y + 10.5, { size: 8.4, font: 'F2', color: C.bleu });
