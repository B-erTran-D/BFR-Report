      kvLignes.push(['Téléphone / e-mail client', [valeur(i.client && i.client.tel), valeur(i.client && i.client.email)].filter(Boolean).join(' / ') || '—']);

      if (i.multiJours && Array.isArray(i.jours) && i.jours.length > 0) {
        const datesJ = i.jours.map(j => frDate(j.date)).filter(Boolean);
        const plageDate = (datesJ.length > 1) ? (datesJ[0] + ' au ' + datesJ[datesJ.length - 1]) : (datesJ[0] || frDate(i.date));
        kvLignes.push(['Date d\'intervention', plageDate]);
        kvLignes.push(['Horaires sur site', i.jours.length + ' ' + this.L(i.jours.length > 1 ? 'Journées d\'intervention' : 'Journée')]);
      } else {
        kvLignes.push(['Date d\'intervention', frDate(i.date)]);
        kvLignes.push(['Horaires sur site', [heureFr(i.chrono && i.chrono.debut) || '—', heureFr(i.chrono && i.chrono.fin) || 'en cours'].join(' - ')]);
      }

      kvLignes.push(['Durée sur site', formatDuree(this.etat.duree) ? formatDuree(this.etat.duree) + ' (' + dureeDecimale(this.etat.duree) + ' h)' : '—']);

      const tr = calculerTrajet(i.trajet, this.etat.duree);
      if (tr && tr.actif) {
        if (tr.aller.heureDepart || tr.aller.heureArrivee) {
          const horAller = [tr.aller.heureDepart || '—', tr.aller.heureArrivee || '—'].join(' - ');
          kvLignes.push([this.L('Trajet aller'), horAller + ' (' + tr.aller.texte + ')']);
        } else if (tr.aller.minutes) {
          kvLignes.push([this.L('Trajet aller'), tr.aller.texte + ' (' + tr.aller.decimale + ' h)']);
        }
        if (tr.retour.heureDepart || tr.retour.heureArrivee || tr.retour.minutes) {
          const horRetour = [tr.retour.heureDepart ? (tr.retour.estime ? '~' : '') + tr.retour.heureDepart : '—', tr.retour.heureArrivee ? (tr.retour.estime ? '~' : '') + tr.retour.heureArrivee : '—'].join(' - ');
          const tagEstime = tr.retour.estime ? ' [' + this.L('estimé') + ']' : '';
          kvLignes.push([this.L(tr.retour.estime ? 'Trajet retour (estimé)' : 'Trajet retour'), horRetour + ' (' + tr.retour.texte + tagEstime + ')']);
        }
        kvLignes.push([this.L('Total déplacement'), tr.totalRoute.texte + ' (' + tr.totalRoute.decimale + ' h)']);
        kvLignes.push([this.L('Total général (site + route)'), tr.totalGeneral.texte + ' (' + tr.totalGeneral.decimale + ' h)', true]);
      }

      if (techniciens.length <= 1) {
        kvLignes.push(['Technicien', nomTechnicien(i, s) || '—']);
      } else {
        const txtTechs = techniciens.map(t => t.nom + (t.fonction ? ' (' + this.L(t.fonction) + ')' : '') + (t.principal ? ' [' + this.L('Technicien principal') + ']' : '')).join(' · ');
        kvLignes.push(['Technicien(s) sur site', txtTechs, true]);
      }

      this.kv(kvLignes);

      if (i.multiJours && Array.isArray(i.jours) && i.jours.length > 0) {
        this.titre('Relevé des journées d\'intervention', i.jours.length + ' ' + this.L(i.jours.length > 1 ? 'Journées d\'intervention' : 'Journée'), 90);
        await this.blocJours(i.jours);
      }

      let piecesRendues = false;
      let dernierTypeEtaitEvenement = false;
      // Sections du canevas
      for (const section of this.canevas) {
        if (section.type === 'synthese') {
          this.titre(section.titre || 'Synthèse');
          await this.blocSynthese();
          dernierTypeEtaitEvenement = false;
        } else if (section.type === 'evenements') {
          const evs = evenementsDe(i, section);
          if (!evs.length) continue;
          let idx = 0;
          for (const ev of evs) {
            idx++;
            // 1 seul évènement avec photos et commentaires par page.
            // Interdiction formelle d'avoir un autre évènement sur la même page.
            this.pdf.newPage();
            this.enteteSuite();
            const sousTitre = evs.length > 1 ? (this.L('Évènement') + ' ' + idx + ' / ' + evs.length) : null;
            this.titre(section.titre || 'Évènements', sousTitre);
            await this.blocEvenement(ev, idx);
          }
          dernierTypeEtaitEvenement = true;
        } else if (section.type === 'texte') {
          const contenu = valeur(i[section.champ]);
          if (!contenu) continue;
          if (dernierTypeEtaitEvenement) {
            this.pdf.newPage();
            this.enteteSuite();
          }
          this.titre(section.titre || 'Texte');
          this.blocTexte(null, contenu);
          dernierTypeEtaitEvenement = false;
        } else if (section.type === 'pieces') {
          piecesRendues = true;
          const pcs = (i.pieces || []).filter(p => (p.denomination || p.designation || p.reference || p.quantite));
          if (!pcs.length) continue;
          if (dernierTypeEtaitEvenement) {
            this.pdf.newPage();
            this.enteteSuite();
          }
          this.titre(section.titre || 'Pièces de rechange', pcs.length + ' pièce(s)', 120);
          await this.blocPieces(pcs);
          dernierTypeEtaitEvenement = false;
        } else if (section.type === 'photos') {
          const libres = (i.photosLibres || []).filter(ph => ph.dataUrl);
          if (!libres.length) continue;
          if (dernierTypeEtaitEvenement) {
            this.pdf.newPage();
            this.enteteSuite();
          }
          this.titre(section.titre || 'Photos', libres.length + ' photo(s)', 220);
          await this.photos(libres.map(ph => ({ dataUrl: ph.dataUrl, legende: valeur(ph.legende) })), true, false);
          dernierTypeEtaitEvenement = false;
        } else if (section.type === 'signature') {
          if (!piecesRendues) {
            const pcs = (i.pieces || []).filter(p => (p.denomination || p.designation || p.reference || p.quantite));
            if (pcs.length) {
              if (dernierTypeEtaitEvenement) {
                this.pdf.newPage();
                this.enteteSuite();
              }
              this.titre('Pièces de rechange', pcs.length + ' pièce(s)', 120);
              await this.blocPieces(pcs);
              piecesRendues = true;
              dernierTypeEtaitEvenement = false;
            }
          }
          if (dernierTypeEtaitEvenement) {
            this.pdf.newPage();
            this.enteteSuite();
          }
          this.titre(section.titre || 'Validation', null, 170);
          await this.blocSignatures();
          dernierTypeEtaitEvenement = false;
        }
      }

      // pied de page du modèle : société + adresses des deux sites + n° de page
      const self = this, doc = this.pdf;
      const sieges = [(s.societe && s.societe.nom) || 'BFR SYSTEMS']
        .concat(SIEGES_BFR.map(function (l) {
          if (s.societe && s.societe.siege1 && l.indexOf('n°1') > 0) return 'Siège social et site de production n°1 – ' + s.societe.siege1;
          if (s.societe && s.societe.siege2 && l.indexOf('n°2') > 0) return 'Site de production n°2 – ' + s.societe.siege2;
          return l;
        }));
      doc.addFooters(function (d, num, total) {
        const y = d.H - 20;
        d.line(d.margin, y - 26, d.W - d.margin, y - 26, { color: COULEURS_PDF.bord, width: 0.6 });
        const largeur = d.W - 2 * d.margin - 75;
        sieges.forEach(function (ligne, k) {
          d.text(Pdf.trunc(ligne, largeur, k === 0 ? 8.2 : 7.4, k === 0), d.margin, y - 16 + k * 9.2,
            { size: k === 0 ? 8.2 : 7.4, font: k === 0 ? 'F2' : 'F1', color: COULEURS_PDF.gris });
        });
        d.text('Page ' + num + ' / ' + total, d.W - d.margin, y - 8, { size: 8.0, font: 'F2', color: COULEURS_PDF.gris, align: 'right' });
      });

      if (this.opts.apercu) return { apercu: doc, filename: nomFichier(this.i, 'pdf', this.opts.suffixe ? this.langue : null) };
      return { blob: doc.blob(), filename: nomFichier(this.i, 'pdf', this.opts.suffixe ? this.langue : null) };
    }
  }

  /* Nom du fichier : « Rapport_20260921_260921-01_CLIENT.pdf ». Quand le
     rapport existe en deux langues, chacune porte son code (_FR / _NL…) pour
     que le client et le SAV s'y retrouvent dans la pièce jointe. */
  function nomFichier(i, ext, langue) {
    const d = (i.date || new Date().toISOString().slice(0, 10)).replace(/-/g, '');
    const machNom = (i.machine && i.machine.designation) || (i.machines && i.machines[0] && i.machines[0].designation) || '';
    const morceaux = ['Rapport', d, i.numero ? slug(i.numero) : '', slug(i.client && i.client.nom),
      slug(machNom)];
    if (langue) morceaux.push(String(langue).toUpperCase());
    return morceaux.filter(Boolean).join('_') + '.' + ext;
  }

  /* ======================================================================
     WORD (.docx)
     ====================================================================== */
  class RapportWord {
    constructor(intervention, reglages, opts) {
      this.i = intervention;
      this.s = reglages || {};
      this.opts = opts || {};
      this.langue = this.opts.langue || (intervention.langue && intervention.langue.code) || 'fr';
      this.canevas = (this.s.canevas && this.s.canevas.sections) ? this.s.canevas.sections : canevasDefaut().sections;
      this.etat = etat(intervention, reglages);
      this.doc = new Docx.Doc({
        langue: this.langue,
        auteur: (this.s.societe && this.s.societe.nom) || 'Application SAV',
        /* Pied de page du modèle : nom + adresses des deux sites, et numérotation. */
        pied: [(this.s.societe && this.s.societe.nom) || 'BFR SYSTEMS']
          .concat([valeur(this.s.societe && this.s.societe.siege1) || SIEGES_BFR[0],
                   valeur(this.s.societe && this.s.societe.siege2) || SIEGES_BFR[1]])
      });
      this.doc.titreDoc = (global.I18N ? global.I18N.traduire("Compte rendu d'intervention", this.langue) : "Compte rendu d'intervention") +
        (this.langue === 'fr' ? ' N° ' : ' No. ') + valeur(intervention.numero);
      this.numeroPhoto = 0;
    }

    /* Traduction d'un libellé du catalogue (domaines, catégories). */
    L(txt) {
      return (global.I18N ? global.I18N.traduire(txt, this.langue) : txt);
    }

    async generer() {
      const d = this.doc, i = this.i, s = this.s;

      /* Logo de la société en en-tête, répété sur chaque page (comme le modèle). */
      const logo = valeur(s.societe && s.societe.logo) || valeur(global.LOGO_BFR);
      if (logo) {
        const jp = await toJpeg(logo, 1200, 0.92);
        if (jp) d.logoEntete(jp.dataUrl);
      }

      /* Bloc client du modèle : {Client_Name} {Mail_Client} {numero_client} | {Logo_Client} */
      const cli = i.client || {};
      const logoCli = cli.logo ? await toJpeg(cli.logo, 460, 0.92) : null;
      const runsBlocClient = [
        { t: valeur(cli.nom), gras: true, taille: 13, font: 'Poppins' },
        { t: valeur(cli.email), taille: 10.5, saut: true },
        { t: valeur(cli.tel) ? 'Tél. ' + cli.tel : '', taille: 12.5, saut: true }
      ].filter(function (r) { return r.t; });
      if (logoCli) {
        d.image(logoCli.dataUrl, 4.5, { hauteurMaxCm: 2.2 });
      }
      d.tableau([[{ texte: runsBlocClient }, { texte: '' },
                  { texte: '' }]], { largeurs: [70, 15, 15], sansBordures: true });

      /* Titre du modèle : cyan BFR, centré */
      d.grandTitre("Compte rendu d'intervention", 30);
      d.grandTitre(frDate(i.date), 22);
      d.para('', { taille: 6, apres: 200 });

      /* « Votre contact : » + bloc technicien */
      d.para(this.L('Votre contact :'), { font: 'Poppins', taille: 10.5, couleur: '58595B', apres: 40 });
      d.para([{ t: Report.nomComplet(s.technicien) || '—', gras: true, taille: 12.5, font: 'Poppins' }], { apres: 20 });
      [(s.technicien || {}).fonction, (s.technicien || {}).email, (s.technicien || {}).tel ? 'Tél. ' + s.technicien.tel : '']
        .filter(Boolean).forEach(function (l) { d.para(l, { taille: 10.5, couleur: '58595B', apres: 0 }); });

      const colleguesP1Word = (Array.isArray(i.techniciens) && i.techniciens.length > 1)
        ? i.techniciens.filter(x => x && !x.principal && valeur(x.nom))
        : [];
      if (colleguesP1Word.length > 0) {
        d.para([{ t: this.L('Accompagné de') + ' : ', gras: true, font: 'Poppins' }, { t: colleguesP1Word.map(c => c.nom + (c.fonction ? ' (' + this.L(c.fonction) + ')' : '')).join(', ') }],
          { taille: 10, couleur: '58595B', avant: 20, apres: 20 });
      }

      /* Page 2 du modèle : destinataire, lieu et date, « À l'attention de » */
      d.sautDePage();
      d.para([{ t: valeur(cli.nom), gras: true, taille: 12.5, font: 'Poppins' }], { apres: 20 });
      String(valeur(cli.adresse) || valeur(cli.lieu)).split('\n').forEach(function (l) {
        d.para(l, { taille: 10.5, couleur: '58595B', apres: 0 });
      });
      d.para('', { taille: 6, apres: 140 });
      d.para('À ' + (valeur(s.societe && s.societe.lieuLettre) || 'Blyes') + ', le ' + frDate(i.date) + ',',
        { taille: 10.5, couleur: '58595B', apres: 60 });
      d.para("À l'attention de " + valeur(cli.contact) + ',', { taille: 10.8, couleur: '58595B', apres: 200 });

      const machinesWord = listeMachines(i);
      const techniciensWord = listeTechniciens(i, s);
      const machPrincipalWord = machinesWord[0] || i.machine || {};
      const machLabelWord = machinesWord.length > 1
        ? machinesWord.map(m => m.designation).filter(Boolean).join(' ; ')
        : (valeur(machPrincipalWord.designation) || '—');
      const modLabelWord = machinesWord.length > 1
        ? machinesWord.map(m => m.modele).filter(Boolean).join(' ; ')
        : ([valeur(machPrincipalWord.marque), valeur(machPrincipalWord.modele)].filter(Boolean).join(' ') || '—');
      const numSerieLabelWord = machinesWord.length > 1
        ? machinesWord.map(m => m.serie).filter(Boolean).join(' ; ')
        : (valeur(machPrincipalWord.serie) || '—');

      const techLabelWord = techniciensWord.length > 1
        ? techniciensWord.map(t => t.nom + (t.fonction ? ' (' + this.L(t.fonction) + ')' : '')).join(' · ')
        : (nomTechnicien(i, s) || '—');

      let horLabelWord = (heureFr(i.chrono && i.chrono.debut) || '—') + ' - ' + (heureFr(i.chrono && i.chrono.fin) || 'en cours');
      if (i.multiJours && Array.isArray(i.jours) && i.jours.length > 0) {
        horLabelWord = i.jours.length + ' ' + this.L(i.jours.length > 1 ? 'Journées d\'intervention' : 'Journée');
      }

      const tr = calculerTrajet(i.trajet, this.etat.duree);
      let lignesTrajetWord = [];
      if (tr && tr.actif) {
        const horAller = (tr.aller.heureDepart && tr.aller.heureArrivee) ? (tr.aller.heureDepart + ' - ' + tr.aller.heureArrivee) : '—';
        const horRetour = (tr.retour.heureDepart && tr.retour.heureArrivee) ? ((tr.retour.estime ? '~' : '') + tr.retour.heureDepart + ' - ' + (tr.retour.estime ? '~' : '') + tr.retour.heureArrivee) : '—';
        lignesTrajetWord = [
          [
            { texte: this.L('Trajet aller'), gras: true },
            { texte: horAller + ' (' + tr.aller.texte + ')' },
            { texte: this.L(tr.retour.estime ? 'Trajet retour (estimé)' : 'Trajet retour'), gras: true },
            { texte: horRetour + ' (' + tr.retour.texte + (tr.retour.estime ? ' [' + this.L('estimé') + ']' : '') + ')' }
          ],
          [
            { texte: this.L('Total déplacement'), gras: true },
            { texte: tr.totalRoute.texte + ' (' + tr.totalRoute.decimale + ' h)' },
            { texte: this.L('Total général (site + route)'), gras: true, fond: 'E8EFFA' },
            { texte: tr.totalGeneral.texte + ' (' + tr.totalGeneral.decimale + ' h)', gras: true, fond: 'E8EFFA' }
          ]
        ];
      }

      d.bandeau('Intervention');
      d.tableau([
        [{ texte: this.L('Client'), gras: true }, { texte: valeur(i.client && i.client.nom) || '—' },
         { texte: this.L('Machine'), gras: true }, { texte: machLabelWord }],
        [{ texte: this.L('Lieu'), gras: true }, { texte: valeur(i.client && i.client.lieu) || '—' },
         { texte: this.L('Modèle'), gras: true }, { texte: modLabelWord }],
        [{ texte: this.L('Adresse client'), gras: true }, { texte: valeur(i.client && i.client.adresse) || '—' },
         { texte: this.L('N° de série'), gras: true }, { texte: numSerieLabelWord }],
        [{ texte: this.L('Contact sur site'), gras: true },
         { texte: [valeur(i.client && i.client.contact), valeur(i.client && i.client.fonction)].filter(Boolean).join(' — ') || '—' },
         { texte: this.L(techniciensWord.length > 1 ? 'Techniciens sur site' : 'Technicien'), gras: true }, { texte: techLabelWord }],
        [{ texte: this.L('Téléphone / e-mail'), gras: true },
         { texte: [valeur(i.client && i.client.tel), valeur(i.client && i.client.email)].filter(Boolean).join(' / ') || '—' },
         { texte: this.L('Horaires sur site'), gras: true },
         { texte: horLabelWord }]
      ].concat(
        /* Compteur / n° de parc : plus demandés, imprimés seulement s'ils existent. */
        valeur(i.machine && (i.machine.compteur || i.machine.parc))
          ? [[{ texte: 'Compteur / N° de parc', gras: true },
              { texte: [valeur(i.machine.compteur), valeur(i.machine.parc)].filter(Boolean).join(' — ') },
              { texte: this.L('Durée sur site'), gras: true },
              { texte: formatDuree(this.etat.duree) || '—' }]]
          : [[{ texte: this.L('Durée sur site'), gras: true },
              { texte: formatDuree(this.etat.duree) || '—' }, { texte: '' }, { texte: '' }]]
      ).concat(lignesTrajetWord), { largeurs: [18, 32, 18, 32], enteteFond: 'F1F5F9' });

      // Si plusieurs machines, tableau récapitulatif détaillé des machines
      if (machinesWord.length > 1) {
        d.bandeau(this.L('Machines visitées'));
        const enteteMach = [
          { texte: this.L('Machine'), gras: true, fond: 'E8EFFA' },
          { texte: this.L('Modèle'), gras: true, fond: 'E8EFFA' },
          { texte: this.L('N° de série'), gras: true, fond: 'E8EFFA' }
        ];
        const lignesMach = machinesWord.map(m => [
          { texte: m.designation || '—' },
          { texte: m.modele || '—' },
          { texte: m.serie || '—' }
        ]);
        d.tableau([enteteMach].concat(lignesMach), { largeurs: [40, 30, 30] });
      }

      // Si intervention multi-jours, tableau récapitulatif des journées
      if (i.multiJours && Array.isArray(i.jours) && i.jours.length > 0) {
        d.bandeau(this.L('Relevé des journées d\'intervention'));
        const enteteJours = [
          { texte: this.L('Date'), gras: true, fond: 'E8EFFA' },
          { texte: this.L('Horaires sur site'), gras: true, fond: 'E8EFFA' },
          { texte: this.L('Pause'), gras: true, align: 'center', fond: 'E8EFFA' },
          { texte: this.L('Durée sur site'), gras: true, align: 'center', fond: 'E8EFFA' },
          { texte: this.L('Activité / Travaux'), gras: true, fond: 'E8EFFA' }
        ];
        let totH = 0;
        const lignesJours = i.jours.map(item => {
          const dt = frDate(item.date) || '—';
          const hor = (item.debut && item.fin) ? (item.debut + ' - ' + item.fin) : (item.debut || item.fin || '—');
          const pauseTxt = item.pauseMinutes ? (item.pauseMinutes + ' min') : '—';
          const dh = typeof item.dureeHeures === 'number' ? item.dureeHeures : (typeof item.duree === 'number' ? item.duree : 0);
          totH += dh;
          const durTxt = dh > 0 ? (Math.floor(dh) + ' h ' + pad2(Math.round((dh % 1) * 60)) + ' (' + dh.toFixed(2).replace('.', ',') + ' h)') : '—';
          const desc = valeur(item.description || item.activite) || '—';
          return [
            { texte: dt },
            { texte: hor },
            { texte: pauseTxt, align: 'center' },
            { texte: durTxt, gras: true, align: 'center' },
            { texte: desc }
          ];
        });
        const durTotTxt = totH > 0 ? (Math.floor(totH) + ' h ' + pad2(Math.round((totH % 1) * 60)) + ' (' + totH.toFixed(2).replace('.', ',') + ' h)') : '—';
        lignesJours.push([
          { texte: this.L('Total cumulé'), gras: true, fond: 'E8EFFA' },
          { texte: '', fond: 'E8EFFA' },
          { texte: '', fond: 'E8EFFA' },
          { texte: durTotTxt, gras: true, align: 'center', fond: 'E8EFFA' },
          { texte: '', fond: 'E8EFFA' }
        ]);
        d.tableau([enteteJours].concat(lignesJours), { largeurs: [18, 20, 14, 18, 30] });
      }

      let piecesRendues = false;
      let dernierTypeEtaitEvenement = false;
      for (const section of this.canevas) {
        if (section.type === 'synthese') {
          d.bandeau(section.titre || 'Synthèse');
          const lignes = (this.s.categories || []).filter(c => this.etat.parCategorie[c.id])
            .map(c => [{ texte: this.L(c.libelle) }, { texte: String(this.etat.parCategorie[c.id]), align: 'center', gras: true }]);
          if (lignes.length) d.tableau([[{ texte: 'Catégorie', gras: true }, { texte: 'Nombre', gras: true, align: 'center' }]].concat(lignes),
            { largeurs: [70, 30], enteteFond: 'E8EFFA' });
          const dom = (this.s.domaines || []).filter(x => this.etat.parDomaine[x.id])
            .map(x => this.L(x.libelle) + ' : ' + this.etat.parDomaine[x.id]);
          if (dom.length) d.para(dom.join('   •   '), { taille: 10.5, couleur: '334155', apres: 60 });
          d.para('Heures passées sur site : ' + (formatDuree(this.etat.duree) || '—') +
            (this.etat.duree ? ' (' + dureeDecimale(this.etat.duree) + ' h)' : '') + '   •   Photos : ' + this.etat.nbPhotos,
            { taille: 10.5, apres: 120 });
          if (valeur(i.resumeTechnicien)) d.para('Synthèse du technicien', { font: 'Poppins', gras: true, taille: 11.5, apres: 40 }),
            d.para(i.resumeTechnicien, { taille: 10.5, apres: 120 });
          if (valeur(i.objet)) d.para('Objet / demande du client', { font: 'Poppins', gras: true, taille: 11.5, apres: 40 }),
            d.para(i.objet, { taille: 10.5, apres: 120 });
          dernierTypeEtaitEvenement = false;
        } else if (section.type === 'evenements') {
          const evs = evenementsDe(i, section);
          if (!evs.length) continue;
          let idx = 0;
          for (const ev of evs) {
            idx++;
            // 1 seul évènement avec photos et commentaires par page.
            // Interdiction d'avoir le début d'un autre évènement sur la fin de la page précédente.
            d.sautDePage();
            const sousTitre = evs.length > 1 ? (' — ' + this.L('Évènement') + ' ' + idx + ' / ' + evs.length) : '';
            d.bandeau((section.titre || 'Évènements') + sousTitre);

            const cat = this.etat.categories[ev.categorie || 'INFO'] || { libelle: 'Informatif', couleur: '#475569' };
            const dom = this.etat.domaines[ev.domaine] || { libelle: '—' };
            const morc = [
              { t: this.L(dom.libelle), font: 'Poppins', gras: true, taille: 11.5, couleur: '332E72' }
            ];
            if (ev.machineNom) {
              morc.push({ t: '   [' + ev.machineNom + ']', font: 'Poppins', gras: true, taille: 10.5, couleur: '06BAF2' });
            }
            morc.push(
              { t: '   [' + this.L(cat.libelle).toUpperCase() + ']', font: 'Poppins', gras: true, taille: 10.5, couleur: hexDocx(cat.couleur) },
              { t: heureFr(ev.heure) ? '   ' + heureFr(ev.heure) : '', taille: 9.5, couleur: '94A3B8' }
            );
            d.para(morc, { avant: 140, apres: 50 });
            d.para(valeur(ev.texte) || '(aucune annotation)', { taille: 10.5, apres: 80, encadre: true });

            const phs = (ev.photos || []).filter(x => x.dataUrl);
            if (phs.length === 1) {
              this.numeroPhoto++;
              d.image(phs[0].dataUrl, 14, { hauteurMaxCm: 9.5, legende: 'Photo ' + this.numeroPhoto + (phs[0].legende ? ' — ' + phs[0].legende : '') });
            } else if (phs.length > 1) {
              for (const ph of phs) {
                this.numeroPhoto++;
                d.image(ph.dataUrl, 11.5, { hauteurMaxCm: 7.5, legende: 'Photo ' + this.numeroPhoto + (ph.legende ? ' — ' + ph.legende : '') });
              }
            }
          }
          dernierTypeEtaitEvenement = true;
        } else if (section.type === 'texte') {
          const contenu = valeur(i[section.champ]);
          if (!contenu) continue;
          if (dernierTypeEtaitEvenement) d.sautDePage();
          d.bandeau(section.titre || 'Texte');
          d.para(contenu, { taille: 10.5, apres: 120 });
          dernierTypeEtaitEvenement = false;
        } else if (section.type === 'pieces') {
          piecesRendues = true;
          const pcs = (i.pieces || []).filter(p => (p.denomination || p.designation || p.reference || p.quantite));
          if (!pcs.length) continue;
          if (dernierTypeEtaitEvenement) d.sautDePage();
          d.bandeau(section.titre || 'Pièces de rechange');
          const avecPhotos = pcs.some(p => p && p.photo);
          const enteteTab = avecPhotos ? [
            { texte: this.L('Photo'), gras: true, align: 'center', fond: 'E8EFFA' },
            { texte: this.L('Dénomination'), gras: true, fond: 'E8EFFA' },
            { texte: this.L('Référence'), gras: true, fond: 'E8EFFA' },
            { texte: this.L('Quantité'), gras: true, align: 'center', fond: 'E8EFFA' }
          ] : [
            { texte: this.L('Dénomination'), gras: true, fond: 'E8EFFA' },
            { texte: this.L('Référence'), gras: true, fond: 'E8EFFA' },
            { texte: this.L('Quantité'), gras: true, align: 'center', fond: 'E8EFFA' }
          ];
          const lignesTab = pcs.map(p => {
            if (avecPhotos) {
              return [
                p.photo ? { image: p.photo, imageCm: 1.5, align: 'center' } : { texte: '—', align: 'center' },
                { texte: p.denomination || p.designation || '—' },
                { texte: p.reference || '—' },
                { texte: String(p.quantite || 1), align: 'center' }
              ];
            }
            return [
              { texte: p.denomination || p.designation || '—' },
              { texte: p.reference || '—' },
              { texte: String(p.quantite || 1), align: 'center' }
            ];
          });
          d.tableau([enteteTab].concat(lignesTab), { largeurs: avecPhotos ? [16, 44, 26, 14] : [55, 30, 15] });
          d.para(this.L('La signature du client vaut pour acceptation du devis final et validation des pièces de rechange ci-dessus.'), { taille: 9.5, couleur: '64748B', apres: 120 });
          dernierTypeEtaitEvenement = false;
        } else if (section.type === 'photos') {
          const libres = (i.photosLibres || []).filter(ph => ph.dataUrl);
          if (!libres.length) continue;
          if (dernierTypeEtaitEvenement) d.sautDePage();
          d.bandeau(section.titre || 'Photos');
          libres.forEach(function (ph, k) { d.image(ph.dataUrl, 13, { hauteurMaxCm: 8.5, legende: valeur(ph.legende) || ('Photo ' + (k + 1)) }); });
          dernierTypeEtaitEvenement = false;
        } else if (section.type === 'signature') {
          if (!piecesRendues) {
            const pcs = (i.pieces || []).filter(p => (p.denomination || p.designation || p.reference || p.quantite));
            if (pcs.length) {
              if (dernierTypeEtaitEvenement) d.sautDePage();
              d.bandeau('Pièces de rechange');
              const avecPhotos = pcs.some(p => p && p.photo);
              const enteteTab = avecPhotos ? [
                { texte: this.L('Photo'), gras: true, align: 'center', fond: 'E8EFFA' },
                { texte: this.L('Dénomination'), gras: true, fond: 'E8EFFA' },
                { texte: this.L('Référence'), gras: true, fond: 'E8EFFA' },
                { texte: this.L('Quantité'), gras: true, align: 'center', fond: 'E8EFFA' }
              ] : [
                { texte: this.L('Dénomination'), gras: true, fond: 'E8EFFA' },
                { texte: this.L('Référence'), gras: true, fond: 'E8EFFA' },
                { texte: this.L('Quantité'), gras: true, align: 'center', fond: 'E8EFFA' }
              ];
              const lignesTab = pcs.map(p => {
                if (avecPhotos) {
                  return [
                    p.photo ? { image: p.photo, imageCm: 1.5, align: 'center' } : { texte: '—', align: 'center' },
                    { texte: p.denomination || p.designation || '—' },
                    { texte: p.reference || '—' },
                    { texte: String(p.quantite || 1), align: 'center' }
                  ];
                }
                return [
                  { texte: p.denomination || p.designation || '—' },
                  { texte: p.reference || '—' },
                  { texte: String(p.quantite || 1), align: 'center' }
                ];
              });
              d.tableau([enteteTab].concat(lignesTab), { largeurs: avecPhotos ? [16, 44, 26, 14] : [55, 30, 15] });
              d.para(this.L('La signature du client vaut pour acceptation du devis final et validation des pièces de rechange ci-dessus.'), { taille: 9.5, couleur: '64748B', apres: 120 });
              piecesRendues = true;
              dernierTypeEtaitEvenement = false;
            }
          }
          if (dernierTypeEtaitEvenement) d.sautDePage();
          d.bandeau(section.titre || 'Validation');
          let mention = valeur(this.s.impression && this.s.impression.mentionClient) ||
            "Le client reconnaît avoir pris connaissance du présent rapport, avoir reçu les explications du technicien et accepte les constats et travaux décrits.";
          const pcs = (i.pieces || []).filter(p => (p.denomination || p.designation || p.reference || p.quantite));
          if (pcs.length > 0) {
            mention += " La signature du client vaut pour acceptation du devis final et validation des pièces de rechange ci-dessus.";
          }
          if (tr && tr.actif) {
            mention += " La durée du trajet retour est estimée sur la base du trajet aller constaté.";
          }
          d.para(this.L(mention), { taille: 9.8, apres: 160, encadre: true });
          const cli = i.signatureClient || {};
          const ligAccompagne = (colleguesP1Word.length > 0)
            ? [[{ texte: '' }, { texte: this.L('Accompagné de') + ' : ' + colleguesP1Word.map(c => c.nom + (c.fonction ? ' (' + this.L(c.fonction) + ')' : '')).join(', ') }]]
            : [];
          d.tableau([
            [{ texte: this.L('Le client (bon pour accord)'), gras: true, fond: 'E8EFFA' }, { texte: this.L('Le technicien'), gras: true, fond: 'E8EFFA' }],
            [{ texte: valeur(cli.nom) || '—' }, { texte: valeur(i.technicien) || valeur(s.technicien && s.technicien.nom) || '—' }],
            [{ texte: valeur(cli.fonction) || '' }, { texte: [valeur(s.technicien && s.technicien.fonction), contactTech(s.technicien)].filter(Boolean).join(' — ') }]
          ].concat(ligAccompagne).concat([
            [{ texte: 'Date : ' + frDate(cli.date || i.date) + (cli.heure ? ' à ' + cli.heure : '') },
             { texte: 'Date : ' + frDate(i.date) + (heureFr(i.chrono && i.chrono.fin) ? ' à ' + heureFr(i.chrono && i.chrono.fin) : '') }]
          ]), { largeurs: [50, 50] });
          if (cli.dataUrl) d.image(cli.dataUrl, 6, { hauteurMaxCm: 3 });
        }
      }
      return { blob: this.doc.blob(), filename: nomFichier(this.i, 'docx', this.opts.suffixe ? this.langue : null) };
    }
  }

  /* ===================== E-mails ====================================== */
  function variables(intervention, reglages) {
    const e = etat(intervention, reglages);
    const i = intervention;
    const lignes = e.evenements
      .filter(x => x.categorie === 'SECURITE' || x.categorie === 'URGENT' || x.categorie === 'HAUTE')
      .map(function (x) {
        const cat = e.categories[x.categorie] || {};
        const dom = e.domaines[x.domaine] || {};
        return '[' + (cat.libelle || x.categorie) + '] ' + (dom.libelle || '') + ' : ' + valeur(x.texte).split('\n')[0].slice(0, 180);
      });
    /* Noms des variables du modèle « Compte rendu d'intervention » BFR
       (Google Doc de référence) : {Client_Name} {Mail_Client} {numero_client}
       {Logo_Client} {Date} {Name_Technicien} {Poste_Tech} {Mail_Tech} {Num_Tech}
       {Client_Adress} {Client_Contact}. */
    const c = i.client || {}, t = reglages.technicien || {};
    const modele = {
      Client_Name: valeur(c.nom), Mail_Client: valeur(c.email),
      numero_client: valeur(c.tel),                       // téléphone du client (saisi si absent de la liste)
      Logo_Client: valeur(c.logo),                        // vide = place laissée vide dans le compte rendu
      Date: frDate(i.date),
      Name_Technicien: nomTechnicien(i, reglages), Poste_Tech: valeur(t.fonction),
      Mail_Tech: valeur(t.email), Num_Tech: valeur(t.tel),
      Client_Adress: valeur(c.adresse || c.lieu), Client_Contact: valeur(c.contact)
    };
    return Object.assign(modele, {
      numero: valeur(i.numero), affaire: valeur(i.numero),
      client: valeur(i.client && i.client.nom), contact: valeur(i.client && i.client.contact),
      lieu: valeur(i.client && (i.client.lieu || i.client.adresse)),
      date: frDate(i.date),
      machine: (function () {
        const ms = listeMachines(i);
        if (ms.length > 1) {
          return ms.map(m => [m.designation, m.modele].filter(Boolean).join(' ')).filter(Boolean).join(' ; ');
        }
        if (ms.length === 1) {
          return [ms[0].designation, ms[0].modele].filter(Boolean).join(' ') || ms[0].designation || ms[0].modele || '';
        }
        return [i.machine && i.machine.designation, i.machine && i.machine.modele].filter(Boolean).join(' ') || (i.machine && i.machine.designation) || '';
      })(),
      serie: valeur(i.machine && i.machine.serie),
      technicien: nomTechnicien(i, reglages) || 'Technicien SAV',
      societe: valeur(reglages && reglages.societe && reglages.societe.nom) || 'BFR SYSTEMS',
      debut: heureFr(i.chrono && i.chrono.debut), fin: heureFr(i.chrono && i.chrono.fin),
      duree: formatDuree(e.duree) || '—',
      nbEvenements: String(e.evenements.length),
      nbSecurite: String(e.parCategorie.SECURITE || 0),
      nbUrgent: String(e.parCategorie.URGENT || 0),
      nbHaute: String(e.parCategorie.HAUTE || 0),
      nbBasse: String(e.parCategorie.BASSE || 0),
      nbInfo: String(e.parCategorie.INFO || 0),
      nbPhotos: String(e.nbPhotos),
      pointsCles: lignes.length ? lignes.join('\n') : 'Aucun point de sécurité ou d\'urgence relevé.',
      resume: valeur(i.resumeTechnicien), actions: valeur(i.actions), aPrevoir: valeur(i.aPrevoir)
    });
  }

  function appliquer(tpl, vars) {
    return String(tpl || '').replace(/\{\{(\w+)\}\}/g, function (m, k) { return vars[k] !== undefined ? vars[k] : m; });
  }
  function objetMail(i, s) {
    return appliquer((s.mail && s.mail.objet) || 'Rapport d\'intervention N° {{numero}} — {{client}} — {{date}}', variables(i, s));
  }
  function corpsMail(i, s, langue) {
    let tpl = (s && s.mail && s.mail.corps) || '';
    if (!tpl || tpl.indexOf('pointsCles') !== -1 || tpl.indexOf('Points clés') !== -1 || tpl.indexOf('{{actions}}') !== -1 || tpl.indexOf('Travaux réalisés') !== -1 || tpl.indexOf('nbEvenements') !== -1 || tpl.indexOf('Synthèse :') !== -1 || tpl.indexOf('Cordialement') !== -1 || tpl.indexOf('{{technicien}}') !== -1) {
      tpl = defaultCorpsMail();
    }
    const vars = variables(i, s);
    let corps = appliquer(tpl, vars);
    // Nettoyer les parenthèses vides si le lieu n'est pas renseigné (ex: "CLIENT () — MACHINE" -> "CLIENT — MACHINE")
    corps = corps.replace(/\s*\(\s*\)\s*/g, ' ').replace(/\s+—\s*\./g, '.').replace(/[ \t]{2,}/g, ' ');
    /* Rapport envoyé en deux langues : on le dit au client, dans sa langue,
       à la fin du message (le corps du mail reste en français pour le SAV). */
    const phrase = (langue && langue !== 'fr' && global.I18N) ? global.I18N.phraseTraduction(langue) : null;
    return phrase ? corps + '\n\n' + phrase : corps;
  }
  function defaultCorpsMail() {
    return [
      'Bonjour,',
      '',
      'Veuillez trouver ci-joint le compte rendu d\'intervention N° {{numero}} du {{date}}, concernant {{client}} ({{lieu}}) — {{machine}}.',
      '',
      'Temps passé sur site : {{duree}}.',
      '',
      'Le rapport complet avec le détail des travaux, relevés techniques, pièces et signatures est joint au présent message.',
      '',
      'Restant à votre entière disposition pour tout renseignement complémentaire.'
    ].join('\n');
  }

  global.Report = {
    /* opts : { langue: 'en', suffixe: true } pour la version traduite. */
    genererPDF: function (i, s, opts) { return new RapportPDF(i, s, opts).generer(); },
    /* Aperçu dans l'application : renvoie un canvas par page. */
    apercu: async function (i, s, opts) {
      opts = opts || {};
      const r = await new RapportPDF(i, s, Object.assign({}, opts, { apercu: true })).generer();
      const pages = await Pdf.rendrePages(r.apercu, opts);
      return { pages: pages, doc: r.apercu, filename: r.filename };
    },
    genererDOCX: function (i, s, opts) { return new RapportWord(i, s, opts).generer(); },
    canevasDefaut: canevasDefaut,
    etat: etat, evenementsDe: evenementsDe, dureeMs: dureeMs, dureeTotale: dureeTotale, formatDuree: formatDuree,
    dureeDecimale: dureeDecimale, calculerTrajet: calculerTrajet, frDate: frDate, heureFr: heureFr, valeur: valeur, slug: slug,
    listeMachines: listeMachines, listeTechniciens: listeTechniciens,
    objetMail: objetMail, corpsMail: corpsMail, defaultCorpsMail: defaultCorpsMail, variables: variables,
    nomComplet: nomComplet, contactTech: contactTech, nomTechnicien: nomTechnicien
  };
})(window);
</script>
<script>/* =========================================================================
   annotate.js — Annotation d'une photo au doigt (flèche, cercle, texte, tracé)
   Les annotations sont mémorisées en coordonnées relatives (0 → 1) :
   elles se redessinent à n'importe quelle résolution à l'export.
   ========================================================================= */
(function (global) {
  'use strict';

  const COULEURS = ['#e11d48', '#f59e0b', '#22c55e', '#ffffff', '#111827'];
  const OUTILS = {
    crayon: {
      nom: 'Crayon',
      ico: '<svg class="bfr-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>'
    },
    fleche: {
      nom: 'Flèche',
      ico: '<svg class="bfr-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>'
    },
    cercle: {
      nom: 'Cercle',
      ico: '<svg class="bfr-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>'
    },
    texte: {
      nom: 'Texte',
      ico: '<svg class="bfr-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="12" y1="4" x2="12" y2="20"/><line x1="9" y1="20" x2="15" y2="20"/></svg>'
    }
  };

  /** Convertit une image (dataURL) en objet Image chargé. */
  function chargerImage(dataUrl) {
    return new Promise(function (resolve, reject) {
      const img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = reject;
      img.src = dataUrl;
    });
  }

  /** Dessine une annotation sur un contexte, dans un rectangle cible. */
  function dessinerAnnotation(ctx, a, rect) {
    const X = (v) => rect.x + v * rect.w;
    const Y = (v) => rect.y + v * rect.h;
    const ep = Math.max(2, rect.w * 0.006);        // épaisseur proportionnelle
    ctx.save();
    ctx.strokeStyle = a.couleur;
    ctx.fillStyle = a.couleur;
    ctx.lineWidth = ep;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (a.type === 'crayon') {
      ctx.beginPath();
      a.points.forEach(function (p, i) {
        if (i === 0) ctx.moveTo(X(p[0]), Y(p[1])); else ctx.lineTo(X(p[0]), Y(p[1]));
      });
      ctx.stroke();
    } else if (a.type === 'fleche') {
      const x1 = X(a.points[0][0]), y1 = Y(a.points[0][1]);
      const x2 = X(a.points[1][0]), y2 = Y(a.points[1][1]);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      const ang = Math.atan2(y2 - y1, x2 - x1);
      const t = ep * 4.2;
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - t * Math.cos(ang - 0.4), y2 - t * Math.sin(ang - 0.4));
      ctx.lineTo(x2 - t * Math.cos(ang + 0.4), y2 - t * Math.sin(ang + 0.4));
      ctx.closePath(); ctx.fill();
    } else if (a.type === 'cercle') {
      const cx = X(a.points[0][0]), cy = Y(a.points[0][1]);
      const rx = Math.abs(X(a.points[1][0]) - cx), ry = Math.abs(Y(a.points[1][1]) - cy);
      ctx.beginPath();
      ctx.ellipse(cx, cy, Math.max(2, rx), Math.max(2, ry), 0, 0, Math.PI * 2);
      ctx.stroke();
    } else if (a.type === 'texte') {
      const taille = Math.max(12, rect.w * (a.taille || 0.045));
      ctx.font = '600 ' + taille + 'px system-ui, sans-serif';
      ctx.textBaseline = 'top';
      ctx.lineWidth = Math.max(2, taille * 0.18);
      ctx.strokeStyle = 'rgba(0,0,0,.75)';
      ctx.strokeText(a.texte, X(a.points[0][0]), Y(a.points[0][1]));
      ctx.fillStyle = a.couleur;
      ctx.fillText(a.texte, X(a.points[0][0]), Y(a.points[0][1]));
    }
    ctx.restore();
  }

  /** Calcule le rectangle « contain » de l'image dans un canvas. */
  function rectContain(iw, ih, cw, ch) {
    const ratio = Math.min(cw / iw, ch / ih);
    const w = iw * ratio, h = ih * ratio;
    return { x: (cw - w) / 2, y: (ch - h) / 2, w: w, h: h };
  }

  /* ===================================================================== */
  class Editeur {
    constructor(photo, callbacks) {
      /* photo : { dataUrl, annotations } */
      this.photo = photo;
      this.cb = callbacks || {};
      this.annotations = (photo.annotations || []).map(a => JSON.parse(JSON.stringify(a)));
      this.outil = null;
      this.couleur = '#e11d48';
      this.enCours = null;
      this.ouvrir();
    }

    ouvrir() {
      const overlay = document.createElement('div');
      overlay.className = 'annot-editeur';
      overlay.innerHTML = `
        <div class="annot-bar">
          <button type="button" class="iconbtn" data-a="annuler">${(window.ICO && window.ICO.close(20)) || '✕'}</button>
          <div class="annot-titre">Annoter la photo</div>
          <button type="button" class="btn sm" data-a="valider">Valider</button>
        </div>
        <div class="annot-zone"><canvas id="annotCanvas"></canvas>
          <p class="annot-vide">Choisissez un outil ci-dessous, puis annotez la photo au doigt.</p>
        </div>
        <div class="annot-outils">
          <div class="annot-ligne">
            ${Object.keys(OUTILS).map(o => `<button type="button" class="outil" data-outil="${o}"><span>${OUTILS[o].ico}</span>${OUTILS[o].nom}</button>`).join('')}
          </div>
          <div class="annot-ligne">
            ${COULEURS.map(c => `<button type="button" class="pastille" data-couleur="${c}" style="background:${c}"></button>`).join('')}
            <button type="button" class="btn sm grey" data-a="undo">Annuler</button>
            <button type="button" class="btn sm grey" data-a="vider">${(window.ICO && window.ICO.trash(14)) || ''} Tout</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      this.overlay = overlay;
      this.canvas = overlay.querySelector('#annotCanvas');

      overlay.addEventListener('click', (e) => {
        const o = e.target.closest('[data-outil]');
        if (o) {
          this.outil = o.dataset.outil;
          overlay.querySelectorAll('.outil').forEach(b => b.classList.toggle('on', b === o));
          overlay.querySelector('.annot-vide').style.display = 'none';
          return;
        }
        const p = e.target.closest('[data-couleur]');
        if (p) {
          this.couleur = p.dataset.couleur;
          overlay.querySelectorAll('.pastille').forEach(b => b.classList.toggle('on', b === p));
          return;
        }
        const a = e.target.closest('[data-a]');
        if (!a) return;
        if (a.dataset.a === 'annuler') this.fermer(false);
        else if (a.dataset.a === 'valider') this.valider();
        else if (a.dataset.a === 'undo') { this.annotations.pop(); this.redessiner(); }
        else if (a.dataset.a === 'vider') { this.annotations = []; this.redessiner(); }
      });

      this.canvas.addEventListener('pointerdown', (e) => this.pointerDown(e));
      this.canvas.addEventListener('pointermove', (e) => this.pointerMove(e));
      this.canvas.addEventListener('pointerup', (e) => this.pointerUp(e));
      this.canvas.addEventListener('pointercancel', (e) => this.pointerUp(e));
      window.addEventListener('resize', () => this.redimensionner());

      this.pret = chargerImage(this.photo.dataUrl).then((img) => {
        this.img = img;
        this.redimensionner();
      }).catch(() => { this.fermer(false); });
    }

    redimensionner() {
      if (!this.img) return;
      const zone = this.overlay.querySelector('.annot-zone');
      const rect = zone.getBoundingClientRect();
      const dpr = Math.min(2.5, window.devicePixelRatio || 1);
      this.canvas.width = Math.max(280, Math.round(rect.width * dpr));
      this.canvas.height = Math.max(220, Math.round(rect.height * dpr));
      this.rectImage = rectContain(this.img.width, this.img.height, this.canvas.width, this.canvas.height);
      this.redessiner();
    }

    redessiner() {
      if (!this.img) return;
      const ctx = this.canvas.getContext('2d');
      ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
      ctx.fillStyle = '#0b1220';
      ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
      ctx.drawImage(this.img, this.rectImage.x, this.rectImage.y, this.rectImage.w, this.rectImage.h);
      this.annotations.forEach(a => dessinerAnnotation(ctx, a, this.rectImage));
      if (this.enCours) dessinerAnnotation(ctx, this.enCours, this.rectImage);
    }

    /** Position relative (0→1) dans l'image. */
    relatif(e) {
      const r = this.canvas.getBoundingClientRect();
      const cx = (e.clientX - r.left) * (this.canvas.width / (r.width || 1));
      const cy = (e.clientY - r.top) * (this.canvas.height / (r.height || 1));
      const im = this.rectImage;
      return [
        Math.min(1, Math.max(0, (cx - im.x) / im.w)),
        Math.min(1, Math.max(0, (cy - im.y) / im.h))
      ];
    }

    pointerDown(e) {
      if (!this.outil) { this.erreur('Choisissez d\'abord un outil (flèche, cercle, crayon ou texte)'); return; }
      if (!this.img) { this.erreur('Photo en cours de chargement'); return; }
      e.preventDefault();
      if (this.outil === 'texte') {
        const p = this.relatif(e);
        const texte = prompt('Texte à afficher sur la photo :');
        if (texte && texte.trim()) {
          this.annotations.push({ type: 'texte', couleur: this.couleur, points: [p], texte: texte.trim(), taille: 0.045 });
          this.redessiner();
        }
        return;
      }
      const p = this.relatif(e);
      this.enCours = { type: this.outil, couleur: this.couleur, points: [p] };
      if (this.outil === 'crayon') this.enCours.points = [p];
      try { this.canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }

    pointerMove(e) {
      if (!this.enCours) return;
      e.preventDefault();
      const p = this.relatif(e);
      if (this.enCours.type === 'crayon') this.enCours.points.push(p);
      else this.enCours.points[1] = p;
      this.redessiner();
    }

    pointerUp(e) {
      if (!this.enCours) return;
      const a = this.enCours;
      this.enCours = null;
      const assez = a.type === 'crayon'
        ? a.points.length > 2
        : (a.points[1] && (Math.abs(a.points[1][0] - a.points[0][0]) > 0.008 || Math.abs(a.points[1][1] - a.points[0][1]) > 0.008));
      if (assez) this.annotations.push(a);
      this.redessiner();
    }

    /** Exporte l'image annotée (JPEG) à une résolution raisonnable. */
    async exporter(largeurMax) {
      largeurMax = largeurMax || 1600;
      const ratio = Math.min(1, largeurMax / this.img.width);
      const w = Math.round(this.img.width * ratio);
      const h = Math.round(this.img.height * ratio);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(this.img, 0, 0, w, h);
      const rect = { x: 0, y: 0, w: w, h: h };
      this.annotations.forEach(a => dessinerAnnotation(ctx, a, rect));
      return c.toDataURL('image/jpeg', 0.85);
    }

    async valider() {
      if (!this.img) { this.erreur('Photo en cours de chargement — réessayez dans un instant'); return; }
      const dataUrl = await this.exporter();
      this.photo.dataUrl = dataUrl;
      this.photo.annotations = JSON.parse(JSON.stringify(this.annotations));
      this.fermer(true);
    }

    /** Message discret en bas de l'écran d'annotation. */
    erreur(message) {
      let el = this.overlay.querySelector('.annot-erreur');
      if (!el) {
        el = document.createElement('div');
        el.className = 'annot-erreur';
        this.overlay.appendChild(el);
      }
      el.textContent = message;
      clearTimeout(this._errTimer);
      this._errTimer = setTimeout(() => { if (el.parentNode) el.remove(); }, 2600);
    }

    fermer(valide) {
      this.overlay.remove();
      if (this.cb && this.cb.fin) this.cb.fin(!!valide, this.photo);
    }
  }

  global.Annotation = { ouvrir: function (photo, cb) { return new Editeur(photo, cb); }, dessinerAnnotation: dessinerAnnotation, chargerImage: chargerImage };
})(window);
</script>
<script>/* =========================================================================
   ICÔNES OFFICIELLES BFR SYSTEMS — MONOCHROMES & DUAL-TONES ÉPURÉES
   Remplacement de tous les émojis par des icônes vectorielles SVG sobres,
   tracées et calquées sur la charte technique BFR Systems.
   ========================================================================= */

(function (root) {
  'use strict';

  function svg(path, sz, cls, extra) {
    var s = sz || 18;
    return '<svg class="' + (cls || 'bfr-ico') + '" viewBox="0 0 24 24" width="' + s + '" height="' + s + '" ' +
      'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ' +
      (extra || '') + '>' + path + '</svg>';
  }

  function duo(bgPath, fgPath, sz, cls, extra) {
    var s = sz || 18;
    return '<svg class="' + (cls || 'bfr-ico bfr-ico-duo') + '" viewBox="0 0 24 24" width="' + s + '" height="' + s + '" ' +
      (extra || '') + '>' +
      '<g class="duo-bg" fill="currentColor" opacity="0.2">' + bgPath + '</g>' +
      '<g class="duo-fg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + fgPath + '</g>' +
      '</svg>';
  }

  var ICO = {
    // Topbar & navigation
    menu: function (sz, cls) {
      return svg('<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>', sz || 22, cls || 'bfr-ico', 'stroke-width="2.2"');
    },
    close: function (sz, cls) {
      return svg('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>', sz || 18, cls || 'bfr-ico', 'stroke-width="2.2"');
    },
    plus: function (sz, cls) {
      return svg('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>', sz || 18, cls || 'bfr-ico', 'stroke-width="2.5"');
    },

    // Validations & états
    check: function (sz, cls) {
      return svg('<polyline points="20 6 9 17 4 12"/>', sz || 18, cls || 'bfr-ico', 'stroke-width="2.4"');
    },
    checkCircle: function (sz, cls) {
      return duo(
        '<circle cx="12" cy="12" r="10"/>',
        '<circle cx="12" cy="12" r="10"/><polyline points="16 9 11 15 8 12"/>',
        sz || 18, cls
      );
    },

    // Actions document & signature
    signature: function (sz, cls) {
      return svg('<g stroke-width="1.7"><path d="M11 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h9.5a2 2 0 0 0 2-2v-4.5"/><path d="M11 2l5 5"/><path d="M11 2v4.5a.5.5 0 0 0 .5.5H16v3"/><line x1="6" y1="5.5" x2="9" y2="5.5"/><line x1="6" y1="8" x2="13" y2="8"/><line x1="6" y1="10.5" x2="13" y2="10.5"/><line x1="6" y1="13" x2="11.5" y2="13"/><line x1="6" y1="15.5" x2="10" y2="15.5"/><path d="M5.5 19c.8-.9 1.6.9 2.4 0s1.6.9 2.4 0"/><path d="m10.3 19 1.2-2.5 1.9 1.9-2.5 1.2a.4.4 0 0 1-.6-.6z"/><line x1="11.5" y1="16.5" x2="13.4" y2="18.4"/><path d="m11.5 16.5 6.3-6.3 1.9 1.9-6.3 6.3z"/><line x1="17.8" y1="10.2" x2="19.7" y2="12.1"/><path d="m17.8 10.2 1.1-1.1a1.35 1.35 0 0 1 1.9 1.9l-1.1 1.1"/><path d="m19.7 12.1 1.1 1.1a.4.4 0 0 1 0 .6l-2.4 2.4"/></g>', sz || 18, cls);
    },
    pen: function (sz, cls) {
      return svg('<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>', sz || 16, cls);
    },
    trash: function (sz, cls) {
      return svg('<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>', sz || 16, cls);
    },
    send: function (sz, cls) {
      return svg('<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>', sz || 18, cls);
    },
    eye: function (sz, cls) {
      return duo(
        '<circle cx="12" cy="12" r="3"/>',
        '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
        sz || 18, cls
      );
    },
    fileText: function (sz, cls) {
      return duo(

    gear: function (sz, cls) {

    },
    stop: function (sz, cls) {
      return '<svg class="' + (cls || 'bfr-ico') + '" viewBox="0 0 24 24" width="' + (sz || 16) + '" height="' + (sz || 16) + '" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>';
    },

    // Alertes & priorités
    shieldAlert: function (sz, cls) {
      return duo(

    flame: function (sz, cls) {

        '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3.5z"/>',
        '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3.5z"/>',

    download: function (sz, cls) {

    },
    mail: function (sz, cls) {
      return duo(
        '<rect x="2" y="4" width="20" height="16" rx="2"/>',
        '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>',

      );

    help: function (sz, cls) {
      return duo(
        '<circle cx="12" cy="12" r="10"/>',

        sz || 18, cls
      );
    },

    // Mappeurs intelligents pour les domaines et catégories (supporte id ou ancien emoji)
    domaine: function (id, sz) {
      var s = sz || 20;
      var str = (id || '').toString().toUpperCase();
      if (str === 'MECANIQUE' || str.indexOf('MECAN') !== -1 || str.indexOf('🔧') !== -1) return ICO.wrench(s);
      if (str === 'ELECTRIQUE' || str.indexOf('ELEC') !== -1 || str.indexOf('⚡') !== -1) return ICO.bolt(s);
      if (str === 'AUTOMATISME' || str.indexOf('AUTO') !== -1 || str.indexOf('🤖') !== -1) return ICO.cpu(s);
      return ICO.wrench(s);
    },
    categorie: function (id, sz) {
      var s = sz || 18;
      var str = (id || '').toString().toUpperCase();
      if (str === 'SECURITE' || str.indexOf('SEC') !== -1 || str.indexOf('🛑') !== -1) return ICO.shieldAlert(s);
      if (str === 'URGENT' || str.indexOf('URG') !== -1 || str.indexOf('⚠') !== -1) return ICO.flame(s);
      if (str === 'HAUTE' || str.indexOf('HAUT') !== -1 || str.indexOf('🔺') !== -1) return ICO.arrowUp(s);
      if (str === 'BASSE' || str.indexOf('BASS') !== -1 || str.indexOf('🔽') !== -1) return ICO.arrowDown(s);
      if (str === 'INFO' || str.indexOf('INF') !== -1 || str.indexOf('ℹ') !== -1) return ICO.info(s);
      return ICO.info(s);
    }
  };

  root.ICO = ICO;
})(typeof window !== 'undefined' ? window : (typeof global !== 'undefined' ? global : this));

<script>/* =========================================================================
   wizard.js — Assistant « Ajouter un évènement » en 4 étapes
     1. Domaine   : Mécanique / Électrique / Automatisme
     2. Annotation: texte écrit ou dicté (+ relecture vocale)
     3. Photo     : prise de vue puis annotation au doigt
     4. Catégorie : Sécurité / Urgent / Priorité haute / basse / Informatif
   L'évènement est enregistré dès la première étape et reste modifiable :
   on peut rouvrir l'assistant à tout moment, rien n'est perdu.
   ========================================================================= */
(function (global) {
  'use strict';

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  class Assistant {
    constructor(evenement, ctx) {
      this.ev = evenement;
      this.ctx = ctx || {};
      this.S = this.ctx.reglages || {};
      this.machines = (this.ctx.machines || []).filter(m => m && (m.designation || m.modele || m.serie));
      if (!this.ev.machineNom && !this.ev.machineId && this.machines.length === 1) {
        this.ev.machineId = this.machines[0].id || '';
        this.ev.machineNom = this.machines[0].designation || '';
      }
      /* Réouverture : on revient directement sur l'annotation si le domaine est déjà
         choisi (c'est ce qu'on corrige le plus souvent) ; « ← Retour » ramène au domaine. */
      this.etape = evenement.domaine ? 2 : 1;
      this.reconnaissance = null;
      this.ecoute = false;
      this.ouvrir();
    }

    domaines() { return this.S.domaines || []; }
    categories() { return this.S.categories || []; }

    ouvrir() {
      const icoClose = (window.ICO && window.ICO.close(20)) || '✕';
      const overlay = document.createElement('div');
      overlay.className = 'assistant';
      overlay.innerHTML = `
        <div class="assistant-bar">
          <button type="button" class="iconbtn" data-a="fermer">${icoClose}</button>
          <div class="assistant-titre">Évènement</div>
          <button type="button" class="btn sm" data-a="enregistrer">Enregistrer</button>
        </div>
        <div class="assistant-progres" id="assistantProgres"></div>
        <div class="assistant-corps" id="assistantCorps"></div>
        <div class="assistant-nav" id="assistantNav"></div>`;
      document.body.appendChild(overlay);
      this.overlay = overlay;
      this.corps = overlay.querySelector('#assistantCorps');

      overlay.addEventListener('click', (e) => {
        const b = e.target.closest('[data-a]');
        if (b) {
          const a = b.dataset.a;
          if (a === 'fermer') this.fermer();
          else if (a === 'enregistrer') this.enregistrer();
          else if (a === 'suivant') this.aller(this.etape + 1);
          else if (a === 'retour') this.aller(this.etape - 1);
          else if (a === 'supprimer') this.supprimer();
          else if (a === 'photo') this.prendrePhoto();
          else if (a === 'photo-lib') this.photoBibliotheque();
          else if (a === 'dictee') this.basculerDictee();
          else if (a === 'relire') this.relire();
          return;
        }
        const d = e.target.closest('[data-domaine]');
        if (d) {
          this.ev.domaine = d.dataset.domaine;
          if (!this.ev.heure) this.ev.heure = new Date().toISOString();
          this.maj(); this.aller(2);
          return;
        }
        const c = e.target.closest('[data-categorie]');
        if (c) {
          this.ev.categorie = c.dataset.categorie;
          this.ev.heure = this.ev.heure || new Date().toISOString();
          this.maj();
          this.toast('Évènement enregistré');
          this.fermer();
          return;
        }
        const p = e.target.closest('[data-annot]');
        if (p) {
          const photo = this.ev.photos[+p.dataset.annot];
          const self = this;
          Annotation.ouvrir(photo, {
            fin: function (valide) {
              if (valide) { self.maj(); }
              self.rendre();
            }
          });
          return;
        }
        const rm = e.target.closest('[data-retirer-photo]');
        if (rm) { this.ev.photos.splice(+rm.dataset.retirerPhoto, 1); this.maj(); this.rendre(); return; }
      });

      // saisie de texte : sauvegarde à chaque frappe (rien n'est perdu)
      overlay.addEventListener('input', (e) => {
        if (e.target.id === 'evTexte') {
          this.ev.texte = e.target.value;
          this.maj();
        }
      });

      overlay.addEventListener('change', (e) => {
        if (e.target.id === 'evMachine') {
          const val = e.target.value;
          const mach = this.machines.find(m => (m.id && m.id === val) || m.designation === val);
          if (mach) {
            this.ev.machineId = mach.id || '';
            this.ev.machineNom = mach.designation || '';
          } else {
            this.ev.machineId = '';
            this.ev.machineNom = '';
          }
          this.maj();
        }
      });

      this.rendre();
    }

    toast(msg) { if (this.ctx.toast) this.ctx.toast(msg); }

    maj() { if (this.ctx.onMaj) this.ctx.onMaj(this.ev); }

    enregistrer() {
      if (!this.ev.domaine) { this.aller(1); this.toast('Choisissez d\'abord le domaine'); return; }
      if (!this.ev.categorie) this.ev.categorie = 'INFO';
      this.ev.heure = this.ev.heure || new Date().toISOString();
      this.maj();
      this.toast('Évènement enregistré');
      this.fermer();
    }

    supprimer() {
      if (!confirm('Supprimer cet évènement ?')) return;
      if (this.ctx.onSupprimer) this.ctx.onSupprimer(this.ev);
      this.fermer();
    }

    fermer() {
      this.arreterDictee();
      this.overlay.remove();
      if (this.ctx.onFermer) this.ctx.onFermer(this.ev);
    }

    aller(n) {
      if (n < 1 || n > 4) return;
      if (n === 3 && !this.ev.domaine) { this.toast('Choisissez d\'abord le domaine'); return; }
      this.etape = n;
      this.rendre();
    }

    /* ---------- rendu ---------- */
    rendre() {
      this.overlay.querySelector('#assistantProgres').innerHTML = [1, 2, 3, 4].map(function (i) {
        const cls = ['pas'];
        if (i < this.etape) cls.push('fait');
        if (i === this.etape) cls.push('actif');
        return `<span class="${cls.join(' ')}"></span>`;
      }, this).join('') + `<span class="pas-libelle">Étape ${this.etape}/4 — ${
        ['Domaine', 'Annotation', 'Photo', 'Catégorie'][this.etape - 1]}</span>`;

      const rendus = { 1: () => this.etapeDomaine(), 2: () => this.etapeAnnotation(), 3: () => this.etapePhoto(), 4: () => this.etapeCategorie() };
      this.corps.innerHTML = rendus[this.etape]();

      const nav = [];
      if (this.etape > 1) nav.push('<button class="btn grey" data-a="retour">← Retour</button>');
      if (this.etape < 4) nav.push('<button class="btn" data-a="suivant">Suivant →</button>');
      else nav.push('<button class="btn or" data-a="enregistrer">' + ((window.ICO && window.ICO.check(16)) || '') + ' Terminer</button>');
      if (this.ev.domaine) nav.push('<button class="btn danger" data-a="supprimer">Supprimer</button>');
      this.overlay.querySelector('#assistantNav').innerHTML = nav.join('');
      this.corps.scrollTop = 0;
    }

    etapeDomaine() {
      const d = this.domaineCourant();
      return `<p class="assistant-question">Sur quel domaine porte cet évènement ?</p>
        <div class="domaines">
          ${this.domaines().map(function (x) {
            const icoHtml = (window.ICO && window.ICO.domaine(x.id || x.icone, 22)) || '';
            return `<button type="button" class="domaine${(d && d.id === x.id) ? ' on' : ''}" data-domaine="${esc(x.id)}">
              <span class="ico">${icoHtml}</span><span class="lib">${esc(x.libelle)}</span></button>`;
          }).join('')}
        </div>
        ${d ? `<p class="assistant-note">Domaine choisi : <strong>${esc(d.libelle)}</strong></p>` : ''}`;
    }

    etapeAnnotation() {
      const ev = this.ev;
      const dispo = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
      const icoMic = (window.ICO && (this.ecoute ? window.ICO.stop(16) : window.ICO.mic(18))) || '';
      const icoRelire = (window.ICO && window.ICO.speaker(18)) || '';
      const machSelect = (this.machines.length > 0) ? `
        <div class="field" style="margin-bottom:12px">
          <label style="font-size:0.85rem;font-weight:600;color:var(--bfr-secondary,#332e72)">Machine concernée</label>
          <select id="evMachine" style="width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--bfr-border,#dbe2ea);background:var(--bfr-card-bg,#ffffff);font-size:0.95rem">
            <option value="">— Non rattaché / Toute l'installation —</option>
            ${this.machines.map(m => {
              const sel = (ev.machineId && m.id === ev.machineId) || (ev.machineNom && m.designation === ev.machineNom);
              const label = [m.designation || 'Machine', m.modele ? '(' + m.modele + ')' : ''].filter(Boolean).join(' ');
              return `<option value="${esc(m.id || m.designation)}" ${sel ? 'selected' : ''}>${esc(label)}</option>`;
            }).join('')}
          </select>
        </div>` : '';
      return `<p class="assistant-question">Que constatez-vous ?</p>
        <p class="assistant-note">Écrivez, ou dictez à voix haute : le texte est ajouté automatiquement.</p>
        ${machSelect}
        <textarea id="evTexte" class="ev-texte" rows="7" placeholder="Ex. Courroie d'entraînement détendue : flèche mesurée 12 mm pour 8 mm maximum. Traces de patinage et gomme sur la poulie. Bruit caractéristique au démarrage.">${esc(ev.texte || '')}</textarea>
        <div class="btnrow" style="margin-top:10px">
          <button class="btn ${this.ecoute ? 'or' : 'ghost'}" data-a="dictee">${icoMic} ${this.ecoute ? 'Arrêter la dictée' : 'Dicter'}</button>
          <button class="btn ghost" data-a="relire" ${ev.texte ? '' : 'disabled'}>${icoRelire} Relire</button>
        </div>
        ${dispo ? '' : '<p class="assistant-note">Dictée indisponible sur ce navigateur : utilisez la dictée vocale de votre clavier Android.</p>'}`;
    }

    etapePhoto() {
      const ev = this.ev;
      const icoCamera = (window.ICO && window.ICO.camera(18)) || '';
      const icoGallery = (window.ICO && window.ICO.image(18)) || '';
      const icoPen = (window.ICO && window.ICO.pen(14)) || '';
      const icoRm = (window.ICO && window.ICO.close(16)) || '✕';
      return `<p class="assistant-question">Ajouter une photo</p>
        <p class="assistant-note">Prenez la photo puis annotez-la au doigt (flèche, cercle, texte) pour montrer précisément la zone concernée.</p>
        <div class="btnrow">
          <button class="btn" data-a="photo">${icoCamera} Prendre une photo</button>
          <button class="btn ghost" data-a="photo-lib">${icoGallery} Galerie</button>
        </div>
        <input type="file" id="evPhotoInput" accept="image/*" capture="environment" hidden>
        <input type="file" id="evPhotoLib" accept="image/*" multiple hidden>
        <div class="ev-photos">
          ${(ev.photos || []).map(function (p, i) {
            return `<div class="ev-photo">
              <img src="${p.dataUrl}" alt="photo ${i + 1}">
              <button type="button" class="ev-photo-annot" data-annot="${i}">${icoPen} Annoter</button>
              <button type="button" class="ev-photo-rm" data-retirer-photo="${i}">${icoRm}</button>
              ${(p.annotations && p.annotations.length) ? '<span class="ev-photo-badge">annotée</span>' : ''}
            </div>`;
          }).join('') || '<p class="assistant-note">Aucune photo pour l\'instant — vous pouvez continuer sans photo.</p>'}
        </div>`;
    }

    etapeCategorie() {
      const cats = this.categories(), choisi = this.ev.categorie;
      return `<p class="assistant-question">Comment qualifier cet évènement ?</p>
        <p class="assistant-note">Cette catégorie détermine la place de l'évènement dans le rapport : les problèmes de sécurité et les urgences apparaissent en premier.</p>
        <div class="categories">
          ${cats.map(function (c) {
            const icoHtml = (window.ICO && window.ICO.categorie(c.id || c.icone, 20)) || '';
            const checkHtml = (window.ICO && window.ICO.check(18)) || '✔';
            return `<button type="button" class="categorie${choisi === c.id ? ' on' : ''}" data-categorie="${esc(c.id)}"
              style="--c:${c.couleur};--f:${c.fond}">
              <span class="ico">${icoHtml}</span>
              <span class="lib">${esc(c.libelle)}</span>
              <span class="fleche">${choisi === c.id ? checkHtml : '›'}</span></button>`;
          }).join('')}
        </div>
        <div class="ev-recap">
          <div class="ev-recap-ligne"><span>Domaine</span><strong>${esc(this.libelleDomaine())}</strong></div>
          ${this.ev.machineNom ? `<div class="ev-recap-ligne"><span>Machine</span><strong>${esc(this.ev.machineNom)}</strong></div>` : ''}
          <div class="ev-recap-ligne"><span>Annotation</span><strong>${this.ev.texte ? this.ev.texte.length + ' caractère(s)' : 'vide'}</strong></div>
          <div class="ev-recap-ligne"><span>Photos</span><strong>${(this.ev.photos || []).length}</strong></div>
        </div>`;
    }

    domaineCourant() { return this.domaines().find(x => x.id === this.ev.domaine); }
    libelleDomaine() { const d = this.domaineCourant(); return d ? d.libelle : '—'; }

    /* ---------- photo ---------- */
    prendrePhoto() { this.choisirFichier('#evPhotoInput', false); }
    photoBibliotheque() { this.choisirFichier('#evPhotoLib', true); }

    choisirFichier(selecteur, multiple) {
      const input = this.overlay.querySelector(selecteur);
      input.multiple = multiple;
      input.value = '';
      const self = this;
      input.onchange = async function () {
        const fichiers = Array.prototype.slice.call(input.files || []);
        if (!fichiers.length) return;
        for (const f of fichiers) {
          if ((self.ev.photos || []).length >= 4) { self.toast('4 photos maximum par évènement'); break; }
          try {
            const dataUrl = await self.compresser(f, 1600, 0.82);
            const photo = { id: 'p' + Date.now() + Math.random().toString(36).slice(2, 6), dataUrl: dataUrl, annotations: [] };
            self.ev.photos = self.ev.photos || [];
            self.ev.photos.push(photo);
            self.maj();
            // on enchaîne directement sur l'annotation de la photo qui vient d'être prise
            await new Promise(function (resolve) {
              Annotation.ouvrir(photo, { fin: function (valide) { if (valide) self.maj(); resolve(); } });
            });
          } catch (e) { self.toast('Photo ignorée (format non pris en charge)'); }
        }
        self.rendre();
      };
      input.click();
    }

    compresser(file, maxDim, q) {
      return new Promise(function (resolve, reject) {
        const reader = new FileReader();
        reader.onload = function () {
          const img = new Image();
          img.onload = function () {
            const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
            const c = document.createElement('canvas');
            c.width = Math.round(img.width * scale);
            c.height = Math.round(img.height * scale);
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, c.width, c.height);
            ctx.drawImage(img, 0, 0, c.width, c.height);
            resolve(c.toDataURL('image/jpeg', q));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    /* ---------- dictée / relecture ---------- */
    basculerDictee() {
      if (this.ecoute) { this.arreterDictee(); this.rendre(); return; }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { this.toast('Dictée non disponible : utilisez le micro du clavier'); return; }
      const rec = new SR();
      rec.lang = 'fr-FR';
      rec.continuous = true;
      rec.interimResults = true;
      const self = this;
      const champ = this.corps.querySelector('#evTexte');
      let base = (self.ev.texte || '') ? self.ev.texte.replace(/\s+$/, '') + ' ' : '';
      rec.onresult = function (e) {
        let final = '', provisoire = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const t = e.results[i][0].transcript;
          if (e.results[i].isFinal) final += t; else provisoire += t;
        }
        if (final) base += final;
        self.ev.texte = base + provisoire;
        if (champ) { champ.value = self.ev.texte; champ.scrollTop = champ.scrollHeight; }
        self.maj();
      };
      rec.onerror = function () { self.arreterDictee(); self.rendre(); };
      rec.onend = function () { if (self.ecoute) { self.ecoute = false; self.rendre(); } };
      try { rec.start(); } catch (e) { self.toast('Micro indisponible'); return; }
      this.reconnaissance = rec;
      this.ecoute = true;
      this.toast('Dictée en cours… parlez');
      this.rendre();
      const champApres = this.corps.querySelector('#evTexte');
      if (champApres) champApres.focus();
    }

    arreterDictee() {
      if (this.reconnaissance) { try { this.reconnaissance.stop(); } catch (e) {} }
      this.reconnaissance = null;
      this.ecoute = false;
    }

    relire() {
      if (!this.ev.texte) { this.toast('Rien à relire'); return; }
      if (!('speechSynthesis' in window)) { this.toast('Relecture vocale indisponible'); return; }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(this.ev.texte);
      u.lang = 'fr-FR';
      u.rate = 1;
      window.speechSynthesis.speak(u);
      this.toast('Relecture vocale…');
    }
  }

  global.Assistant = {
    ouvrir: function (evenement, ctx) { return new Assistant(evenement, ctx); },
    nouvelEvenement: function (opts) {
      opts = opts || {};
      return {
        id: 'e' + Date.now() + Math.random().toString(36).slice(2, 6),
        domaine: opts.domaine || '',
        texte: opts.texte || '',
        photos: opts.photos || [],
        categorie: opts.categorie || '',
        heure: new Date().toISOString(),
        machineId: opts.machineId || '',
        machineNom: opts.machineNom || ''
      };
    }
  };
})(window);
</script>
